# 打包 Windows 客机镜像（供 ci.yml 的 qemu-shutdown-destruct 使用）
#
# 用 docker.io/dockurr/windows 自动装 Windows Server 2022 评估版，装完直接拿到 qcow2，
# 存进 GitHub Actions Cache，不占 Release（用户明确不想用 Release）。
#
# 为什么用 dockurr/windows 而不是自己写 unattend.xml：
#   · Windows 没有官方 cloud image，从 ISO 手写 unattend 装机有 20+ 个可失败点
#     （分区、驱动注入、OOBE 跳过、首次登录脚本时序…），失败时只有黑屏、诊断为零。
#   · dockurr/windows 已经把这条路走通并开源（Docker Hub 352 万次拉取），
#     它还**在自己的 GitHub Actions 上跑完整安装测试**（.github/workflows/install.yml，
#     runs-on: ubuntu-24.04）—— 这是本方案可行性的最强证据，比任何文档都硬。
#   · 它的 `DISK_FMT=qcow2` 直接落盘 qcow2，省掉一次 10 分钟的格式转换。
#   · 它的 `/oem/install.bat` 会在安装最后一步自动执行 —— 不用自己找注入时机。
#
# 存储选 Actions Cache 而不是 Release：
#   实测本仓库 cache 已用 67.6 MB / 上限 10 GB（gh api .../actions/cache/usage）。
#   Windows Server 2022 装完压缩后约 3-5 GB，放得下；单 asset 2 GiB 的 Release 限制也不用绕。
#   风险：cache 7 天未被访问会被清理。ci.yml 每次 push 都 restore 它 ⇒ 常态下会续期；
#   真被清了，那边应当**明确报错要求重建**，不能静默当成「没有镜像就跳过」。
#
# 安全取舍：
#   支持 `ssh_public_key` 输入。给了就用（推荐，私钥你自己保管并设成 secret）；
#   没给就自签并把私钥写进 job summary —— 一次跑完零手工，但私钥会留在 Actions 记录里，
#   所以 summary 里会显式警告并要求跑完轮换。
#
# Keep this file pure ASCII except the Chinese comments.

name: 打包 Windows 客机镜像

on:
  workflow_dispatch:
    inputs:
      ssh_public_key:
        description: '（推荐）注入镜像的 SSH 公钥（ssh-ed25519/ssh-rsa 单行）。留空则自签并把私钥写进 summary。'
        required: false
        default: ''
      guest_password:
        description: '客机 runner 账号密码'
        required: false
        default: 'Cx-Guest-2026!'
      version:
        description: 'Windows 版本（2022 = Server 2022，ISO ~6 GB）'
        required: false
        default: '2022'
      disk_size:
        description: '磁盘大小（稀疏）'
        required: false
        default: '32G'
      install_timeout_sec:
        description: '安装超时（秒）'
        required: false
        default: '3600'

permissions:
  contents: read
  actions: write

env:
  CACHE_KEY: cx-win2022-guest-qcow2-v1
  GUEST_USER: runner

jobs:
  build:
    name: 用 dockurr/windows 构建客机镜像
    runs-on: ubuntu-24.04
    # 硬上限 120 分钟：
    #   ISO 下载 ~3 min（6 GB / 微软 CDN）+ 无人值守安装 ~15-25 min
    #   + install.bat 配置（装 SSH / 注公钥 / 拷 exe）~5 min
    #   + 压缩 ~8 min + cache 上传 ~5 min。留足余量，因为共享 runner 上 QEMU 安装波动很大。
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境基线
        run: |
          set -u
          uname -a
          echo "NPROC=$(nproc)"
          free -h
          df -h /
          echo
          echo '=== KVM 设备 ==='
          ls -l /dev/kvm || echo '（无 /dev/kvm）'
          echo
          echo '=== /dev/net/tun（dockur 用于 macvlan，bridge 模式下非必需）==='
          ls -l /dev/net/tun || echo '（无 /dev/net/tun）'
          echo
          echo '=== docker ==='
          docker --version || echo '（无 docker）'
          docker info --format '{{.ServerVersion}} {{.Driver}}' 2>/dev/null || true
          echo "RUNNER_GROUPS=$(id -Gn | tr ' ' ',')"

      - name: KVM 提权并断言
        id: kvm
        run: |
          set -eu
          accessible() { [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; }
          if [ ! -e /dev/kvm ]; then
            echo '::error title=无 /dev/kvm::托管 runner 未提供 KVM，Windows 安装会超时'
            exit 1
          fi
          if ! accessible; then
            sudo chmod 666 /dev/kvm
            sleep 1
          fi
          accessible || { echo '::error title=KVM 不可读写::提权失败'; exit 1; }
          echo 'KVM_ACCESSIBLE=yes'

      - name: 安装依赖
        # ⚠️ 2026-11-11：加步骤级超时。实测托管 runner 偶发 DNS 故障
        #    （`Temporary failure resolving azure.archive.ubuntu.com`），
        #    apt-get 会反复重试、这个步骤能挂 9 分钟以上且不退出，
        #    而 job 级 timeout 是 120 分钟 —— 等于白烧 100 分钟。
        timeout-minutes: 8
        run: |
          set -u
          # apt 的 DNS 抖动是环境问题，不是代码问题。策略：
          #   ① 给 apt 设较短的重试与超时，别让它无限等；
          #   ② 失败允许**有限次重试**；
          #   ③ 最终失败必须 exit 1（不静默跳过，否则后面会以
          #      「qemu-system-x86_64: command not found」的形式炸在最后一步，
          #      诊断信息严重错位）。
          # ⚠️ 2026-11-11 真因（拿到执行输出后确认）：
          #   `apt-get update -qq` 在**所有索引都下载失败时仍返回 0**。
          #   实测日志：四条 `Temporary failure resolving azure.archive.ubuntu.com`
          #   之后紧跟一行 `apt-get update 成功` —— 我的重试循环第 1 次就判定成功，
          #   然后 `apt-get install` 拿残缺索引解析依赖、反复超时，撞 8 分钟步骤超时。
          #   ⇒ 不能相信 update 的退出码。改三层判据：
          #      ① 先探测镜像站 DNS+TCP 可达性（这才是根因所在）
          #      ② update 加 --error-on-any-failure（让部分失败变非零）
          #      ③ 装完断言二进制真的存在（成功判据是「能跑」不是「apt 返回 0」）
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"

          # ① 镜像站可达性探测：能解析 + TCP 80 能连
          probe_mirror() {
            local host="$1"
            getent hosts "$host" >/dev/null 2>&1 || return 1
            timeout 8 bash -c "exec 3<>/dev/tcp/$host/80" 2>/dev/null || return 1
            return 0
          }

          echo "--- 镜像站可达性探测 ---"
          MIRROR_OK=no
          for h in azure.archive.ubuntu.com archive.ubuntu.com ports.ubuntu.com; do
            if probe_mirror "$h"; then
              echo "  $h 可达"
              MIRROR_OK=yes
            else
              echo "  $h 不可达"
            fi
          done
          if [ "$MIRROR_OK" != yes ]; then
            echo "::error title=所有 apt 镜像站都不可达::这是 runner 的 DNS/网络故障，不是仓库代码问题"
            echo "--- DNS 诊断 ---"
            cat /etc/resolv.conf 2>/dev/null || true
            getent hosts archive.ubuntu.com || echo "(archive.ubuntu.com 解析失败)"
            getent hosts azure.archive.ubuntu.com || echo "(azure.archive.ubuntu.com 解析失败)"
            curl -sS --max-time 10 -o /dev/null -w "github.com http=%{http_code}\n" https://github.com || echo "(github.com 不可达)"
            exit 1
          fi

          # ② update 加 --error-on-any-failure，让「部分索引拿不到」变成非零
          ok=no
          for attempt in 1 2 3; do
            echo "=== apt-get update 第 $attempt 次 ==="
            if sudo apt-get update -qq --error-on-any-failure $APT_OPTS 2>&1 | tail -20; then
              echo "apt-get update 真成功"
              ok=yes; break
            fi
            echo "apt-get update 失败（第 $attempt 次），10 秒后重试"
            sleep 10
          done
          if [ "$ok" != yes ]; then
            echo "::error title=apt-get update 连续 3 次失败::镜像站可达但索引拉不下来"
            ls -la /var/lib/apt/lists/ 2>/dev/null | head -20 || true
            exit 1
          fi

          # ③ install 单独限时 180 秒，防止用残缺索引无限重试
          if ! timeout 180 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
               --error-on-any-failure $APT_OPTS \
               qemu-utils qemu-system-x86 openssh-client genisoimage 2>&1 | tail -20; then
            echo "::error title=apt install 失败或超时::qemu/system 依赖装不上"
            exit 1
          fi
          # ⚠️ qemu-utils 只提供 qemu-img（转换/压缩）；
          #    「验证 SSH 可连」那步要启动客机，需要 qemu-system-x86_64，
          #    它在 qemu-system-x86 包里。漏了这个包会报：
          #      qemu-system-x86_64: command not found  (exit 127)
          # ⇒ 装完立刻断言二进制存在且可执行，把错误提前到这一步暴露。
          for bin in qemu-img qemu-system-x86_64 genisoimage ssh; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "::error title=缺少 $bin::apt 装完但二进制不存在"
              exit 1
            fi
          done
          qemu-system-x86_64 --version | head -1
          qemu-system-x86_64 -accel help 2>/dev/null | head -5 || true
          qemu-img --version | head -1
          # 磁盘预算：ISO 6 GB + 安装中镜像 + 最终 qcow2，32G 稀疏盘在 86G 可用空间下安全。
          df -h /

      - name: 准备 SSH 密钥
        id: keys
        env:
          INPUT_PUBKEY: ${{ github.event.inputs.ssh_public_key }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          mkdir -p "$WORK/oem" "$WORK/storage"
          if [ -n "${INPUT_PUBKEY:-}" ]; then
            printf '%s\n' "$INPUT_PUBKEY" > "$WORK/id.pub"
            KEY_SOURCE=input
          else
            ssh-keygen -t ed25519 -N '' -C 'cx-ci-guest-image' -f "$WORK/id" >/dev/null
            cp "$WORK/id.pub" "$WORK/pub.tmp" && mv "$WORK/pub.tmp" "$WORK/id.pub"
            KEY_SOURCE=generated
          fi
          # sshd 对公钥格式极严格：类型 + 一个空格 + base64，多一个空格就静默拒绝。
          grep -qE '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256) [A-Za-z0-9+/=]+' "$WORK/id.pub" \
            || { echo '::error title=公钥格式不合法::必须是 ssh-ed25519 / ssh-rsa / ecdsa 开头的单行'; exit 1; }
          echo "PUBKEY_PREFIX=$(cut -c1-40 "$WORK/id.pub")..."
          echo "KEY_SOURCE=$KEY_SOURCE" >> "$GITHUB_OUTPUT"

          {
            echo '## SSH 密钥'
            echo ''
            echo "- 来源：**$KEY_SOURCE**"
            if [ "$KEY_SOURCE" = generated ]; then
              echo ''
              echo '> ⚠️ 私钥在下面，**只显示这一次**。请立刻保存为仓库 secret `CX_QEMU_GUEST_SSH_KEY` 并轮换。'
              echo ''
              echo '```'
              cat "$WORK/id"
              echo '```'
            else
              echo ''
              echo '请确认对应私钥已设为 secret `CX_QEMU_GUEST_SSH_KEY`。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ 不能在 ubuntu runner 上构建 purge-tests.exe：
      #   `windows/native-source/build-windows.ps1` 硬依赖 MSVC 编译器、
      #   Windows SDK 与注册表 `HKLM:\SOFTWARE\Microsoft\Windows Kits`，
      #   在 Linux 上会报 `A parameter cannot be found that matches parameter name 'File'`
      #   （Get-ChildItem 的 -Path 枚举行为不同 + 后续 MSVC 探测必失败）。
      #   ⇒ 改为从 `ci.yml` 的 windows-build job 已上传的 artifact 里取现成产物。
      #   artifact 名：windows-ci-build-<sha>，内含 windows/native-build/（含 bin/purge-tests.exe）。
      - name: 下载 purge-tests.exe（来自 windows-build artifact）
        id: getexe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          mkdir -p "$WORK/oem"

          # 优先用本仓库最近一次成功 ci.yml run 的 artifact（同一次 push 不一定跑了 windows-build，
          # 因为这个 workflow 是独立的 workflow_dispatch）。
          SHA="$GITHUB_SHA"
          ART="windows-ci-build-$SHA"

          echo "尝试下载 artifact: $ART"
          set +e
          # ⚠️ 不能把 gh 的输出用管道接 sed：那样 RC=$? 取到的是 **sed 的退出码**（恒 0），
          #    gh 失败会被静默吞掉，后面 find 找不到文件才报错 —— 诊断信息会错位。
          #    改为先落盘再打印，保住 gh 的退出码。
          gh run download --repo "$GITHUB_REPOSITORY" -n "$ART" -D "$WORK/art" > "$WORK/art.log" 2>&1
          RC=$?
          echo "--- gh run download 输出（前 20 行）---"
          head -20 "$WORK/art.log" 2>/dev/null || true
          set -e

          if [ $RC -ne 0 ]; then
            echo "同 sha 没有 artifact，回退到最近一次成功的 ci.yml run"
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
                       --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "${RUN_ID:-}" ]; then
              echo '::error title=找不到 windows-build 产物::需要先有一次成功的 ci.yml run（它会产生 purge-tests.exe）'
              exit 1
            fi
            echo "使用 run $RUN_ID"
            ART=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
                    --jq '.artifacts[] | select(.name | startswith("windows-ci-build-")) | .name' | head -n1)
            if [ -z "${ART:-}" ]; then
              echo '::error title=该 run 没有 windows-ci-build artifact'
              exit 1
            fi
            echo "下载 artifact: $ART"
            gh run download --repo "$GITHUB_REPOSITORY" -n "$ART" -D "$WORK/art"
          fi

          # artifact 解包后路径为 <art>/windows/native-build/bin/purge-tests.exe
          EXE=$(find "$WORK/art" -type f -name 'purge-tests.exe' | head -n1)
          if [ -z "${EXE:-}" ]; then
            echo '::error title=artifact 里没有 purge-tests.exe::列出内容'
            find "$WORK/art" -type f | head -50
            exit 1
          fi
          SIZE=$(stat -c %s "$EXE")
          echo "purge-tests.exe = $SIZE 字节（来自 $EXE）"
          if [ "$SIZE" -lt 1000 ]; then
            echo '::error title=purge-tests.exe 体积异常::小于 1000 字节，可能是占位文件'
            exit 1
          fi
          cp "$EXE" "$WORK/oem/purge-tests.exe"
          echo "已拷贝到 $WORK/oem/purge-tests.exe"
          echo "exe_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "exe_source=$ART" >> "$GITHUB_OUTPUT"

      # ── OEM：dockur 会把 /oem 下所有文件放进 ISO 的 $OEM$，并把 install.bat
      #    在**安装最后一步**自动执行；同目录其余文件被拷到 C:\OEM。
      #    这是本方案「配置镜像」的唯一注入点，不需要自己找时机。
      - name: 生成 OEM install.bat
        env:
          GUEST_PASSWORD: ${{ github.event.inputs.guest_password }}
          GUEST_USER: ${{ env.GUEST_USER }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          PUBKEY=$(cat "$WORK/id.pub")

          # ── OpenSSH 离线包（关键，2026-11-11）────────────────────────────
          # 为什么不靠 Windows Update：Add-WindowsCapability 对 OpenSSH.Server
          # 是从 WU 拉包，dockur 容器内 Windows 走 NAT，能否出网无保证。
          # 装不上的后果是 sshd 根本不存在，而宿主侧只看到「banner exchange 超时」
          # —— QEMU slirp 会先 accept 再转发，没有 sshd 时同样表现为超时。
          # 这里把微软官方 Win32-OpenSSH zip（约 4.9 MB）下到 OEM，随 $OEM$ 进镜像。
          OSSH_URL="https://github.com/PowerShell/Win32-OpenSSH/releases/download/v9.8.3.0p2-Preview/OpenSSH-Win64.zip"
          if ! curl -fL --retry 3 --retry-delay 2 --max-time 180 \
               -o "$WORK/oem/OpenSSH-Win64.zip" "$OSSH_URL"; then
            echo "::error title=下载 OpenSSH 离线包失败::$OSSH_URL"
            exit 1
          fi
          OSSH_SIZE=$(stat -c %s "$WORK/oem/OpenSSH-Win64.zip")
          echo "OpenSSH-Win64.zip = $OSSH_SIZE 字节"
          if [ "$OSSH_SIZE" -lt 1000000 ]; then
            echo "::error title=OpenSSH 包体积异常::只有 $OSSH_SIZE 字节（预期约 4.9 MB）"
            exit 1
          fi
          # zip 魔数必须是 PK\x03\x04，防止拿到 HTML 错误页
          OSSH_MAGIC=$(head -c 4 "$WORK/oem/OpenSSH-Win64.zip" | od -An -tx1 | tr -d ' \n')
          echo "zip magic = $OSSH_MAGIC"
          case "$OSSH_MAGIC" in
            504b0304*) echo 'zip 魔数正确' ;;
            *) echo "::error title=OpenSSH 包不是 zip::magic=$OSSH_MAGIC"; exit 1 ;;
          esac

          # 密码里若有 % 会让 bat 的 %VAR% 展开出问题；这里限制字符集并校验。
          case "$GUEST_PASSWORD" in
            *%*|*\'*|*\"*) echo '::error title=密码含特殊字符::bat 里会导致展开异常，请改用字母数字与 -_.!'; exit 1 ;;
          esac

          # 注意：bat 里 % 是变量前缀，PowerShell 的 $ 在 bat 中无特殊含义，可直接用。
          # 所有 PowerShell 都用 -EncodedCommand 会更好，但可读性差、排障困难；
          # 这里用 -Command 并把脚本写成单独 .ps1 文件由 bat 调用，兼顾可读与安全。
          cat > "$WORK/oem/setup.ps1" <<PSSETUP
          \$ErrorActionPreference = 'Continue'
          \$log = 'C:\OEM\setup.log'
          function Say(\$m) { "\$([datetime]::UtcNow.ToString('o')) \$m" | Tee-Object -FilePath \$log -Append }

          # ── 2026-11-11（t111）：把每一步的结果**实时**回传到宿主侧 ──
          #
          # 为什么必须有：上一轮 SSH 连不上，而宿主机唯一能看到的证据（setup.log）
          # 要等 install.bat 跑完才回传；一旦中途出问题或回传失败，宿主机就完全瞎了。
          # 这个函数在**每一步执行完立刻**追加一行到 \\host.lan\Data\setup-steps.txt，
          # 于是即使 SSH 完全不通、即使 install.bat 后面崩了，
          # 宿主侧 /data 里也已经留下了「做到了哪一步、每步结果是什么」。
          #
          # 用 AppendAllText 而不是 Set-Content：每次只追加一行，不重写整个文件，
          # 这样即使中途断电也不会把已写的内容丢光。
          \$stepsFile = '\\\\host.lan\\Data\\setup-steps.txt'
          \$stepsLocal = 'C:\OEM\setup-steps.txt'
          function StepReport(\$name, \$value) {
            \$line = "{0} {1} = {2}" -f [datetime]::UtcNow.ToString('HH:mm:ss'), \$name, \$value
            # 本地一份（客机内可查）
            try { Add-Content -LiteralPath \$stepsLocal -Value \$line -Encoding ascii -ErrorAction SilentlyContinue } catch { }
            # 共享一份（宿主 /data 可查）—— 这是关键通道
            try { Add-Content -LiteralPath \$stepsFile -Value \$line -Encoding ascii -ErrorAction SilentlyContinue } catch { }
            Say "STEP \$line"
          }
          # 立刻写一行「活着」，这样哪怕后面立刻崩了，宿主侧也能知道 setup.ps1 起过
          StepReport 'SetupStart' 'begin'

          try {
            Say 'setup start'

            # 1) 装 OpenSSH Server。Server 2022 评估版默认没有它。
            #
            # ⚠️ 2026-11-11（t111）：这一段原先用 `Add-WindowsCapability ... | Out-Null`，
            #    把**成败静默掉了**。而它在无人值守环境里最常见的失败原因是拿不到
            #    Windows Update 源（dockur 的 NAT 能否出网未验证）。
            #    失败后 Set-Service/Start-Service 会连环报错，但 $ErrorActionPreference='Continue'
            #    让它继续往下走，最后只留一行模糊的 status。
            #    ⇒ 改成：抓返回码、显式记录 State、失败立刻回传 StepReport。
            # ⭐ 2026-11-11 关键：**优先用离线 zip**，完全不依赖 Windows Update。
            #    Add-WindowsCapability 对 OpenSSH.Server 这种「按需功能」是从 WU 拉包，
            #    dockur 容器内 Windows 走 NAT，能否走到 WU 不保证。装不上的后果是
            #    sshd 根本不存在，而宿主侧只看到「banner exchange 超时」——
            #    因为 QEMU slirp 会先 accept 再转发，没有 sshd 时同样表现为超时而非 refused。
            #    zip 是微软官方 PowerShell/Win32-OpenSSH 发行包，随 OEM 进镜像，
            #    解压 + install-sshd.ps1 即可，确定性最高。
            $osshZip = 'C:\OEM\OpenSSH-Win64.zip'
            $osshDir = 'C:\Program Files\OpenSSH-Win64'
            $osshMode = 'capability'
            if (Test-Path $osshZip) {
              Say 'OpenSSH install mode=offline-zip'
              try {
                if (-not (Test-Path $osshDir)) {
                  Expand-Archive -LiteralPath $osshZip -DestinationPath 'C:\Program Files' -Force -ErrorAction Stop
                }
                $sshdExe = Join-Path $osshDir 'sshd.exe'
                Say "offline: sshd.exe exists=$(Test-Path $sshdExe)"
                # host key 首次必须生成，否则 sshd 起不来
                & (Join-Path $osshDir 'ssh-keygen.exe') -A 2>&1 | ForEach-Object { Say "keygen: $_" }
                # 注册服务 + 自启 + 防火墙规则
                & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $osshDir 'install-sshd.ps1') 2>&1 | ForEach-Object { Say "install-sshd: $_" }
                # sshd 需要能找到自身 dll
                $env:Path = "$osshDir;$env:Path"
                [Environment]::SetEnvironmentVariable('Path', "$osshDir;" + [Environment]::GetEnvironmentVariable('Path','Machine'), 'Machine')
                $osshMode = 'offline-zip-ok'
              } catch {
                Say "ERROR offline zip install failed: $_"
                $osshMode = 'offline-zip-failed'
              }
              StepReport 'OpenSSHInstallMode' $osshMode
            } else {
              Say 'WARN OpenSSH zip 不在 OEM，回退到 Windows Update（可能失败）'
              StepReport 'OpenSSHInstallMode' 'fallback-capability-no-zip'
            }

            # 下面这段是 WU 路径：只有在没有 zip 时才真正执行。
            # 有 zip 成功时 $osshMode=offline-zip-ok，跳过 WU 避免无谓联网等待。
            if ($osshMode -notlike 'offline-zip-ok') {
            # 1) 装 OpenSSH Server（回退路径）
            \$capErr = ''
            \$capAdded = 'not-attempted'
            try {
              \$cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1
              if (-not \$cap) {
                \$capErr = 'capability-not-offered'
                Say "ERROR OpenSSH.Server capability 不存在（此 SKU 未提供？）"
              } elseif (\$cap.State -eq 'Installed') {
                \$capAdded = 'already-installed'
                Say 'OpenSSH.Server already installed'
              } else {
                Say "installing OpenSSH.Server (was \$(\$cap.State))"
                # 不加 Out-Null：要能拿到异常与返回码
                \$r = Add-WindowsCapability -Online -Name \$cap.Name -ErrorAction Stop
                \$capAdded = "ok(rc=\$(\$r.RestartNeeded))"
                Say "Add-WindowsCapability 完成 RestartNeeded=\$(\$r.RestartNeeded)"
              }
            } catch {
              \$capAdded = 'failed'
              \$capErr = \$_.Exception.Message
              Say "ERROR Add-WindowsCapability 失败: \$capErr"
              Say '  → 常见原因：dockur NAT 出不了网，拉不到 Windows Update 源'
            }
            StepReport 'AddWindowsCapability' \$capAdded
            if (\$capErr) { StepReport 'AddWindowsCapabilityError' \$capErr }

            # 装完必须复核一次 State —— 返回码 ok 不等于真的变成 Installed
            try {
              \$capAfter = (Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1).State
            } catch { \$capAfter = 'query-failed' }
            Say "OpenSSH.Server state-after=\$capAfter"
            StepReport 'OpenSSHServerStateAfter' "\$capAfter"

            }  # end of WU fallback branch (offline-zip 成功时跳过)
            # sshd 服务是否存在（装不上时这里就是 False，一目了然）
            \$svcExists = \$null -ne (Get-Service -Name sshd -ErrorAction SilentlyContinue)
            Say "sshd service exists=\$svcExists"
            StepReport 'SshdServiceExists' "\$svcExists"

            if (\$svcExists) {
              try {
                Set-Service -Name sshd -StartupType Automatic
                StepReport 'SetServiceStartup' 'ok'
              } catch {
                StepReport 'SetServiceStartup' "failed: \$(\$_.Exception.Message)"
              }
              try {
                Start-Service sshd
                StepReport 'StartService' 'ok'
              } catch {
                StepReport 'StartService' "failed: \$(\$_.Exception.Message)"
              }
              \$sshdStatus = (Get-Service sshd).Status
              \$sshdStartType = (Get-Service sshd).StartType
              Say "sshd status=\$sshdStatus startup=\$sshdStartType"
              StepReport 'SshdStatus' "\$sshdStatus"
              StepReport 'SshdStartType' "\$sshdStartType"
            } else {
              Say 'ERROR sshd 服务不存在 —— OpenSSH Server 没装上，SSH 必然连不通'
              StepReport 'SshdStatus' 'service-missing'
            }

            # sshd 进程在不在（比服务状态更硬：服务 Running 也可能进程早退了）
            \$sshProc = @(Get-Process -Name sshd -ErrorAction SilentlyContinue).Count
            Say "sshd processes=\$sshProc"
            StepReport 'SshdProcessCount' "\$sshProc"

            # 22 端口监听状态。这是「宿主侧连不通」时最直接的证据：
            # 没有 LISTENING 就说明 sshd 没在听，而不是防火墙或密钥问题。
            try {
              \$listen = @(Get-NetTCPConnection -LocalPort 22 -State Listen -ErrorAction SilentlyContinue).Count
            } catch { \$listen = 'query-failed' }
            Say "port22 listening-entries=\$listen"
            StepReport 'Port22Listen' "\$listen"

            # 2) 防火墙放行 22。漏这条的现象是「端口拒绝」，极易误判成 sshd 没起。
            if (-not (Get-NetFirewallRule -Name 'CX-SSHD-22' -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule -Name 'CX-SSHD-22' -DisplayName 'CX SSHD 22' \`
                -Protocol TCP -LocalPort 22 -Action Allow -Direction Inbound | Out-Null
              Say 'firewall rule added'
            } else { Say 'firewall rule exists' }

            # 3) 公钥 + **ACL**。
            #    Windows sshd 对 administrators_authorized_keys 的权限极挑剔：
            #    Users / Authenticated Users 只要有读权限，sshd 就直接拒绝认证，
            #    日志里只写 Permission denied，完全看不出是 ACL 问题。
            #    正确做法：关继承，只留 Administrators + SYSTEM。
            \$sshDir = 'C:\ProgramData\ssh'
            New-Item -ItemType Directory -Force -Path \$sshDir | Out-Null
            \$ak = Join-Path \$sshDir 'administrators_authorized_keys'
            Set-Content -LiteralPath \$ak -Value (Get-Content 'C:\OEM\id.pub' -Raw).Trim() -Encoding ascii
            icacls \$ak /inheritance:r | Out-Null
            icacls \$ak /grant 'Administrators:F' | Out-Null
            icacls \$ak /grant 'SYSTEM:F' | Out-Null
            Say "acl=\$((icacls \$ak) -join ' | ')"

            # 4) 钉住 PubkeyAuthentication，然后重启 sshd 让配置生效。
            \$cfg = Join-Path \$sshDir 'sshd_config'
            if (Test-Path \$cfg) {
              \$c = Get-Content \$cfg -Raw
              if (\$c -notmatch '(?m)^\s*PubkeyAuthentication\s+yes') {
                Add-Content \$cfg "\`nPubkeyAuthentication yes"
                Say 'sshd_config: appended PubkeyAuthentication yes'
              }
              Restart-Service sshd
              Say "sshd restarted, status=\$((Get-Service sshd).Status)"
            }

            # 5) purge-tests.exe 到约定路径
            New-Item -ItemType Directory -Force -Path 'C:\cx\native' | Out-Null
            if (Test-Path 'C:\OEM\purge-tests.exe') {
              Copy-Item 'C:\OEM\purge-tests.exe' 'C:\cx\native\purge-tests.exe' -Force
              Say 'purge-tests.exe deployed'
            } else { Say 'ERROR purge-tests.exe missing from OEM' }

            # 6) 自检：把关键结论写进日志，之后可以从镜像外核对
            Say "verify whoami=\$(whoami)"
            Say "verify exe=\$(Test-Path 'C:\cx\native\purge-tests.exe')"
            Say "verify keys=\$(Test-Path 'C:\ProgramData\ssh\administrators_authorized_keys')"
            StepReport 'VerifyExe' "\$(Test-Path 'C:\cx\native\purge-tests.exe')"
            StepReport 'VerifyKeys' "\$(Test-Path 'C:\ProgramData\ssh\administrators_authorized_keys')"
            # 最终结论行：宿主侧只读这一行就能判断「镜像是好是坏」
            \$sshOk = \$false
            try {
              \$svc = Get-Service sshd -ErrorAction SilentlyContinue
              \$listen = @(Get-NetTCPConnection -LocalPort 22 -State Listen -ErrorAction SilentlyContinue).Count
              if (\$svc -and \$svc.Status -eq 'Running' -and \$listen -gt 0) { \$sshOk = \$true }
            } catch { }
            StepReport 'SSH_VERDICT' \$(if (\$sshOk) { 'READY' } else { 'NOT-READY' })
            Say 'setup done'
          } catch {
            Say "FATAL \$(\$_.Exception.Message)"
            StepReport 'FATAL' \$_.Exception.Message
            StepReport 'SSH_VERDICT' 'SETUP-CRASHED'
          }
          PSSETUP

          printf '%s\n' "$PUBKEY" > "$WORK/oem/id.pub"

          # install.bat：dockur 在安装最后一步执行它。
          #
          # ⚠️ 关键（2026-11-11 修正）：宿主机的 /oem 是**只读输入**，客机往 C:\OEM 写东西
          # 不会回到宿主机。/oem 里那个 install.done 永远等不到 —— 上一版就死在这里。
          # 唯一能把信号送回宿主机的通道是 Samba 共享 \\host.lan\Data（宿主 /data）。
          # 所以下面**两条都要做**：客机内留一份（本地可查），再 copy 一份到共享。
          cat > "$WORK/oem/install.bat" <<'BATEOF'
          @echo off
          setlocal
          echo === CX OEM install begin ===
          del /Q C:\OEM\install.done 2>nul

          REM 执行 setup.ps1（放单独文件而不是内联，避免 bat 的转义地狱）
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\OEM\setup.ps1
          set SETUP_RC=%ERRORLEVEL%
          echo setup.ps1 exit=%SETUP_RC%

          REM 把 setup.log 一并留在 OEM 目录（客机内可查）
          if exist C:\OEM\setup.log type C:\OEM\setup.log

          echo === CX OEM install end ===
          REM 本地标记
          type nul > C:\OEM\install.done

          REM ── 回传到宿主机 /data（唯一有效通道）──
          REM \\host.lan\Data 是 dockur 的 Samba "Data" 共享，对应 docker 的 -v ...:/data。
          REM 先写 .tmp 再 move，避免宿主机读到半截文件（与 dockur 自己 sync-log.bat 同手法）。
          REM ⚠️ bat 的 `if (...) else (...)` 块里用 `&&` 会因解析规则出错，
          REM    所以每个命令单独一行、各自判 errorlevel。
          if exist C:\OEM\setup.log (
            copy /Y C:\OEM\setup.log \\host.lan\Data\setup.tmp >nul 2>&1
            move /Y \\host.lan\Data\setup.tmp \\host.lan\Data\setup.log >nul 2>&1
          )

          copy /Y C:\OEM\install.done \\host.lan\Data\install.tmp >nul 2>&1
          if errorlevel 1 (
            echo WARN could-not-copy-done-to-samba
          ) else (
            move /Y \\host.lan\Data\install.tmp \\host.lan\Data\install.done >nul 2>&1
            echo done-marker-synced
          )

          REM install.log 由 dockur 的 LOG=Y 写入；存在才回传，不硬失败。
          if exist C:\OEM\install.log (
            copy /Y C:\OEM\install.log \\host.lan\Data\install.tmp >nul 2>&1
            move /Y \\host.lan\Data\install.tmp \\host.lan\Data\install.log >nul 2>&1
          )
          BATEOF

          # 去掉 heredoc 的公共前导空格（bat 对行首空格敏感）
          sed -i 's/^          //' "$WORK/oem/install.bat"
          sed -i 's/^          //' "$WORK/oem/setup.ps1"

          echo '=== install.bat 前 12 行 ==='
          head -12 "$WORK/oem/install.bat"
          echo "INSTALL_BAT_BYTES=$(stat -c %s "$WORK/oem/install.bat")"
          echo "SETUP_PS1_BYTES=$(stat -c %s "$WORK/oem/setup.ps1")"
          ls -l "$WORK/oem"

      - name: 启动 dockurr/windows 安装
        id: install
        env:
          GUEST_PASSWORD: ${{ github.event.inputs.guest_password }}
          GUEST_USER: ${{ env.GUEST_USER }}
          VERSION: ${{ github.event.inputs.version }}
          DISK_SIZE: ${{ github.event.inputs.disk_size }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          START=$(date +%s)
          echo "INSTALL_START_EPOCH=$START" >> "$GITHUB_OUTPUT"

          # 三个挂载点，各有明确用途（少一个就有一类信息永远看不到）：
          #   /storage  —— 磁盘与 ISO（dockur 的主工作区）
          #   /oem      —— **只读输入**：install.bat + 同目录附件，被 dockur 打进 ISO 的 $OEM$
          #                客机写的东西**不会**回到这里，别拿它当回传通道
          #   /data     —— **双向共享**：对应客机里的 \\host.lan\Data（Samba 的 Data 共享）。
          #                这是唯一能把客机内进度传回宿主机的通道。见下方「等待安装完成」。
          mkdir -p "$WORK/data"
          # 8006 只绑 loopback：仅给本 job 抓安装界面截图用，不对外暴露。
          docker run -d --name cxwin \
            --device=/dev/kvm \
            -e VERSION="$VERSION" \
            -e DISK_FMT=qcow2 \
            -e DISK_SIZE="$DISK_SIZE" \
            -e USERNAME="$GUEST_USER" \
            -e PASSWORD="$GUEST_PASSWORD" \
            -e LANGUAGE=English \
            -e REGION=en-US \
            -e KEYBOARD=en-US \
            -e LOG=Y \
            -p 127.0.0.1:8006:8006 \
            -v "$WORK/storage:/storage" \
            -v "$WORK/oem:/oem" \
            -v "$WORK/data:/data" \
            docker.io/dockurr/windows:latest
          echo "CONTAINER_ID=$(docker ps -q --filter name=cxwin)"
          echo '=== 镜像版本 ==='
          docker inspect --format '{{.Config.Image}} {{.Image}}' cxwin || true
          echo '=== 挂载确认（/data 必须在，否则进度与完成信号都看不到）==='
          docker inspect --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' cxwin || true

      - name: 等待安装完成
        id: wait
        env:
          INSTALL_TIMEOUT: ${{ github.event.inputs.install_timeout_sec }}
        run: |
          set -u
          WORK="$RUNNER_TEMP/guest"
          DATA="$WORK/data"
          START=$(date +%s)
          DEADLINE=$(( START + INSTALL_TIMEOUT ))
          RESULT=timeout

          # ── 完成判据（2026-11-11 修正：上一版查错了地方，必然死等）──
          # 旧代码查 `$WORK/oem/install.done` —— 那是宿主机上的 /oem **只读输入**挂载源。
          # 客机写 C:\OEM\install.done 只发生在客机内，永远不会出现在宿主机 /oem 里。
          # 正确的回传通道是 Samba 共享 \\host.lan\Data → 宿主机 /data（见 docker run 的 -v）。
          # 所以这里查 $DATA 下的标记；install.bat 会显式 copy 一份过去。
          DONE_MARKER="$DATA/install.done"
          # 兜底判据：即使 install.done 因故没回传，只要回传的 install.log 里
          # 出现我们的收尾标记，也算完成 —— 一个信号失败不代表流程失败。
          LOG_MARKER_TEXT='CX OEM install end'

          # ── 进度信号：不再用「磁盘总量」──
          # 旧版打 `du -sh storage`，它从 14G 涨到 15G 后就再也不动，完全无法区分
          # 「装完了在等判据」与「卡在某个 Setup 界面」。改为盯**变化**：
          #   · data/install.log 的大小与 mtime（dockur 的 LOG=Y 会持续写）
          #   · docker logs 的行数（dockur 会打安装阶段）
          #   · storage 下 qcow2 的 mtime + 大小
          # 任一项在变 = 在推进；全都不变 = 卡住。
          last_fp=''
          last_change_ts=$START
          stall_reported=no
          stall_threshold=900      # 连续 15 分钟无任何信号变化 ⇒ 判疑似卡死
          tick=0

          fingerprint() {
            # 把三个信号压成一个字符串，用于比较「这次和上次是否一样」。
            local log_size=0 log_mtime=0 qcow_size=0 qcow_mtime=0 dlog_lines=0
            [ -f "$DATA/install.log" ] && {
              log_size=$(stat -c %s "$DATA/install.log" 2>/dev/null || echo 0)
              log_mtime=$(stat -c %Y "$DATA/install.log" 2>/dev/null || echo 0)
            }
            local q
            for q in "$WORK/storage/data.qcow2" "$WORK/storage/windows.qcow2"; do
              if [ -f "$q" ]; then
                qcow_size=$(stat -c %s "$q" 2>/dev/null || echo 0)
                qcow_mtime=$(stat -c %Y "$q" 2>/dev/null || echo 0)
                break
              fi
            done
            dlog_lines=$(docker logs cxwin 2>&1 | wc -l || echo 0)
            echo "log:${log_size}@${log_mtime} qcow:${qcow_size}@${qcow_mtime} dlog:${dlog_lines}"
          }

          report_progress() {
            local fp="$1" now idle
            now=$(date +%s)
            idle=$(( now - last_change_ts ))
            echo "[$(date -u +%T)] tick=${tick} idle=${idle}s  ${fp}"
            # 判据三态：有变化 = 推进；无变化但短于阈值 = 观望；超过阈值 = 疑似卡死
            if [ "$idle" -ge "$stall_threshold" ] && [ "$stall_reported" = no ]; then
              echo "::warning title=疑似卡死::已连续 ${idle}s 无任何进度信号变化"
              echo '--- docker ps ---'
              docker ps -a --filter name=cxwin || true
              echo '--- docker logs 尾部 80 行 ---'
              docker logs cxwin 2>&1 | tail -80 || true
              echo '--- /data 内容 ---'
              ls -la "$DATA" 2>/dev/null || echo '(空或不存在)'
              echo '--- /storage 内容 ---'
              ls -la "$WORK/storage" 2>/dev/null || echo '(空或不存在)'
              stall_reported=yes
            fi
          }

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            tick=$(( tick + 1 ))

            # 完成判据 ①：install.done 已回传到 /data
            if [ -f "$DONE_MARKER" ]; then RESULT=done; break; fi
            # 完成判据 ②：回传的 install.log 里有收尾标记
            if [ -f "$DATA/install.log" ] && grep -q "$LOG_MARKER_TEXT" "$DATA/install.log" 2>/dev/null; then
              RESULT=done-by-log; break
            fi
            # 容器退出 = 安装失败（除非上面已判 done）
            if ! docker ps -q --filter name=cxwin | grep -q .; then
              RESULT=container-exited; break
            fi

            CUR=$(fingerprint)
            if [ "$CUR" != "$last_fp" ]; then
              last_fp="$CUR"
              last_change_ts=$(date +%s)
              stall_reported=no
            fi
            # 每 2 分钟一行（tick % 6，因为 sleep 20）
            if [ $(( tick % 6 )) -eq 1 ]; then
              report_progress "$CUR"
            fi
            sleep 20
          done
          ELAPSED=$(( $(date +%s) - START ))
          echo "INSTALL_RESULT=$RESULT"
          echo "INSTALL_ELAPSED_SEC=$ELAPSED"
          echo "INSTALL_RESULT=$RESULT" >> "$GITHUB_OUTPUT"
          echo "INSTALL_ELAPSED_SEC=$ELAPSED" >> "$GITHUB_OUTPUT"

          echo '=== 完成判据现场 ==='
          echo "DONE_MARKER_EXISTS=$([ -f "$DONE_MARKER" ] && echo yes || echo no)"
          echo "DATA_DIR_LISTING:"
          ls -la "$DATA" 2>/dev/null || echo '(no /data)'
          echo '=== 回传的 install.log 尾部 80 行 ==='
          tail -80 "$DATA/install.log" 2>/dev/null || echo '(no /data/install.log)'
          echo '=== docker logs 尾部 120 行 ==='
          docker logs cxwin 2>&1 | tail -120 || true

          if [ "$RESULT" = timeout ]; then
            echo "::error title=安装超时::${ELAPSED}s 内既没拿到 install.done 也没看到收尾标记"
          elif [ "$RESULT" = container-exited ] && [ ! -f "$DONE_MARKER" ]; then
            echo "::error title=安装容器退出::未见完成标记，见上方 docker logs"
          fi
          case "$RESULT" in
            done|done-by-log) : ;;
            *) exit 1 ;;
          esac

      # ── 失败/超时的完整现场快照 ────────────────────────────────────────────
      # 上一版最大的问题之一：卡住时什么证据都没留下，只能靠猜。
      # 这个步骤在任何非成功结局下都会跑（if: always() 由下一步的 artifact 承担
      # 「一定上传」，这里只负责把证据尽可能抓全）。
      - name: 抓取安装现场快照
        id: snapshot
        if: always()
        run: |
          set -u
          WORK="$RUNNER_TEMP/guest"
          SNAP="$RUNNER_TEMP/guest-snapshot"
          mkdir -p "$SNAP"

          echo '=== 收集诊断到'"$SNAP"' ==='
          # 1) 容器状态与日志（最关键：能看出 Setup 走到哪一步、有没有重启循环）
          docker ps -a > "$SNAP/docker-ps-a.txt" 2>&1 || true
          docker inspect cxwin > "$SNAP/docker-inspect.json" 2>&1 || true
          docker logs cxwin > "$SNAP/docker-logs-full.txt" 2>&1 || true
          docker logs cxwin 2>&1 | tail -300 > "$SNAP/docker-logs-tail300.txt" || true

          # 2) 两个挂载点的完整清单（/data 是回传通道，/oem 是输入，对照着看就知道
          #    客机到底有没有写出任何东西）
          ls -laR "$WORK/data" > "$SNAP/data-listing.txt" 2>&1 || true
          ls -laR "$WORK/oem" > "$SNAP/oem-listing.txt" 2>&1 || true
          ls -la "$WORK/storage" > "$SNAP/storage-listing.txt" 2>&1 || true
          du -sh "$WORK/storage" > "$SNAP/storage-size.txt" 2>&1 || true

          # 3) 客机回传的日志（有就全文留档）
          for f in install.log setup.log; do
            if [ -f "$WORK/data/$f" ]; then
              cp "$WORK/data/$f" "$SNAP/data-$f" || true
            fi
          done

          # 4) VNC 截图：dockur 在 8006 暴露 Web Viewer，/snapshot 返回当前画面。
          #    这是唯一能「看见」Windows Setup 卡在哪个界面的手段。
          curl -s --max-time 20 -o "$SNAP/vnc-snapshot.png" \
            "http://127.0.0.1:8006/snapshot" 2>/dev/null || echo 'vnc snapshot failed'
          if [ -f "$SNAP/vnc-snapshot.png" ]; then
            echo "VNC_SNAPSHOT_BYTES=$(stat -c %s "$SNAP/vnc-snapshot.png")"
          else
            echo 'VNC_SNAPSHOT=missing'
          fi

          echo '=== 快照内容 ==='
          ls -la "$SNAP" || true
          echo "SNAP_DIR=$SNAP" >> "$GITHUB_ENV"

      - name: 取出 qcow2 并核对 setup 结果
        id: extract
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          SETUP_RC_LINE=$(grep -oE 'setup\.ps1 exit=[0-9]+' "$WORK/data/install.log" 2>/dev/null | tail -1 || true)
          echo "setup.ps1 退出码行：${SETUP_RC_LINE:-（未找到）}"
          echo '=== storage 目录 ==='
          ls -lh "$WORK/storage" || true
          echo '=== /oem（只读输入：install.bat + 附件）==='
          ls -lh "$WORK/oem" || true
          echo '=== /data（客机回传：install.done / install.log / setup.log）==='
          ls -lh "$WORK/data" 2>/dev/null || true
          echo '=== setup.log 全文（从 /data 回传的那份）==='
          cat "$WORK/data/setup.log" 2>/dev/null || echo '(没有回传 setup.log —— install.bat 可能没执行，或 Samba 不可写)'

          # dockur 在 DISK_FMT=qcow2 时落盘 storage/data.qcow2（旧版本是 windows.qcow2）
          SRC=""
          for c in "$WORK/storage/data.qcow2" "$WORK/storage/windows.qcow2"; do
            if [ -f "$c" ]; then SRC="$c"; break; fi
          done
          if [ -z "$SRC" ]; then
            echo '::error title=找不到 qcow2::DISK_FMT=qcow2 可能未生效；storage 里只有：'
            ls -la "$WORK/storage" || true
            exit 1
          fi
          echo "QCOW2_SRC=$SRC"
          echo "QCOW2_RAW_BYTES=$(stat -c %s "$SRC")"
          qemu-img info "$SRC" | head -12
          echo "QCOW2_SRC=$SRC" >> "$GITHUB_OUTPUT"

          # 停容器：它还在占用这个 qcow2
          docker stop cxwin --time 30 2>/dev/null || true
          docker rm -f cxwin 2>/dev/null || true

      - name: 压缩
        id: compress
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          SRC="${{ steps.extract.outputs.QCOW2_SRC }}"
          START=$(date +%s)
          qemu-img convert -p -O qcow2 -c "$SRC" "$WORK/guest.qcow2"
          ELAPSED=$(( $(date +%s) - START ))
          SIZE=$(stat -c %s "$WORK/guest.qcow2")
          echo "FINAL_BYTES=$SIZE"
          echo "FINAL_GIB=$(awk -v b="$SIZE" 'BEGIN{printf "%.2f", b/1073741824}')"
          echo "COMPRESS_ELAPSED_SEC=$ELAPSED"
          echo "FINAL_GIB=$(awk -v b="$SIZE" 'BEGIN{printf "%.2f", b/1073741824}')" >> "$GITHUB_OUTPUT"
          echo "FINAL_BYTES=$SIZE" >> "$GITHUB_OUTPUT"
          sha256sum "$WORK/guest.qcow2" | tee "$WORK/guest.qcow2.sha256"
          df -h /

      # ── 离线检查：不启动 Windows 就能判断镜像配好没 ────────────────────────
      #
      # 为什么值得加：SSH 验证要冷启动 Windows（3-7 分钟一轮），
      # 而失败时我们既不知道是「文件没写对」还是「sshd 没起来」。
      # 用 libguestfs 直接读 qcow2 里的 NTFS，能秒级回答：
      #   administrators_authorized_keys 在不在？内容是不是我们的公钥？
      #   purge-tests.exe 在不在？
      #   sshd_config 有没有被改坏？
      # 这样即使 SSH 那一步失败，也能立刻区分「镜像内容错」与「服务没起」。
      #
      # ⚠️ 这不是 SSH 验证的替代品，只是**更快的分类器**：
      #    文件在 ≠ sshd 能连。所以下面失败只警告，不阻断（SSH 才是硬门禁）。
      - name: 离线检查镜像内容（libguestfs）
        id: offline
        if: always()
        run: |
          set -u
          WORK="$RUNNER_TEMP/guest"
          SNAP="$RUNNER_TEMP/guest-snapshot"
          mkdir -p "$SNAP"
          OUT="$SNAP/offline-check.txt"
          : > "$OUT"
          IMG="$WORK/guest.qcow2"
          if [ ! -f "$IMG" ]; then
            echo "SKIP: 没有 $IMG" | tee -a "$OUT"; exit 0
          fi

          # libguestfs 依赖一个可引导的 appliance；失败就如实记录，不硬做。
          if ! command -v virt-filesystems >/dev/null 2>&1; then
            echo '安装 libguestfs-tools...' | tee -a "$OUT"
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              libguestfs-tools linux-image-generic >/dev/null 2>&1 || true
          fi
          if ! command -v virt-filesystems >/dev/null 2>&1; then
            echo 'SKIP: libguestfs-tools 装不上' | tee -a "$OUT"; exit 0
          fi
          export LIBGUESTFS_BACKEND=direct
          export LIBGUESTFS_MEMSIZE=2048

          echo '=== 分区布局 ===' | tee -a "$OUT"
          # Server 2022 是 GPT：通常 /dev/sda1 = EFI(MSR), /dev/sda2 = MSR,
          # /dev/sda3 = Windows C:。所以不能硬编码 sda2，必须列出来探测。
          virt-filesystems -a "$IMG" --all --long 2>&1 | tee -a "$OUT" || {
            echo 'ERROR virt-filesystems 失败（appliance 起不来？）' | tee -a "$OUT"; exit 0; }

          # 在列出的文件系统里找 Windows 分区：认 /Windows/System32 存在即为 C:
          WINPART=""
          for fs in $(virt-filesystems -a "$IMG" --filesystems 2>/dev/null); do
            if virt-ls -a "$IMG" -m "$fs" /Windows/System32 >/dev/null 2>&1; then
              WINPART="$fs"; break
            fi
          done
          if [ -z "$WINPART" ]; then
            echo 'ERROR 找不到 Windows 分区（NTFS 可能挂不上）' | tee -a "$OUT"; exit 0
          fi
          echo "WINDOWS_PARTITION=$WINPART" | tee -a "$OUT"

          # 逐项核对镜像里该有的东西
          echo '=== /ProgramData/ssh ===' | tee -a "$OUT"
          virt-ls -a "$IMG" -m "$WINPART" /ProgramData/ssh 2>&1 | tee -a "$OUT" || true

          AK_EXISTS=no
          if virt-ls -a "$IMG" -m "$WINPART" /ProgramData/ssh 2>/dev/null | grep -qx 'administrators_authorized_keys'; then
            AK_EXISTS=yes
            echo '=== administrators_authorized_keys 内容 ===' | tee -a "$OUT"
            virt-cat -a "$IMG" -m "$WINPART" /ProgramData/ssh/administrators_authorized_keys 2>&1 | tee -a "$OUT" || true
            # 与本次使用的公钥比对（去掉注释差异后比较 base64 主体）
            V_PUB=$(virt-cat -a "$IMG" -m "$WINPART" /ProgramData/ssh/administrators_authorized_keys 2>/dev/null \
                    | awk '{print $2}' | head -1)
            L_PUB=$(awk '{print $2}' "$WORK/id.pub" 2>/dev/null | head -1)
            if [ -n "$V_PUB" ] && [ "$V_PUB" = "$L_PUB" ]; then
              echo 'PUBKEY_MATCH=yes' | tee -a "$OUT"
            else
              echo "PUBKEY_MATCH=no (image=${V_PUB:-none} local=${L_PUB:-none})" | tee -a "$OUT"
            fi
          fi
          echo "AUTHORIZED_KEYS_EXISTS=$AK_EXISTS" | tee -a "$OUT"

          EXE=no
          if virt-ls -a "$IMG" -m "$WINPART" /cx/native 2>/dev/null | grep -qx 'purge-tests.exe'; then
            EXE=yes
          fi
          echo "PURGE_TESTS_EXISTS=$EXE" | tee -a "$OUT"

          # OpenSSH 是否真的装进了 System32\OpenSSH（这是 Add-WindowsCapability 的落地证据）
          SSH_BIN=no
          if virt-ls -a "$IMG" -m "$WINPART" /Windows/System32/OpenSSH >/dev/null 2>&1; then
            SSH_BIN=yes
            echo '=== /Windows/System32/OpenSSH ===' | tee -a "$OUT"
            virt-ls -a "$IMG" -m "$WINPART" /Windows/System32/OpenSSH 2>&1 | tee -a "$OUT" || true
          fi
          echo "OPENSSH_BINARIES_EXISTS=$SSH_BIN" | tee -a "$OUT"

          echo '=== 汇总 ===' | tee -a "$OUT"
          {
            echo "OFFLINE_AUTHORIZED_KEYS=$AK_EXISTS"
            echo "OFFLINE_PURGE_TESTS=$EXE"
            echo "OFFLINE_OPENSSH_BINARIES=$SSH_BIN"
          } >> "$GITHUB_OUTPUT"

          # 明确区分「装好了」与「装了一半」—— 这是本步骤的核心价值
          if [ "$AK_EXISTS" = yes ] && [ "$EXE" = yes ] && [ "$SSH_BIN" = yes ]; then
            echo 'OFFLINE_VERDICT=image-configured-correctly' | tee -a "$OUT"
          else
            echo "OFFLINE_VERDICT=image-incomplete (keys=$AK_EXISTS exe=$EXE sshbin=$SSH_BIN)" | tee -a "$OUT"
            echo "::warning title=镜像离线检查不完整::keys=$AK_EXISTS exe=$EXE openssh=$SSH_BIN —— 若 SSH 也失败，优先查 Add-WindowsCapability 是否拉不到 Windows Update"
          fi
          # 只看文件不阻断：文件在也不代表 sshd 能连，SSH 那步才是硬门禁。

      # ── 关键：在“验证 SSH”**之前**先传一次证据 ────────────────────────────
      #
      # 2026-11-11（t111）用 API 查出来：上一轮 run 43018341765 里
      #   step 14「验证 SSH 可连」 status=in_progress conclusion=NULL
      #   step 15..18（含 if: always() 的上传）status=pending conclusion=NULL
      # 也就是说 **job 在 SSH 步骤运行期间被强制终止**，后面的 always() 步骤
      # 根本没轮到执行 —— 所以 artifact total_count=0，不是路径写错，也不是
      # if-no-files-found 把它吞了，是**那些步骤从未被调度**。
      #
      # 所以必须在上传步骤**位置上也往前挪**：SSH 之前先传一次“装完后的现场”。
      # 这样即使 SSH 步骤把 job 挂死/被 timeout 杀掉，前面这段证据也已经落地。
      # 名字带 -early 后缀，避免与最后那次全量快照互相覆盖。
      - name: 先传一次证据（SSH 验证之前）
        id: snap-early
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-image-diagnostics-early
          compression-level: 0
          path: |
            ${{ runner.temp }}/guest-snapshot/
            ${{ runner.temp }}/guest/data/
            ${{ runner.temp }}/guest/oem/install.bat
            ${{ runner.temp }}/guest/oem/setup.ps1
            ${{ runner.temp }}/guest/guest.qcow2.sha256
          if-no-files-found: warn
          retention-days: 7

      # ── 硬验收：SSH 真的能连上 ─────────────────────────────────────────────
      # 不验证就交付 = 给下游一个黑盒。ci.yml 那边会因为「连不上」浪费 45 分钟。
      - name: 验证 SSH 可连
        id: verify
        # 硬性时限：GitHub 的 job 级 timeout 到点会**直接杀进程**，
        # 连 always() 的后续步骤都不跑（上一轮就是这样丢证据的）。
        # 这里给步骤自己设 20 分钟上限，让它在 job 被杀之前**主动**收尾并 exit 1。
        timeout-minutes: 20
        run: |
          set -u
          WORK="$RUNNER_TEMP/guest"
          SNAP="$RUNNER_TEMP/guest-snapshot"
          mkdir -p "$SNAP"
          # 2026-11-11（t111）：这个步骤的失败诊断**必须**落在 snapshot 目录里。
          # 上一轮只把 ssh stderr 打进 stdout 与 Step Summary ——
          # 而 GitHub 会回收 job 日志（实测 gh api .../logs 返回 BlobNotFound），
          # 于是「失败原因」彻底消失，artifact 也是空的。现在所有证据都写文件。
          VERIFY_LOG="$SNAP/ssh-verify.txt"
          : > "$VERIFY_LOG"

          qemu-system-x86_64 \
            -enable-kvm -cpu host -smp 2 -m 4096 \
            -drive file="$WORK/guest.qcow2",if=virtio,cache=writeback \
            -nic "user,model=e1000,hostfwd=tcp:127.0.0.1:2222-:22" \
            -display none -vga none \
            -pidfile "$WORK/vqemu.pid" -daemonize
          echo "VERIFY_QEMU_PID=$(cat "$WORK/vqemu.pid" 2>/dev/null || echo unknown)" | tee -a "$VERIFY_LOG"

          # -vvv 而不是 -v：要看到 kex/banner 协商停在哪一步。
          # ConnectionAttempts=1：不重试，避免 10s × N 把步骤拖死。
          SSH="ssh -i $WORK/id -p 2222 -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
               -o ConnectionAttempts=1 -o BatchMode=yes -o LogLevel=ERROR"
          READY=no
          ATTEMPT=0
          DEADLINE=$(( $(date +%s) + 900 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            ATTEMPT=$(( ATTEMPT + 1 ))
            if (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then
              exec 3>&- 2>/dev/null || true
              # 每次尝试都留完整协商日志（最后一次会覆盖上一次，失败时分不清是哪次 ——
              # 所以按 attempt 编号存，保留全部）
              if $SSH -vvv "$GUEST_USER@127.0.0.1" 'whoami' >/tmp/whoami.txt 2>"$SNAP/ssh-vvv-$ATTEMPT.txt"; then
                READY=yes; break
              fi
              # 同时留一份简版 stderr 方便快速看
              tail -20 "$SNAP/ssh-vvv-$ATTEMPT.txt" > /tmp/ssherr.txt 2>/dev/null || true
            else
              echo "attempt=$ATTEMPT tcp-connect-failed" >> "$VERIFY_LOG"
            fi
            sleep 10
          done
          echo "SSH_READY=$READY attempts=$ATTEMPT" | tee -a "$VERIFY_LOG"

          if [ "$READY" = yes ]; then
            echo '=== SSH 实测 ===' | tee -a "$VERIFY_LOG"
            cat /tmp/whoami.txt | tee -a "$VERIFY_LOG"
            $SSH "$GUEST_USER@127.0.0.1" \
              'powershell -NoProfile -Command "(Get-Service sshd).Status; (Get-NetTCPConnection -LocalPort 22 -State Listen).Count; Test-Path C:/cx/native/purge-tests.exe"' \
              >> "$VERIFY_LOG" 2>&1 || true
            {
              echo '## SSH 验证：通过'
              echo ''
              echo '```'
              cat /tmp/whoami.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error title=SSH 连不上::镜像不可用，不要拿去给 ci.yml 用'
            {
              echo '--- SSH_READY=no ---'
              echo "attempts=$ATTEMPT"
              echo '--- 最后一次 ssh -vvv 尾部 60 行 ---'
              tail -60 "$SNAP/ssh-vvv-$ATTEMPT.txt" 2>/dev/null || echo '(no vvv log)'
              echo '--- guest 内 setup-steps.txt（若已回传，这是定位关键）---'
              cat "$WORK/data/setup-steps.txt" 2>/dev/null || echo '(未回传 setup-steps.txt)'
              echo '--- guest 内 setup.log 尾部 60 行 ---'
              tail -60 "$WORK/data/setup.log" 2>/dev/null || echo '(未回传 setup.log)'
              echo '--- /data 清单 ---'
              ls -la "$WORK/data" 2>/dev/null || echo '(no /data)'
            } >> "$VERIFY_LOG"
            echo '--- 失败诊断已写入 ssh-verify.txt ---'
            cat "$VERIFY_LOG"
            {
              echo '## SSH 验证：失败'
              echo ''
              echo '**先看 artifact `guest-image-diagnostics` 里的 `ssh-verify.txt` 与 `data-setup-steps.txt`**'
              echo ''
              echo '```'
              tail -30 "$VERIFY_LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          kill -TERM "$(cat "$WORK/vqemu.pid" 2>/dev/null || echo 0)" 2>/dev/null || true
          sleep 3
          kill -KILL "$(cat "$WORK/vqemu.pid" 2>/dev/null || echo 0)" 2>/dev/null || true
          echo "SSH_READY=$READY" >> "$GITHUB_OUTPUT"
          [ "$READY" = yes ] || exit 1

      - name: 存入 Actions Cache
        if: steps.verify.outputs.SSH_READY == 'yes'
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          # 缓存目录只放 qcow2 + sha256，避免把 storage 里的 ISO 也塞进去。
          mkdir -p "$WORK/cache"
          cp "$WORK/guest.qcow2" "$WORK/cache/"
          cp "$WORK/guest.qcow2.sha256" "$WORK/cache/"
          ls -lh "$WORK/cache"
          echo "CACHE_DIR=$WORK/cache" >> "$GITHUB_ENV"

      - name: 保存到 cache
        if: steps.verify.outputs.SSH_READY == 'yes'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: ${{ env.CACHE_KEY }}

      - name: 结论写入 Step Summary
        if: always()
        env:
          INSTALL_ELAPSED: ${{ steps.wait.outputs.INSTALL_ELAPSED_SEC }}
          INSTALL_RESULT: ${{ steps.wait.outputs.INSTALL_RESULT }}
          FINAL_GIB: ${{ steps.compress.outputs.FINAL_GIB }}
          SSH_READY: ${{ steps.verify.outputs.SSH_READY }}
        run: |
          set -u
          {
            echo '## Windows 客机镜像打包结果'
            echo ''
            echo '| 项 | 值 |'
            echo '| --- | --- |'
            echo "| 安装结果 | ${INSTALL_RESULT:-未执行} |"
            echo "| 安装耗时 | ${INSTALL_ELAPSED:-?} s |"
            echo "| 压缩后体积 | ${FINAL_GIB:-?} GiB |"
            echo "| SSH 验证 | ${SSH_READY:-未执行} |"
            echo "| cache key | \`$CACHE_KEY\` |"
            echo ''
            if [ "${SSH_READY:-}" = yes ]; then
              echo '### ✅ 镜像可用，已存入 cache'
              echo ''
              echo '接下来在仓库设置：'
              echo ''
              echo '- secret `CX_QEMU_GUEST_SSH_KEY` = 匹配本次公钥的私钥'
              echo '- ci.yml 侧用 `actions/cache/restore@v4` 取回，'
              echo "  key = \`$CACHE_KEY\`"
              echo ''
              echo '> cache 7 天未访问会被清理；ci.yml 每次 push 都 restore 就会续期。'
            else
              echo '### ❌ 未产出可用镜像'
              echo ''
              echo '不要把它配给 ci.yml —— 那边会因 SSH 连不上而红。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 无论成败都上传现场快照 —— 上一版卡了 45 分钟却什么都没留下，只能靠猜。
      # 判据：只要有快照目录就传（`if: always()` 保证失败时也跑）。
      - name: 上传安装现场快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-image-diagnostics
          compression-level: 0
          path: |
            ${{ runner.temp }}/guest-snapshot/
            ${{ runner.temp }}/guest/oem/install.bat
            ${{ runner.temp }}/guest/oem/setup.ps1
            ${{ runner.temp }}/guest/oem/install.done
          if-no-files-found: warn
          retention-days: 7
