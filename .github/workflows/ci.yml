name: 三模式联合 CI

# One workflow and one fail-closed verdict for every main PR/push, including docs-only changes.
# Real third-party client acceptance happens outside Actions; there is no sample or dispatch switch.
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: joint-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: 第一方源码、扩展构建与覆盖率
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: 核对所有触发共享同一门禁
        shell: bash
        run: |
          if ! /usr/bin/python3 -c 'import yaml'; then
            sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends python3-yaml
          fi
          /usr/bin/python3 -B scripts/ci/check-joint-workflow.py .github/workflows/ci.yml
          /usr/bin/python3 -B scripts/ci/check-windows-build-workflow.test.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: 第一方回归与原分组覆盖率阈值
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/owned-unit.mjs | tee coverage.tap
          node scripts/ci/check-coverage.mjs coverage.tap

  service-contract:
    name: 三模式发送器 × TiKuHelper 实际服务契约
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Public first-party counterpart; test an immutable known-compatible contract, never a floating main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: liu23zhi/TiKuHelper
          ref: 56acb76dc6a92b875abf26781bfab44e787a3880
          path: .joint-service
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .joint-service/go.mod
          cache-dependency-path: .joint-service/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - run: npm ci
      - name: 扩展、同设备多浏览器、考试租约同服同批验收
        env:
          TIKUHELPER_ROOT: ${{ github.workspace }}/.joint-service
        run: node --test scripts/ci/three-mode-contract.test.mjs

  windows-contract:
    name: 打包扩展实跑与自有 Windows EXE 边界
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: liu23zhi/TiKuHelper
          ref: 724b497a03ad6b8d27377cd437e440007de70341
          path: .joint-service
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: liu23zhi/TiKuHelper
          ref: 323227b75fa8ae2151a5f0cb361d1006a6c1aa2a
          path: .t04-owned-provider
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .joint-service/go.mod
          cache-dependency-path: .joint-service/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      # npm's locked Puppeteer installs Chrome for Testing, which can load an unpacked MV3 extension.
      - run: npm ci
      - run: npm run build
      - name: 实际扩展重启与同一宿主的三个隔离浏览器资料
        run: node --test --test-concurrency=1 scripts/extension-diagnostics.browser.test.mjs scripts/ci/owned-profiles.browser.test.mjs
      - name: 编译并运行自有 x86 名额、授权与回环 WinHTTP 夹具
        shell: pwsh
        run: ./scripts/ci/owned-native-contracts.ps1
      - name: TiKu 实际 PS1 与原生启动配置和授权兼容
        shell: pwsh
        run: ./scripts/ci/tiku-launcher-native-contract.ps1 -TiKuHelperRoot ./.joint-service

      - name: 普通 Windows 测试构建仅返回协议授权结果
        shell: pwsh
        env:
          GOMAXPROCS: "2"
        run: ./scripts/ci/ordinary-win-agreement.ps1 -TiKuHelperRoot ./.t04-owned-provider

      - name: 验证非交互提示与构建产物门禁
        shell: pwsh
        run: ./scripts/ci/windows-build-entry.test.ps1
      - name: 试编译 windows/native-source/build-windows.cmd
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/ci/windows-build-entry.ps1 -Entry 'windows/native-source/build-windows.cmd'
      - name: 试编译 windows/native-source/build-windows.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/ci/windows-build-entry.ps1 -Entry 'windows/native-source/build-windows.ps1'
      - name: 试编译 windows/native-source/build-windows.sh
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/ci/windows-build-entry.ps1 -Entry 'windows/native-source/build-windows.sh'
      - name: 试编译 windows/hook-source/build-proxy.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/ci/windows-build-entry.ps1 -Entry 'windows/hook-source/build-proxy.ps1'
      - name: 保留各构建入口的日志、版本和退出码
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-build-logs
          path: |
            ${{ runner.temp }}/windows-build-logs/*/build.log
            ${{ runner.temp }}/windows-build-logs/*/result.txt
          if-no-files-found: error
          retention-days: 7

  joint-gate:
    name: 三模式联合门禁
    needs: [source-checks, service-contract, windows-contract]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 任一必要检查失败、取消或跳过则不能通过
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["REQUIRED_RESULTS"])
          wanted = {"source-checks", "service-contract", "windows-contract"}
          verdict = {job: needs.get(job, {}).get("result", "missing") for job in sorted(wanted)}
          print(verdict)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              for job, result in verdict.items():
                  out.write(f"- {job}: {result}\n")
              out.write("\n真实第三方客户端：仅人工验收，未在此工作流执行。\n")
          sys.exit(0 if set(needs) == wanted and all(v == "success" for v in verdict.values()) else 1)
          PY
