name: 持续集成

# ============================================================================
# 2026-11-10：原 ci-vm.yml 已**整体并入本文件**（用户要求「把 ci-vm.yml 合并到
# ci.yml，完整 ci 添加上完整的关机自毁测试」）。合并后本文件是唯一入口：
#
#   · 日常构建与测试    source / windows-*（不变）
#   · 虚拟机能力巡检    gate → kvm-probe（托管 ubuntu，只读，5 分钟）
#   · 关机自毁（语义）  wiring-probe（托管 windows-latest，-NoShutdown → -ReplayRunOnce）
#   · 关机自毁（QEMU）  qemu-shutdown-destruct（托管 ubuntu + KVM + Windows 客机）
#
# ## 「同一个日历日只跑一次」的语义（只约束 kvm-probe）
#
#   手动触发 → 一定要跑（哪怕今天已经跑过）
#   CI 触发  → 今天已有**成功的 KVM 巡检**就跳过 kvm-probe
#
#   日判重刻意**不约束**三条自毁作业：它们是用户要求「完整 CI 里必须有」的那部分，
#   跳过等于回到「关机自毁从未在 CI 里跑过」的老状态。
#
# ## 输入参数的写法
#
#   ci.yml 是普通 workflow（不是 workflow_call 的 callee），在 push / pull_request
#   事件下 `inputs.*` 上下文为 null。因此全部改用 `github.event.inputs.*`，
#   并在缺省处用 `|| '默认值'` 兜底：`${{ github.event.inputs.force || 'false' }}`。
#   ⚠️ workflow_dispatch 的 boolean 输入在 `github.event.inputs` 里是**字符串**，
#   所以比较一律写成字符串比较（'true' / 'false'），不能写成 `== true`。
#
# ============================================================================
# ## 关机自毁验证的演进（2026-11-11 用户要求：不用 self-hosted）
#
# 历史：曾有一条 vm-shutdown-destruct 跑在 [self-hosted, windows, cx-vm] 上，
# 用真 Windows 虚拟机做「关机登记 → 重启 → 开机续删」。但本仓库 runners
# total_count = 0，该作业永远排队到超时，最终被取消 —— 既没验证任何东西，
# 又让 CI 长期不可用。
#
# ⚠️ 一条被推翻的旧断言（2026-11-10 曾写进本文件，现已不成立）：
#   「托管 runner 不支持嵌套虚拟化」—— 该结论是**错的**。实测 run 42588732951 /
#   42590175761：托管 ubuntu-24.04 有 /dev/kvm，sudo 提权后可正常引导 guest。
#   所以现在用托管 Ubuntu + QEMU + cloud image 就能做真实重启，不需要 self-hosted。
#
# 现状（全部托管 runner，零 self-hosted、零人工配置）：
#   · wiring-probe（windows-latest）—— 两阶段语义：阶段一登记待删目标，
#     阶段二按 RunOnce 原文重放并断言续删。不真关机（托管 runner 关机就没了），
#     所以「重启后」这一步是用重放模拟的。
#   · qemu-destruct-linux-guest（ubuntu-24.04）—— QEMU + Linux cloud image，
#     自动下载镜像，做**真实重启**，断言 boot_id 变化 + 目标已删 + 续删在本次
#     启动执行 + 单元自撤销。
#   · qemu-shutdown-destruct（ubuntu-24.04）—— QEMU + Windows 客机，覆盖
#     Windows 特有的 HKCU RunOnce 与 PendingFileRenameOperations。需要自备
#     Windows qcow2（无官方 cloud image，从 ISO 装需 20-40 分钟，不适合 CI），
#     未配置时**如实判红**而不是伪装成成功。
#
# 缺口（如实记录）：PendingFileRenameOperations 在真实 Windows 重启后的清除
# 行为，目前只有 qemu-shutdown-destruct 能验证，而它需要人工准备镜像。
#
# → KVM 巡检（kvm-probe job）跑在托管 ubuntu，负责把「托管 runner 的 KVM 权限」
#   这个外部事实变成可追溯记录；它的基线结论是「有设备、无权限」，一旦
#   KVM_ACCESSIBLE 从 no 变 yes 就说明 GitHub 改了 runner 镜像，需要复核上面 (1)(2)。
#
# ============================================================================

# ============================================================================
# ## 覆盖矩阵（2026-11-11 用户第三次要求「重写，覆盖全面，不使用 self-host」）
#
# | # | 维度 | 覆盖者 | 状态 |
# |---|---|---|---|
# | 1 | 关机时登记待删目标 | wiring-probe（RunOnce）/ linux-guest（targets.txt） | ✅ |
# | 2 | 真实关机（不是模拟） | linux-guest `powercut`（kill -KILL QEMU = 拔电源） | ✅ |
# | 3 | 真实开机，续删真的执行 | linux-guest `replay`（resume-proof 的 boot_id == 本次） | ✅ |
# | 4 | 断言目标已删 | linux-guest `replay`（3 个目标全部） | ✅ |
# | 5 | 断言登记项自行撤销 | linux-guest `replay`（unit 文件 + is-enabled） | ✅ |
# | 6 | 强制关机后仍能续删 | linux-guest `powercut`（**替代** reboot，断电更严） | ✅ |
# | 7 | 多次重启不重复执行（幂等） | linux-guest `reboot2` + `replay2`（proof 逐字节未变） | ✅ |
# | 8 | Linux 侧对应机制 | linux-guest 全程 | ✅ |
# | 9 | Windows 侧对应机制 | qemu-shutdown-destruct（需人工镜像） | ⚠️ 缺镜像 |
# | 10 | KVM 能力基线留痕 | kvm-probe（只读巡检，职责单一） | ✅ |
#
# 附加覆盖（用户在「覆盖全面」下明确要求的扩展）：
#   · 多目标 —— 3 个登记目标 + **1 个未登记对照必须存活**（证明不是「清空目录」）
#   · 登记值本身正确 —— targets.txt 字节级内容、unit 的 ExecStart、脚本可执行位
#   · 异常路径 —— 列表中间插一个目录（rm -f 对目录必失败），
#     断言它记 rc≠0 **且排在它后面的目标仍被删**（列表处理不因单项失败中断）
#
# 为什么 #9 仍是 ⚠️（不是「再努力一下就能解决」）：
#   PendingFileRenameOperations 与 RunOnce 都是 Windows **运行时**写进注册表的。
#   qemu-nbd 离线挂载只能看到 NTFS 文件，**看不到注册表项**；要让 Windows 写它们，
#   必须先在客机里执行代码 ⇒ 回到注入通道问题。
#   而 Windows 评估版默认既不开 OpenSSH Server 也不开 WinRM；
#   走 unattend 完整装机 20-40 min，叠加 9.51 GiB 下载 + 转换 + 两轮重启
#   = 35-50 min，撞 45 min 上限。
#   ⇒ 要真正补上，只能人工准备「预装 SSH + purge-tests.exe」的 qcow2
#     并配 repo variable（或托管到 release 后由 CI 分卷下载）。
#      这是**一次性人工**，不是每次 CI 的人工步骤，但仍需有人做。
#
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      # 2026-11-12：build-guest-image 并入后，这些输入从原独立 workflow 带过来。
      guest_password:
        description: '客机 runner 账号密码（仅构建镜像时用）'
        required: false
        default: 'Cx-Guest-2026!'
      version:
        description: 'Windows 版本（2022 = Server 2022）'
        required: false
        default: '2022'
      disk_size:
        description: '客机磁盘大小（稀疏）'
        required: false
        default: '32G'
      install_timeout_sec:
        description: '客机安装超时（秒）'
        required: false
        default: '3600'
      force:
        description: '强制运行 KVM 巡检（手动触发恒为 true，不受「今天跑过」限制）'
        type: boolean
        default: true
      include_vm_destruct:
        description: '同时运行关机自毁验证（QEMU Linux 客机自动下载镜像；Windows 客机需自备镜像）'
        type: boolean
        default: true
      guest_image:
        description: '预装好的 Windows qcow2：绝对路径或 https URL；留空则读仓库变量 CX_QEMU_GUEST_IMAGE'
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# 客机镜像的 cache key。build-guest-image 用它 save，
# qemu-shutdown-destruct 用它 restore。改版本号（v1→v2）即作废旧镜像。
env:
  GUEST_IMAGE_CACHE_KEY: cx-win2022-guest-qcow2-v3

jobs:
  source:
    name: Ubuntu 类型检查与扩展构建
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: Linux 扩展构建
        run: npm run build
      - name: 单元测试与覆盖率门禁
        shell: bash
        run: |
          # 覆盖率只能统计被 Node 模块加载器加载过的文件，所以在 Ubuntu 上跑。
          # 必须先 build：缺 dist/ 时 manifest 相关用例会假失败，与覆盖率无关。
          set -o pipefail
          mapfile -t testFiles < <(find scripts -maxdepth 1 -name '*.test.mjs' -type f | sort)
          echo "测试文件数: ${#testFiles[@]}"
          # --import 注册 src 的 .ts 解析 hook：构建产物来自 .ts（build.mjs 的
          # resolve.extensions 把 .ts 排在 .js 前，PR #19），不加它 src 组会去统计
          # 不进产物的影子 .js。windows/ 两组统计 .mjs，不受影响。
          node --import ./scripts/ci/coverage-register.mjs --test --test-reporter=tap --test-concurrency=1 --test-timeout=300000 --experimental-test-coverage "${testFiles[@]}" > coverage.tap || true
          echo '--- 测试结果摘要 ---'
          grep -E '^# (tests|pass|fail|skipped)' coverage.tap || true
          echo '--- 覆盖率门禁 ---'
          node scripts/ci/check-coverage.mjs coverage.tap
      - name: 上传覆盖率 TAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-tap
          path: coverage.tap
          retention-days: 7
  windows-build:
    name: Windows 构建共享测试产物
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建扩展包
        run: npm run build
      - name: 构建 Windows 注入资源
        run: npm run build:windows -- --release
      - name: 构建原生宿主与编译测试
        run: npm run build:native
      - name: 校验构建产物
        shell: pwsh
        run: |
          $required = @(
            'dist/manifest.json',
            'dist/chaoxing-plus.js',
            'dist/_locales/zh_CN/messages.json',
            'dist-windows/windows-bootstrap.js',
            'dist-windows/chaoxing-plus.windows.js',
            'windows/native-build/bin/chaoxing_plus.exe',
            'windows/native-build/bin/account-window-tests.exe',
            'windows/native-build/bin/browser-session-tests.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "构建产物缺失: $path" }
          }
      - name: 上传共享 Windows 测试产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: |
            dist/
            dist-windows/
            windows/native-build/
          if-no-files-found: error
          retention-days: 7

  windows-real-client-discovery:
    name: 发现真实客户端注入矩阵
    permissions:
      contents: read
    needs: windows-build
    # 2026-11-11: PR 上也要跑（用户要求「不要跳过任务」）。只要求构建成功。
    if: ${{ needs.windows-build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 扫描客户端与数据库变量
        id: discover
        shell: pwsh
        env:
          REPOSITORY_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          $clientDirectory = Join-Path $env:GITHUB_WORKSPACE 'tests/private-clients'
          if (-not (Test-Path -LiteralPath $clientDirectory -PathType Container)) {
            throw "私有客户端目录不存在: $clientDirectory"
          }
          # Only the exam client fixtures belong to the matrix. The same directory also carries the
          # bundled tool installers that carry no client version to parse.
          $clientFiles = @(Get-ChildItem -LiteralPath $clientDirectory -Filter 'chaoxing-exam-*.exe' -File -Recurse | Sort-Object FullName)
          if ($clientFiles.Count -eq 0) { throw '私有客户端目录中没有 chaoxing-exam-*.exe' }

          $repositoryVars = $env:REPOSITORY_VARS_JSON | ConvertFrom-Json
          # Collect explicitly: a bare `$databaseVars = foreach (...) { Write-Output ...; $object }`
          # would swallow the ::add-mask:: workflow command into the variable and emit matrix rows
          # with an empty database name.
          $databaseVars = @()
          foreach ($property in $repositoryVars.PSObject.Properties) {
            $match = [regex]::Match([string]$property.Name, '^Examination_Client_Database_(.+)$', [Text.RegularExpressions.RegexOptions]::IgnoreCase)
            $value = [string]$property.Value
            if ($match.Success -and -not [string]::IsNullOrWhiteSpace($value)) {
              $compactValue = $value -replace '\s', ''
              if ($compactValue -ceq 'enabled') {
                throw "变量 $($property.Name) 仍是旧的 enabled 标记；请把 UserExamInfo.db 的 Base64 文本写入该变量"
              }
              Write-Output "::add-mask::$compactValue"
              $databaseVars += [pscustomobject]@{ Name = [string]$property.Name; Suffix = $match.Groups[1].Value }
            }
          }
          if ($databaseVars.Count -eq 0) { throw '没有配置非空的 Examination_Client_Database_* Base64 变量' }

          $entries = foreach ($clientFile in $clientFiles) {
            $fileName = [IO.Path]::GetFileNameWithoutExtension($clientFile.Name)
            if ($fileName -notmatch '^chaoxing-exam-(?<version>v[0-9.]+)$') {
              throw "无法从客户端文件名识别版本: $($clientFile.Name)"
            }
            $version = $Matches.version
            $injectMode = if ($fileName -match '^chaoxing-exam-v4\.3\.') {
              'dll-proxy'
            } elseif ($fileName -match '^chaoxing-exam-v4\.1\.4\.') {
              'cdp-port'
            } else {
              throw "未定义客户端注入通道: $($clientFile.Name)"
            }
            $relativePath = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $clientFile.FullName).Replace([IO.Path]::DirectorySeparatorChar, '/')
            foreach ($databaseVar in $databaseVars) {
              [ordered]@{
                client = $version
                installer = $relativePath
                inject_mode = $injectMode
                database = $databaseVar.Suffix
                database_var = $databaseVar.Name
              }
            }
          }
          $matrix = [ordered]@{ include = @($entries) } | ConvertTo-Json -Compress -Depth 5
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "matrix=$matrix`n", [Text.UTF8Encoding]::new($false))
          Write-Host "发现 $($clientFiles.Count) 个客户端、$($databaseVars.Count) 个数据库变量，生成 $($entries.Count) 个注入用例"
          $databaseVars | ForEach-Object { Write-Host "数据库 Base64 变量 $($_.Name) 已发现并掩码" }

  windows-unit:
    name: Windows 单元与原生测试
    needs: windows-build
    if: ${{ needs.windows-build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CXPLUS_NO_LOG_FILE: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 下载共享 Windows 测试产物
        uses: actions/download-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: .
      - name: 准备 Windows 测试环境
        shell: pwsh
        run: ./scripts/ci/prepare-windows-test-environment.ps1 -RequireBrowsers
      - name: 单元测试（不含浏览器、隔离暂停与可见窗口）
        shell: pwsh
        run: |
          $excluded = @(
            'tab-answer-pause.test.mjs',
            'windows-selection-window.test.mjs',
            'windows-scan-progress-window.test.mjs',
            'windows-native-selection.test.mjs',
            'windows-native-home.test.mjs',
            'windows-native-adapter.test.mjs',
            'windows-native-browser-session.test.mjs'
          )
          # 启动真实 Chromium 的用例挪到浏览器作业串行执行：并发的浏览器与原生用例曾把
          # page.goto / waitForSelector 的默认超时拖爆（相邻两次运行各失败一个用例）。
          $browserDriven = @(Get-ChildItem -LiteralPath scripts -Filter '*.test.mjs' -File |
            Where-Object { $excluded -notcontains $_.Name -and (Select-String -LiteralPath $_.FullName -Pattern 'puppeteer\.launch\(' -Quiet) } |
            Select-Object -ExpandProperty Name)
          Write-Host "移交浏览器作业的用例: $($browserDriven.Count)"
          $testFiles = @(Get-ChildItem -LiteralPath scripts -Filter '*.test.mjs' -File |
            Where-Object { $excluded -notcontains $_.Name -and $browserDriven -notcontains $_.Name } |
            Sort-Object Name | Select-Object -ExpandProperty FullName)
          if ($testFiles.Count -eq 0) { throw '单元测试清单为空' }
          Write-Host "单元测试文件数: $($testFiles.Count)"
          $tapPath = Join-Path $env:RUNNER_TEMP 'ci-unit-tests.tap'
          # 串行执行：并发 2 曾让 windows-native-purge 的 RunOnce 断言读到别的用例
          # 刚登记的 cxplus-purge-* 项（实测一次失败：actual=['cxplus-purge-9d1bf31f'] expected=[]）。
          # 这些用例共享 HKCU RunOnce 与 %TEMP%，不是隔离的，必须串行。
          node --test --test-reporter=tap --test-concurrency=1 --test-timeout=300000 @testFiles 2>&1 | Tee-Object -FilePath $tapPath
          $exitCode = $LASTEXITCODE
          if (-not (Select-String -LiteralPath $tapPath -Pattern '^# skipped (\d+)$' | Select-Object -Last 1)) { throw '单元测试未产生 TAP 汇总' }
          if ($exitCode -ne 0) { exit $exitCode }
      - name: 写入单元测试摘要
        if: always()
        shell: pwsh
        run: |
          "## Windows 单元与原生测试`n`n测试在独立 runner 串行分组执行；完整 TAP 日志见下方 artifact。" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      # 历史缺陷：TAP 只写进 runner 临时目录，作业结束即销毁。
      # 单元作业是失败率最高的一环（实测 run 42674827829 在 windows-node-launch 挂掉），
      # 失败时最需要 TAP，却恰恰拿不到。改为 always 上传。
      - name: 上传单元测试 TAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unit-tap
          path: ${{ runner.temp }}/ci-unit-tests.tap
          if-no-files-found: warn
          retention-days: 7

  windows-pause:
    name: Windows 标签页暂停隔离回归
    needs: windows-build
    if: ${{ needs.windows-build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CXPLUS_NO_LOG_FILE: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 下载共享 Windows 测试产物
        uses: actions/download-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: .
      - name: 准备 Windows 测试环境
        shell: pwsh
        run: ./scripts/ci/prepare-windows-test-environment.ps1 -RequireBrowsers
      - name: 标签页暂停回归（独立 runner）
        shell: pwsh
        run: |
          $testFile = (Resolve-Path -LiteralPath 'scripts/tab-answer-pause.test.mjs').Path
          $tapPath = Join-Path $env:RUNNER_TEMP 'ci-tab-answer-pause.tap'
          node --test --test-reporter=tap --test-concurrency=1 --test-timeout=300000 $testFile 2>&1 | Tee-Object -FilePath $tapPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 上传暂停隔离 TAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pause-tap
          path: ${{ runner.temp }}/ci-tab-answer-pause.tap
          if-no-files-found: warn
          retention-days: 7

  windows-window:
    name: Windows 可见窗口与 Edge/Chrome 会话回归
    needs: windows-build
    if: ${{ needs.windows-build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CXPLUS_NO_LOG_FILE: '1'
      CX_TEST_NATIVE_WINDOW: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 下载共享 Windows 测试产物
        uses: actions/download-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: .
      - name: 准备 Windows 测试环境
        shell: pwsh
        run: ./scripts/ci/prepare-windows-test-environment.ps1 -RequireBrowsers
      - name: 可见窗口与浏览器会话回归（独立 runner）
        shell: pwsh
        run: |
          $files = @(
            'scripts/windows-selection-window.test.mjs',
            'scripts/windows-scan-progress-window.test.mjs',
            'scripts/windows-native-selection.test.mjs',
            'scripts/windows-native-home.test.mjs',
            'scripts/windows-native-adapter.test.mjs',
            'scripts/windows-native-browser-session.test.mjs'
          ) | ForEach-Object { (Resolve-Path -LiteralPath $_).Path }
          if ($files.Count -ne 6) { throw "可见窗口测试清单不完整: $($files.Count)" }
          $tapPath = Join-Path $env:RUNNER_TEMP 'ci-window-tests.tap'
          node --test --test-reporter=tap --test-concurrency=1 --test-timeout=600000 @files 2>&1 | Tee-Object -FilePath $tapPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传可见窗口测试 TAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-window-tap
          path: ${{ runner.temp }}/ci-window-tests.tap
          if-no-files-found: warn
          retention-days: 7

  windows-browser:
    name: Windows 浏览器回归
    needs: windows-build
    if: ${{ needs.windows-build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CXPLUS_NO_LOG_FILE: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 下载共享 Windows 测试产物
        uses: actions/download-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: .
      - name: 准备 Windows 测试环境
        shell: pwsh
        run: ./scripts/ci/prepare-windows-test-environment.ps1 -RequireBrowsers
      - name: 浏览器回归（独立 runner）
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath scripts -Filter '*.browser.mjs' -File | Sort-Object Name | Select-Object -ExpandProperty FullName)
          # 单元作业只保留不启动浏览器的用例；这里按实际是否调用 puppeteer.launch 收集，避免漏测。
          $handledElsewhere = @(
            'tab-answer-pause.test.mjs',
            'windows-selection-window.test.mjs',
            'windows-scan-progress-window.test.mjs',
            'windows-native-selection.test.mjs',
            'windows-native-home.test.mjs',
            'windows-native-adapter.test.mjs',
            'windows-native-browser-session.test.mjs'
          )
          $files += @(Get-ChildItem -LiteralPath scripts -Filter '*.test.mjs' -File |
            Where-Object { $handledElsewhere -notcontains $_.Name -and (Select-String -LiteralPath $_.FullName -Pattern 'puppeteer\.launch\(' -Quiet) } |
            Sort-Object Name | Select-Object -ExpandProperty FullName)
          if ($files.Count -eq 0) { throw '浏览器测试清单为空' }
          Write-Host "浏览器测试文件数: $($files.Count)"
          $tapPath = Join-Path $env:RUNNER_TEMP 'ci-browser-tests.tap'
          node --test --test-reporter=tap --test-concurrency=1 --test-timeout=600000 @files 2>&1 | Tee-Object -FilePath $tapPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 这里的 TAP 文件名必须与上面 --reporter 写出的文件名一致。
      # 历史缺陷：本作业写的是 ci-browser-tests.tap，却上传 ci-window-tests.tap，
      # 且 artifact 名与 windows-window 作业相同 —— 结果是双错：
      #   1) 上传步骤始终 "No files were found"（实测 run 42674827829 的浏览器作业日志）
      #   2) 即使文件名对了，同名 artifact 会在 windows-window 之后覆盖失败
      # 浏览器回归是最慢的一环（实测 5m43s），丢了它的 TAP 排障时无从下手。
      - name: 上传浏览器回归 TAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-tap
          path: ${{ runner.temp }}/ci-browser-tests.tap
          if-no-files-found: warn
          retention-days: 7

  windows-release:
    name: Windows 发布包验证
    needs: [windows-build, windows-unit, windows-pause, windows-window, windows-browser]
    # needs 保留全部五个，但 if 只把 windows-build 当硬门 —— 理由见下。
    #
    # 为什么 needs 仍写五个：needs 同时还决定调度顺序（并行会抢占 runner）。
    # 保留它让发布包验证仍排在这些作业之后跑，避免与浏览器回归抢 runner 配额。
    #
    # 为什么 if 只要求 windows-build：
    #   本作业的**唯一输入**是 windows-build 上传的 artifact
    #   `windows-ci-build-${{ github.sha }}`（下面的 download 步骤）。单元测试 /
    #   暂停回归 / 可见窗口 / 浏览器回归**都不产出本作业消费的任何东西**，
    #   把它们写进 if 是「假依赖」—— 它们一红，发布包验证就被连带 skip，
    #   于是「发布包能不能打出来」这个**与单测无关**的验证完全没跑。
    #
    #   实测过的问题（2026-11-11）：windows-unit 因 mjs 清单不同步失败，
    #   windows-release 被连带跳过，那一轮就没人知道发布包坏没坏。
    #
    # 保留 windows-build 硬门是必要的，不是保守：
    #   · windows-build 上传时 `if-no-files-found: error`，它失败就没有 artifact；
    #   · 下面的 download 步骤没有 continue-on-error，缺 artifact 会直接失败；
    #   · 发布包本身由 `npm run release:windows` 基于该 artifact 打包。
    #   ⇒ build 不成功时跑这个作业只会得到一堆「文件不存在」，不如不跑。
    #
    # 不会造成「单测红但发布绿」的假绿灯：本作业只回答「发布包完整性能不能通过」，
    # 不回答「代码是否正确」。单测红在 summary 表里仍然是红，两者互不掩盖；
    # 反过来说，本作业**通过**也从不会被解读为「代码没问题」。
    #
    # 不使用裸 always()：那会让本作业在 PR 上、在被取消时也跑，属红线。
    if: ${{ always() && needs.windows-build.result == 'success' && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      release-artifact-url: ${{ steps.upload_release.outputs.artifact-url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 下载共享 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: .
      - name: 构建发布包
        run: npm run release:windows
      - name: 发布目录 Node 入口回归
        run: node --test --test-concurrency=1 --test-timeout=180000 scripts/windows-node-exe.test.mjs
      - name: 发布目录复制后入口自检
        shell: pwsh
        run: |
          $build = (Resolve-Path 'windows/native-build').Path
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (Test-Path -LiteralPath (Join-Path $build "chaoxing-plus-$version-windows.zip")) { throw '原生发布不应生成 ZIP' }
          $copied = Join-Path $build ('release-ci\' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $copied -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $build 'release') -Destination $copied -Recurse
          $package = Join-Path $copied 'release'
          node (Join-Path $package 'verify-release.mjs')
          if ($LASTEXITCODE -ne 0) { throw "发布包完整性自校验失败: $LASTEXITCODE" }
          foreach ($required in @('release-info.json', 'SHA256SUMS.txt', 'verify-release.mjs', 'single-file\chaoxing_plus.exe', 'multi-file\start-windows.cmd', 'multi-file\windows\share-file\config.example.json', 'multi-file\chaoxing_plus.exe', 'multi-file\chaoxing_plus.com', 'multi-file\assets\windows-bootstrap.js', 'multi-file\assets\chaoxing-plus.windows.js', 'multi-file\assets\trampoline.js', 'multi-file\assets\vendor\sweetalert2.min.css', 'multi-file\winmm-proxy.dll', 'multi-file\package-to-single\chaoxing_plus.exe', 'multi-file\release-info.json', 'multi-file\SHA256SUMS.txt', 'multi-file\verify-release.mjs')) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $required))) { throw "发布包缺少: $required" }
          }
          foreach ($forbidden in @('multi-file\README.md', 'multi-file\docs', 'chaoxing_plus.exe', 'start-windows.cmd', 'windows\node-source\main.mjs', 'start-windows-node.cmd', 'runtime\node.exe')) {
            if (Test-Path -LiteralPath (Join-Path $package $forbidden)) { throw "原生发布包不应包含 Node 产物: $forbidden" }
          }
          $native = Start-Process -FilePath (Join-Path $package 'single-file\chaoxing_plus.exe') -ArgumentList '--self-check','--quiet','--no-disk-write' -PassThru -Wait
          if ($native.ExitCode -ne 0) { throw "发布包原生自检失败: $($native.ExitCode)" }
          node (Join-Path $package 'multi-file\verify-release.mjs')
          if ($LASTEXITCODE -ne 0) { throw "多文件变体完整性自校验失败: $LASTEXITCODE" }
          $multi = Start-Process -FilePath (Join-Path $package 'multi-file\chaoxing_plus.exe') -ArgumentList '--self-check','--quiet','--no-disk-write' -PassThru -Wait
          if ($multi.ExitCode -ne 0) { throw "多文件变体原生自检失败: $($multi.ExitCode)" }
          Push-Location -LiteralPath (Join-Path $package 'multi-file')
          try {
            $resolved = @(Get-Command .\chaoxing_plus -CommandType Application)[0].Source
            if ([IO.Path]::GetExtension($resolved) -ne '.com') { throw "扩展名省略入口未选择 .com: $resolved" }
            .\chaoxing_plus --self-check --quiet --no-disk-write
            if ($LASTEXITCODE -ne 0) { throw "控制台辅助入口自检失败: $LASTEXITCODE" }
          } finally { Pop-Location }
          $wrapper = Start-Process -FilePath (Join-Path $package 'multi-file\package-to-single\chaoxing_plus.exe') -ArgumentList '--self-check','--quiet','--no-disk-write' -PassThru -Wait
          if ($wrapper.ExitCode -ne 0) { throw "多文件单 EXE 包装器自检失败: $($wrapper.ExitCode)" }
      - name: 上传 Windows 发布包
        id: upload_release
        uses: actions/upload-artifact@v4
        with:
          name: Windows 发布包
          path: windows/native-build/release/
          if-no-files-found: error

  windows-real-client:
    name: 真实客户端注入 ${{ matrix.client }} / 数据库 ${{ matrix.database }}
    permissions:
      contents: read
    needs: [windows-build, windows-real-client-discovery]
    # 2026-11-11: PR 上也要跑（用户要求「不要跳过任务」）。
    if: ${{ !cancelled() && needs.windows-build.result == 'success' && needs.windows-real-client-discovery.result == 'success' }}
    # Point this at a machine that can satisfy the client's environment check (camera + zh-CN input
    # method) by setting the repository variable REAL_CLIENT_RUNNER, e.g.
    #   ["self-hosted","windows","cx-exam"]
    # The default hosted runner has no zh-CN language payload and no camera, so the client refuses to
    # enter the exam there and the run reports BLOCKED instead of FAILED.
    runs-on: ${{ fromJSON(vars.REAL_CLIENT_RUNNER || '"windows-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.windows-real-client-discovery.outputs.matrix) }}
    steps:
      - name: 检出代码与 Git LFS 客户端资产
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: 下载共享 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: .
      - name: 校验私有客户端资产
        shell: pwsh
        run: |
          $path = '${{ matrix.installer }}'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Git LFS 客户端资产缺失: $path" }
          $size = (Get-Item -LiteralPath $path).Length
          if ($size -lt 100MB) { throw "客户端资产大小异常: $size bytes" }
      - name: 确保 7-Zip 可用
        shell: pwsh
        run: |
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath (Join-Path $env:ProgramFiles '7-Zip\7z.exe'))) {
            choco install 7zip --no-progress -y
          }
      - name: 准备桌面环境（分辨率 / 输入法 / 虚拟摄像头）
        shell: pwsh
        continue-on-error: true
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'cx-real-client-prep.log'
          ./scripts/ci/prepare-windows-real-client-environment.ps1 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { Write-Host "desktop preparation exited $LASTEXITCODE; the injection report still decides the result" }
      - name: 执行真实客户端注入
        shell: pwsh
        env:
          DATABASE_VARIABLE_NAME: ${{ matrix.database_var }}
          DATABASE_BASE64: ${{ vars[matrix.database_var] }}
        run: |
          if ($env:DATABASE_VARIABLE_NAME -notmatch '^Examination_Client_Database_.+$') {
            throw "数据库变量名格式错误: $env:DATABASE_VARIABLE_NAME"
          }
          $db = [string]$env:DATABASE_BASE64
          if ([string]::IsNullOrWhiteSpace($db)) { throw "数据库 Base64 变量为空: $env:DATABASE_VARIABLE_NAME" }
          $compactDb = $db -replace '\s', ''
          if ([string]::IsNullOrWhiteSpace($compactDb)) { throw "数据库 Base64 变量为空: $env:DATABASE_VARIABLE_NAME" }
          if (($compactDb.Length % 4) -ne 0 -or $compactDb -notmatch '^[A-Za-z0-9+/]+={0,2}$') {
            throw "变量 $env:DATABASE_VARIABLE_NAME 必须是 UserExamInfo.db 的 Base64 文本；不再接受 enabled 标记或 ZIP 载荷"
          }
          Write-Output "::add-mask::$compactDb"
          Write-Host "读取数据库变量 $env:DATABASE_VARIABLE_NAME（Base64 $($compactDb.Length) 字符，已掩码），解码为 UserExamInfo.db 并写入 CXExam.exe 同目录"
          # 非考试页也挂载面板（-PanelAllPages → --panel-all-pages）：考试窗口带 WDA_MONITOR，
          # 进入考试后的屏幕拷屏必为纯黑，只有登录/课程/跳转页的现场截图能人工确认注入是否生效。
                    $attempts = 2
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            Write-Host "::group::真实客户端注入尝试 $attempt/$attempts"
            ./scripts/windows-real-client-injection.ps1 `
              -ClientInstaller (Resolve-Path '${{ matrix.installer }}').Path `
              -InjectMode '${{ matrix.inject_mode }}' `
              -DatabaseBase64 $compactDb `
              -NativeHost (Resolve-Path 'windows/native-build/bin/chaoxing_plus.exe').Path `
              -CaseName '${{ matrix.client }}-${{ matrix.database }}' `
              -PanelAllPages
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -eq 0) { exit 0 }
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'cx-real-client-*' -File -ErrorAction SilentlyContinue | ForEach-Object {
              $extension = [IO.Path]::GetExtension($_.Name)
              $base = [IO.Path]::GetFileNameWithoutExtension($_.Name)
              $target = Join-Path $env:RUNNER_TEMP ("$base-attempt$attempt$extension")
              if ($target -ne $_.FullName) { Move-Item -LiteralPath $_.FullName -Destination $target -Force }
            }
            if ($attempt -lt $attempts) {
              Write-Host "::warning::注入尝试 $attempt/$attempts 失败（退出码 $code），15 秒后自动重试"
              Start-Sleep -Seconds 15
            } else {
              Write-Host "::error::注入尝试 $attempts 次均失败（最后一次退出码 $code）"
              exit $code
            }
          }
      - name: 上传注入现场
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-client-${{ matrix.client }}-${{ matrix.database }}
          # Store the files as-is: artifact packaging must not run another compression pass over the
          # PNG frames (level 0 keeps the bytes identical to what the runner wrote).
          compression-level: 0
          path: |
            ${{ runner.temp }}/cx-real-client-*.png
            ${{ runner.temp }}/cx-real-client-*.json
            ${{ runner.temp }}/cx-real-client-*.log
            ${{ runner.temp }}/cx-real-client-*.txt
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: 前置门（已取消一切判重，每次 run 都放行）
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      # 三个输出保留为常量，仅为不破坏下游引用（kvm-probe / summary）。
      # 它们**不再表达任何判重结论** —— 判重逻辑已整体删除。
      skip: "no"
      reason: "已取消判重：每次 run 都执行（用户 2026-11-11 明确要求）"
      sha_verified: "no"
    steps:
      - name: 放行
        run: |
          echo "已取消一切判重，本次 run 直接放行。"
          echo "SKIP=no"
          echo "SHA_VERIFIED=no"
          echo "REASON=已取消判重：每次 run 都执行"

  kvm-probe:
    name: KVM 能力巡检（托管 runner，只读）/ 由 CI 调用
    needs: gate
    # 2026-11-11 最终口径（用户两次要求）：**取消一切判重，每次 run 都跑**。
    # 旧写法按日历判重，实测 run 42935345965：main 当天第 1 次 push 巡检成功后，
    # 后续不同 commit 的 push 全部 skipped ⇒ main 的最新代码从未被巡检验证过。
    # 代价依据：timeout 是 5 分钟、实测单次 < 40 秒，不是重活。
    if: needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      # 2026-11-10 合并前这两个值来自 ci-vm.yml 的 workflow_call outputs
      # （jobs.gate.outputs.skip|reason）。合并后 workflow_call 层消失，
      # kvm-probe 必须自己转发；否则 summary 的「跳过（原因）」恒为空，
      # 「因日判重而跳过」与「压根没执行」无法区分。
      skipped: ${{ needs.gate.outputs.skip }}
      reason: ${{ needs.gate.outputs.reason }}
    steps:
      - name: 设备节点与作业用户
        run: |
          set -u
          echo '=== 设备节点 ==='
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
            stat -c 'STAT_MODE=%A STAT_OWNER=%U STAT_GROUP=%G STAT_DEV=%t,%T' /dev/kvm
            echo 'KVM_DEVICE_EXISTS=yes'
          else
            echo 'KVM_DEVICE_EXISTS=no'
          fi
          echo
          echo '=== 作业用户与组（看是否在 kvm 组）==='
          id
          echo
          echo '=== 直接读写检查 ==='
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'KVM_ACCESSIBLE=yes'
          else
            echo 'KVM_ACCESSIBLE=no'
            # 分开报告，方便区分「设备没有」和「有设备但没权限」。
            [ -e /dev/kvm ] && echo 'KVM_DENIED_BY_PERMISSION=yes' || echo 'KVM_DENIED_BY_PERMISSION=no'
          fi

      - name: 虚拟化标志与内核模块
        run: |
          set -u
          echo '=== CPU 虚拟化标志 ==='
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(vmx|svm|hypervisor)$' || echo '（未找到 vmx/svm/hypervisor）'
          echo
          echo '=== CPU 与内存 ==='
          grep -m1 'model name' /proc/cpuinfo || true
          echo "NPROC=$(nproc)"
          free -h
          echo
          echo '=== kvm 模块 ==='
          lsmod | grep -i '^kvm' || echo '（kvm 模块未加载）'
          ls -d /sys/module/kvm* 2>/dev/null || echo '（无 kvm 模块目录）'

      - name: sudo 可用性（不改设备权限）
        run: |
          set -u
          # 只探测是否免密，不改 /dev/kvm 的 mode —— 巡检作业不做任何变更，
          # 「sudo chmod 666 能在毫秒级解决权限」这条已有实测证据
          # （2026-11-10 run 42811100800：KVM_CHMOD_ELAPSED_MS=7 → KVM_ACCESSIBLE=yes）。
          if sudo -n true 2>/dev/null; then
            echo 'SUDO_NOPASSWD=yes'
          else
            echo 'SUDO_NOPASSWD=no'
          fi

      - name: 提权后可否读写（只读探测，不落改动）
        id: escalation
        run: |
          set -u
          # 这一条是 kvm-probe 从「有设备无权限」升级为「能判断真实可用性」的关键：
          # 2026-11-09 的基线只测了**未提权**时的 -r/-w，于是巡检结论一直是 no，
          # 而 CI 里真正要跑客机的作业早已靠 sudo 提权拿到 yes。巡检与实况脱节。
          #
          # 本步骤同样不改设备权限：判定方式是把「提权后是否可读写」作为一个**推得出来
          # 的结论**报出来（设备在 + 免密 sudo 可用 ⇒ 可提权），并把提权实测留给
          # 真正要用的作业去做。
          # 用显式 if 块而不是 `X=no; [ cond ] && X=yes`：后者在**作为 step 最后一条
          # 语句**时，条件为假会让整条 step 以退出码 1 判红（bash -e 的已知行为，
          # 实测 `bash -e -c 'X=no; [ -e /nope ] && X=yes'` → exit 1）。
          # 现在这两行虽然不在末尾、暂不会触发，但排版一动就可能变成末尾 ——
          # 统一用 if 块，消掉这个隐患。
          DEVICE=no
          if [ -e /dev/kvm ]; then DEVICE=yes; fi
          SUDO=no
          if sudo -n true 2>/dev/null; then SUDO=yes; fi
          if [ "$DEVICE" = yes ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ESCALATION=not-needed
          elif [ "$DEVICE" = yes ] && [ "$SUDO" = yes ]; then
            ESCALATION=available
          else
            ESCALATION=unavailable
          fi
          echo "KVM_ESCALATION=$ESCALATION"
          echo "escalation=$ESCALATION" >> "$GITHUB_OUTPUT"

      - name: 汇总并记录结论
        id: verdict
        run: |
          set -u
          ESCALATION="${{ steps.escalation.outputs.escalation }}"
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            VERDICT='可读写'
            DETAIL='`/dev/kvm` **存在且可直接读写** → 可以走 KVM 硬件加速（无需提权）'
            echo '::notice title=KVM 能力::KVM_ACCESSIBLE=yes（未提权即可读写）'
          elif [ -e /dev/kvm ] && [ "$ESCALATION" = available ]; then
            VERDICT='有设备、需提权'
            DETAIL='`/dev/kvm` 存在但作业用户无权限；**免密 sudo 可用**（`chmod 666` 实测 7 ms 生效）→ 提权后可用 KVM'
            echo '::notice title=KVM 能力::KVM_ACCESSIBLE=no，但 KVM_ESCALATION=available（提权后可用，非故障）'
          elif [ -e /dev/kvm ]; then
            VERDICT='有设备无权限'
            DETAIL='`/dev/kvm` 存在、作业用户无权限，且**免密 sudo 不可用** → 无法提权'
            echo '::warning title=KVM 能力::有 /dev/kvm 但既无权限也无法提权'
          else
            VERDICT='无设备'
            DETAIL='`/dev/kvm` **不存在** → 只能 TCG 软件模拟'
            echo '::warning title=KVM 能力::托管 runner 不提供 /dev/kvm'
          fi

          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "KVM_VERDICT=$VERDICT"
          {
            echo '## KVM 能力巡检'
            echo ''
            echo "- 结论：$DETAIL"
            echo "- KVM 设备：$( [ -e /dev/kvm ] && echo 存在 || echo 不存在 )"
            echo "- 提权可用性：${ESCALATION:-unknown}（available=免密 sudo 可提权）"
            echo "- 作业用户：$(id -u)/$(id -un)，组 $(id -Gn | tr ' ' ',')"
            echo "- CPU：$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
            echo "- 核数：$(nproc)"
            echo "- 内存：$(free -g | awk '/^Mem:/{print $2}') GiB"
            echo "- kvm 模块：$(lsmod | grep -ci '^kvm') 条"
            echo "- 触发方式：${{ github.event_name }}"
            echo ''
            echo '> 本作业只巡检，不安装、不下载镜像、不启动虚拟机；红叉不影响任何 PR 的必需检查。'
            echo '> 「未提权不可读写」不等于「KVM 不可用」：真实可用性由 qemu-destruct-linux-guest'
            echo '> 与 qemu-shutdown-destruct 两个作业提权后实测。'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 自毁续删语义验证：托管 windows-latest，不真关机。
  #
  # 2026-11-11 用户要求「不用 self-hosted」后，原来那条真关机的
  # vm-shutdown-destruct 已删除（本仓库 runners total_count = 0，它永远排队）。
  # 本作业保留它的**语义**：阶段一登记待删目标，阶段二按 RunOnce 原文重放，
  # 断言「续删命令确实执行且目标被删」。不真关机 —— 托管 runner 关机就没了。
  # ---------------------------------------------------------------------------

  wiring-probe:
    name: 自毁续删语义验证（不关机，托管 runner）
    needs: gate
    # 完整自毁续删语义验证：不关机、不用 VM，在托管 windows-latest 上跑完两阶段。
    # 这是「完整 CI 也跑关机自毁测试」的落地链路，因此 push / PR / 手动都跑。
    # PR 上挂 continue-on-error：它约 40 分钟且受宿主环境影响，不该阻塞代码评审；
    # push 到 main 与手动触发时严格（失败即红），这样真正的回归会被抓住。
    # 刻意不看 gate.outputs.skip：日判重只省巡检成本，不约束自毁语义验证。
    if: needs.gate.result == 'success'
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    # 同上：两阶段必须跑完（shutdown 登记 → resume 重放断言）。
    # 被取消会留下「登记了但没验证续删」的半成品，判据失真。
    concurrency:
      group: cx-wiring-probe-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 40
    # 刻意不设 CXPLUS_NO_LOG_FILE：它只被 windows/node-source/main.mjs 读取，
    # 本作业既不跑 Node 宿主也不跑原生宿主（只跑 purge-tests.exe + PowerShell），
    # 设了就是第二个 CX_NATIVE_BUILD_ALLOW_UNSIGNED 式死变量（见 06 号文档缺陷 b）。
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建扩展包与 Windows 注入资源
        run: |
          npm run build
          npm run build:windows -- --release

      - name: 构建原生测试产物（同一接线）
        shell: pwsh
        run: |
          ./windows/native-source/build-windows.ps1 -BuildTests

      - name: 断言 purge-tests.exe 已生成
        shell: pwsh
        run: |
          $exe = 'windows\native-build\bin\purge-tests.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "缺少 purge 测试产物: $exe" }
          $item = Get-Item -LiteralPath $exe
          Write-Output "purge-tests.exe = $($item.Length) 字节"

      - name: 记录运行前的 RunOnce 基线
        shell: pwsh
        run: |
          # 只记录，不清场：托管 runner 是干净的，记录基线便于失败时区分
          # 「本作业留下的」和「镜像里本来就有的」。
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\RunOnce'
          $baseline = @()
          if (Test-Path -LiteralPath $key) {
            $item = Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue
            if ($null -ne $item) {
              $baseline = @($item.PSObject.Properties | Where-Object { $_.Name -like 'cxplus-purge-*' } | ForEach-Object { $_.Name })
            }
          }
          Write-Output "运行前 cxplus-purge 登记: $(if ($baseline.Count -eq 0) { '(无)' } else { $baseline -join ', ' })"
          if ($baseline.Count -gt 0) {
            Write-Warning 'runner 镜像里已有 cxplus-purge-* 登记，续删断言可能受干扰。'
          }

      - name: 阶段一：登记待删目标（不关机）
        shell: pwsh
        # -NoShutdown：只做「登记 + 断言」，不真的关机 —— 托管 runner 一关机就没了。
        run: ./scripts/vm/run-shutdown-destruct.ps1 -Stage shutdown -NoShutdown
        env:
          CX_NATIVE_PURGE_EXE: ${{ github.workspace }}\windows\native-build\bin\purge-tests.exe
          CX_NATIVE_HOST_EXE: ${{ github.workspace }}\windows\native-build\bin\chaoxing_plus.exe

      - name: 阶段二：按 RunOnce 原文重放并断言续删
        shell: pwsh
        # -ReplayRunOnce：把注册表里存下的命令串原样执行一次，
        # 模拟「登录时 Windows 执行 RunOnce」，然后由 purge-tests 的 resume
        # 阶段断言「目标已删 + RunOnce 登记已撤销」。
        run: ./scripts/vm/run-shutdown-destruct.ps1 -Stage resume -ReplayRunOnce
        env:
          CX_NATIVE_PURGE_EXE: ${{ github.workspace }}\windows\native-build\bin\purge-tests.exe
          CX_NATIVE_HOST_EXE: ${{ github.workspace }}\windows\native-build\bin\chaoxing_plus.exe

      - name: 断言运行后无残留
        if: always()
        shell: pwsh
        run: |
          # 失败时也要能看出留下了什么：这条不 throw，只把现状写进日志与 Summary，
          # 避免它把原始失败覆盖成「清理失败」。
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\RunOnce'
          $leftover = @()
          if (Test-Path -LiteralPath $key) {
            $item = Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue
            if ($null -ne $item) {
              $leftover = @($item.PSObject.Properties | Where-Object { $_.Name -like 'cxplus-purge-*' } | ForEach-Object { $_.Name })
            }
          }
          # 续删脚本落在 $tempRoot：有 RUNNER_TEMP 时是它，否则回退 %TEMP%（见脚本第 51 行）。
          # 两个都要查，否则 runner 上二者不一致时会报出假的「无残留」。
          $tempRoots = @($env:RUNNER_TEMP, $env:TEMP) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique
          $tempDirs = @($tempRoots | ForEach-Object {
            Get-ChildItem -LiteralPath $_ -Directory -Filter 'cx-purge-*' -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          })
          Write-Output "运行后 cxplus-purge 登记: $(if ($leftover.Count -eq 0) { '(无)' } else { $leftover -join ', ' })"
          Write-Output "运行后 cx-purge-* 目录: $(if ($tempDirs.Count -eq 0) { '(无)' } else { $tempDirs -join ', ' })"
          @(
            '## 自毁续删语义验证'
            ''
            "- 运行后 RunOnce 残留：$(if ($leftover.Count -eq 0) { '无' } else { $leftover -join ', ' })"
            "- 运行后临时目录残留：$(if ($tempDirs.Count -eq 0) { '无' } else { $tempDirs -join ', ' })"
            ''
            '> 覆盖范围见本文件 `wiring-probe` 的注释：验证「RunOnce 命令串可执行且执行后删净并自撤销」，'
            '> **不覆盖**真实重启语义（`WM_QUERYENDSESSION` 时序、`MOVEFILE_DELAY_UNTIL_REBOOT` 重启后消失）。'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: 上传探针证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cx-vm-wiring-probe
          compression-level: 0
          path: |
            ${{ runner.temp }}/cx-purge-*.log
            ${{ runner.temp }}/cx-purge-*.txt
          if-no-files-found: warn
          retention-days: 7

  qemu-shutdown-destruct:
    name: 关机自毁与开机续删（托管 Ubuntu + QEMU + KVM）
    runs-on: ubuntu-24.04
    # 独立 concurrency：45 分钟的客机两阶段不该被新 push 打断。
    concurrency:
      group: cx-qemu-destruct-${{ github.ref }}
      cancel-in-progress: false
    needs: [gate, build-guest-image]
    # ── 触发条件（2026-11-11 合并两方意图）────────────────────────────────
    #
    # 【意图 1：用户要求「不要跳过任务」（captain 侧，优先级高）】
    #   不按 event_name / 变量门跳过 —— PR 上也跑，每次都跑。
    #
    # 【意图 2：t96 修的假绿（必须保留）】
    #   旧行为：job 总会启动，内部发现「客机镜像未配置」就 exit 0（成功），
    #   只在 Step Summary 里写「跳过不等于验证通过」—— job 结论仍是 success。
    #   用户实测抓到：run 42963390787 明明什么都没跑却显示绿色。
    #   ⇒ 已修：内部 skip 不再 exit 0，改为 `::error` + exit 1（见「解析客机镜像」步骤）。
    #   所以「未配置镜像」现在会**如实失败**，而不是伪装成成功。
    #
    # 【两者的交点】
    #   意图 1 要求「不跳过」，意图 2 要求「不撒谎」。
    #   合起来的正确语义 = **跑，跑不了就红**（不是 skipped、不是 success）。
    #   这正是用户「跳过不等于验证通过」的原话要求。
    #
    # ⚠️ 代价（已知并接受）：本仓库从未配置过 CX_QEMU_GUEST_IMAGE
    #   （gh api /actions/variables 只有 EXAMINATION_CLIENT_DATABASE_1/2），
    #   所以这条作业会持续红，直到配置镜像。这是「不跳过」的真实代价，
    #   用户明确选择不跳过，故按此实现。
    #
    # 需要什么才能让它变绿（详见 job 末尾注释与 summary）：
    #   repo variable `CX_QEMU_GUEST_IMAGE` = 预装好的 Windows qcow2 的
    #   绝对路径或 https URL；外加 secret `CX_QEMU_GUEST_SSH_KEY`。
    if: needs.gate.result == 'success' && needs.build-guest-image.result == 'success'
    # 硬上限：45 分钟。构成 = apt 装 qemu（~2 min）+ 客机冷启动（≤15 min）
    # + 两阶段与重启（~10 min）+ 证据收集（~2 min），再留余量。
    timeout-minutes: 45
    # 客机镜像来源：手动输入优先，其次仓库变量。走到这里说明两者至少有一个非空
    # （否则 job 级 `if` 已把它判成 skipped）。
    env:
      # 镜像来源：手动触发可用 github.event.inputs.guest_image 覆盖；
      #   默认用 build-guest-image 作业存入的 Actions Cache（优先读 cache、读不到就构建）。
      CX_QEMU_GUEST_IMAGE: ${{ github.event.inputs.guest_image || format('{0}/guest-cache/guest.qcow2', github.workspace) }}
      CX_QEMU_GUEST_PURGE_EXE: ${{ vars.CX_QEMU_GUEST_PURGE_EXE || 'C:/cx/native/purge-tests.exe' }}
      CX_QEMU_HOSTFWD_SSH: '2222'
      CX_QEMU_BOOT_TIMEOUT_SEC: '900'
      # ⚠️ 2026-11-12 rebase 修复：合并 build-guest-image 的 801a55b 顺手删掉了这行声明，
      #   但下面 4 处 `USER_HOST="${CX_QEMU_GUEST_SSH_USER}@127.0.0.1"` 仍在用。
      #   未声明时 github actions 会把它替换成空串 ⇒ "ssh  -p 2222 ... @127.0.0.1"
      #   必然失败，且报错看起来像「客机 SSH 不通」，与真实原因（环境变量缺失）无关。
      #   镜像里的账号由 build-guest-image 的 GUEST_USER 决定（那里是 runner），
      #   两者必须一致；保留 vars 覆盖以便自定义镜像。
      CX_QEMU_GUEST_SSH_USER: ${{ vars.CX_QEMU_GUEST_SSH_USER || 'runner' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ⚠️ 2026-11-12：镜像来自 build-guest-image 作业存入的 cache，
      #   不再依赖仓库变量 CX_QEMU_GUEST_IMAGE。
      #   这正是用户要求的「优先读 cache，读不到就构建」：
      #   build-guest-image 在 cache 未命中时会在线构建并回写。
      - name: 从 cache 恢复客机镜像
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/guest-cache
          key: ${{ env.GUEST_IMAGE_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: 确认镜像可用
        run: |
          set -eu
          IMG="$GITHUB_WORKSPACE/guest-cache/guest.qcow2"
          if [ ! -f "$IMG" ]; then
            echo "::error title=cache 里没有镜像::build-guest-image 应当已经存入"
            exit 1
          fi
          SIZE=$(stat -c %s "$IMG")
          echo "镜像 = $IMG ($SIZE 字节)"
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "::error title=镜像体积异常::只有 $SIZE 字节"
            exit 1
          fi
      - name: 环境基线
        run: |
          set -u
          echo '=== 内核与发行版 ==='
          uname -a
          . /etc/os-release && echo "PRETTY=$PRETTY_NAME"
          echo
          echo '=== CPU 虚拟化标志（宿主是否开嵌套虚拟化）==='
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(vmx|svm|hypervisor)$' || echo '（未找到 vmx/svm/hypervisor）'
          grep -m1 'model name' /proc/cpuinfo || true
          echo "NPROC=$(nproc)"
          free -h
          echo
          echo '=== kvm 模块 ==='
          lsmod | grep -i '^kvm' || echo '（kvm 模块未加载）'
          echo
          echo '=== 磁盘余量（客机覆盖层与日志都落在 RUNNER_TEMP）==='
          df -h "$RUNNER_TEMP"

      # ── KVM 授权与断言 ────────────────────────────────────────────────────
      # 输出 kvm_ok=yes|no 与 kvm_reason。后续所有重活都以 kvm_ok 为门，
      # 拿不到就 skip 而不是 fail —— 这是环境能力问题，不是仓库代码问题。
      - name: KVM 授权与可用性断言
        id: kvm
        run: |
          set -u
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          accessible() { [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; }

          DEVICE=no
          if [ -e /dev/kvm ]; then
            DEVICE=yes
            ls -l /dev/kvm
            stat -c 'STAT_MODE=%A STAT_OWNER=%U STAT_GROUP=%G STAT_DEVICE=%t,%T' /dev/kvm
            echo "KVM_DEVICE_GROUP=$(stat -c '%G' /dev/kvm)"
            echo "RUNNER_GROUPS=$(id -Gn | tr ' ' ',')"
          fi
          out kvm_device "$DEVICE"

          if accessible; then
            KVM_BEFORE=yes
          else
            KVM_BEFORE=no
          fi
          out kvm_accessible_before "$KVM_BEFORE"

          SUDO=no
          if sudo -n true 2>/dev/null; then SUDO=yes; fi
          out kvm_sudo "$SUDO"

          # 提权：2026-11-09 实测 8 ms 生效。只改 mode，不改属主也不加组，
          # 这样作业结束后不需要还原（runner 是一次性的）。
          if [ "$DEVICE" = yes ] && [ "$KVM_BEFORE" = no ]; then
            if [ "$SUDO" = yes ]; then
              START_MS=$(date +%s%3N)
              sudo chmod 666 /dev/kvm
              END_MS=$(date +%s%3N)
              echo "KVM_CHMOD_ELAPSED_MS=$((END_MS - START_MS))"
              stat -c 'STAT_MODE_AFTER=%A' /dev/kvm
            else
              echo '::warning title=KVM::sudo -n 不可用，无法提权 /dev/kvm'
            fi
          fi

          if accessible; then
            KVM_OK=yes; REASON=''
            echo 'KVM_ACCESSIBLE=yes'
          else
            KVM_OK=no
            if [ "$DEVICE" = no ]; then
              REASON='无 /dev/kvm 设备（宿主未提供嵌套虚拟化）'
            elif [ "$SUDO" = no ]; then
              REASON='有 /dev/kvm 但作业用户无权限，且 sudo -n 不可用'
            else
              REASON='有 /dev/kvm，提权后仍不可读写'
            fi
            echo 'KVM_ACCESSIBLE=no'
            echo "::notice title=KVM 不可用，本次跳过客机验证::$REASON"
          fi
          out kvm_ok "$KVM_OK"
          out kvm_reason "$REASON"

      # ── QEMU 安装与加速确认 ───────────────────────────────────────────────
      - name: QEMU 安装与 KVM 加速确认
        id: qemu
        if: steps.kvm.outputs.kvm_ok == 'yes'
        run: |
          set -u
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          # 托管镜像不保证预装 qemu。装不上属于环境问题 → skip，不是失败。
          if ! command -v qemu-system-x86_64 >/dev/null 2>&1; then
            echo '未预装 qemu，安装 qemu-system-x86 与 qemu-utils'
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils
          fi

          if ! command -v qemu-system-x86_64 >/dev/null 2>&1; then
            out qemu_ok no
            out qemu_reason 'qemu-system-x86_64 安装失败或不在此镜像的软件源里'
            echo '::notice title=QEMU 不可用，本次跳过客机验证::安装失败'
            exit 0
          fi

          qemu-system-x86_64 --version | head -2
          qemu-img --version | head -1
          echo '=== 加速器列表 ==='
          qemu-system-x86_64 -accel help || true
          if qemu-system-x86_64 -accel help 2>/dev/null | grep -qx 'kvm'; then
            QEMU_KVM=yes
          else
            QEMU_KVM=no
          fi
          echo "QEMU_KVM_ACCEL=$QEMU_KVM"
          out qemu_kvm_accel "$QEMU_KVM"
          if [ "$QEMU_KVM" = yes ]; then
            out qemu_ok yes
            out qemu_reason ''
          else
            out qemu_ok no
            out qemu_reason 'QEMU 未编译/未提供 kvm 加速器，只有 TCG 会导致冷启动远超 45 分钟上限'
            echo '::notice title=QEMU 无 KVM 加速，本次跳过客机验证::只有 TCG'
          fi

      # ── 脚本接线检查（在宿主上做，不执行两阶段）────────────────────────────
      - name: 脚本接线检查（pwsh 解析 + 客机内执行的必要性）
        id: wiring
        if: steps.kvm.outputs.kvm_ok == 'yes'
        run: |
          set -u
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          FAIL=0

          echo '=== 两阶段脚本是否还在 ==='
          for f in scripts/vm/run-shutdown-destruct.ps1 scripts/vm/assert-clean.ps1 \
                   scripts/vm/qemu-guest-destruct.ps1 \
                   windows/native-source/tests/purge-tests.c \
                   windows/native-source/build-windows.ps1; do
            if [ -f "$f" ]; then echo "OK   $f"; else echo "MISS $f"; FAIL=1; fi
          done

          # 分阶段驱动的环境变量契约：run-shutdown-destruct.ps1 依赖它把
          # shutdown/resume 两个阶段注入 purge-tests.c。符号消失就说明契约断了。
          echo
          echo '=== 分阶段驱动的环境变量契约 ==='
          for token in CX_PURGE_TEST_STAGE CX_PURGE_TEST_TARGET cxplus-purge-; do
            n=$(grep -rlF "$token" scripts/vm windows/native-source 2>/dev/null | wc -l)
            echo "TOKEN=$token FILES=$n"
            [ "$n" -gt 0 ] || FAIL=1
          done

          echo
          echo '=== Linux pwsh 是否有 Registry provider（决定两阶段能否在宿主跑）==='
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' || true
            # 期望 absent：Linux pwsh 没有 HKCU/HKLM 驱动器，run-shutdown-destruct.ps1
            # 里的 HKCU:\...\RunOnce 会直接抛错。这正是「两阶段必须进客机」的证据。
            if pwsh -NoProfile -Command 'if (Get-PSDrive -Name HKCU -ErrorAction SilentlyContinue) { "present" } else { "absent" }' | grep -q present; then
              HKCU=present
            else
              HKCU=absent
            fi
            echo "PWSH_HKCU_PROVIDER=$HKCU"
            out pwsh_hkcu "$HKCU"

            echo
            echo '=== 用 PowerShell 解析器做语法校验（执行会因缺 Registry 失败，解析不会）==='
            if pwsh -NoProfile -Command '
              $bad = 0
              foreach ($f in @("scripts/vm/run-shutdown-destruct.ps1", "scripts/vm/assert-clean.ps1", "scripts/vm/qemu-guest-destruct.ps1")) {
                $tokens = $null; $errors = $null
                [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$tokens, [ref]$errors)
                if ($errors.Count -gt 0) { $bad++; Write-Output ("PARSE_FAIL " + $f + " : " + ($errors[0].Message)) }
                else { Write-Output ("PARSE_OK " + $f) }
              }
              if ($bad -gt 0) { exit 1 }
            '; then
              echo 'PS_PARSE=ok'
            else
              echo 'PS_PARSE=failed'; FAIL=1
            fi
          else
            echo 'PWSH_MISSING=yes'
            out pwsh_hkcu 'unknown'
            FAIL=1
          fi

          out wiring_ok "$([ "$FAIL" -eq 0 ] && echo yes || echo no)"
          if [ "$FAIL" -ne 0 ]; then
            echo '::error title=接线检查::脚本或环境契约缺失，见上方 MISS/FAIL 行'
            exit 1
          fi

      # ── 客机镜像解析 ─────────────────────────────────────────────────────
      # 走到这一步说明 job 级 `if` 已确认「镜像已配置」（否则整个 job 是 skipped）。
      # 所以这里**任何**失败都属于「配置了但坏了」，必须判红 —— 不允许 exit 0。
      # t96 之前这里统一 `exit 0`，于是「下载失败 / 格式不对 / 文件不存在」
      # 全部被悄悄算成成功，与「未配置」混在一起。
      - name: 解析客机镜像
        id: image
        if: steps.qemu.outputs.qemu_ok == 'yes'
        env:
          SSH_KEY: ${{ secrets.CX_QEMU_GUEST_SSH_KEY }}
        run: |
          set -u
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          # 配置了但坏 → 必须红。给出精确原因 + 可操作的修法。
          fail() {
            out image_ok no
            out image_reason "$1"
            echo "::error title=客机镜像不可用（已配置但不可用）::$1"
            exit 1
          }

          IMG="${CX_QEMU_GUEST_IMAGE:-}"
          # 2026-11-11 用户要求「不要跳过任务」：job 级 if 不再按镜像变量跳过，
          # 所以「未配置」会走到这里。它必须**如实判红**，而不是 skip/exit 0。
          #
          # 历史：旧代码这里是 `skip(){ ... exit 0; }` ⇒ job 报 success = 假绿
          # （run 42963390787 实测：客机一步没跑却显示绿色）。
          # t96 一度改成 job 级 if 判变量 ⇒ 显示 skipped（不撒谎，但仍是「跳过」）。
          # 现在：跑不了就红 —— 这是「跳过不等于验证通过」的字面执行。
          if [ -z "$IMG" ]; then
            fail '未配置客机镜像：请设置仓库变量 CX_QEMU_GUEST_IMAGE（预装好的 Windows qcow2 绝对路径或 https URL），或用手动触发时的 guest_image 输入'
          fi

          # 出口检查：不装 Windows。体积（5.6 GiB 级）、许可与冷启动时间都不合适，
          # 所以 ISO 只做显式拒绝，不作为任何退路。
          case "$IMG" in
            *.iso|*.ISO) fail '拒绝 ISO 装机路径：体积/许可/时间都不合适，请改用预装好的 qcow2' ;;
          esac

          BASE="$RUNNER_TEMP/guest-base.qcow2"
          case "$IMG" in
            http://*|https://*)
              echo "下载预置 qcow2：$IMG"
              curl -fL --retry 3 --retry-delay 3 -o "$BASE" "$IMG" \
                || fail "下载客机镜像失败：$IMG（检查 URL 可达性、是否需要鉴权、是否超时）"
              ;;
            *)
              if [ ! -f "$IMG" ]; then
                fail "CX_QEMU_GUEST_IMAGE 指向的本地文件不存在：$IMG"
              fi
              cp --sparse=always "$IMG" "$BASE"
              ;;
          esac

          # 格式必须是 qcow2：raw/vmdk 无法做覆盖层（而母镜像必须保持只读）。
          FORMAT=$(qemu-img info --output=json "$BASE" | tr -d ' \n' | sed -n 's/.*"format":"\([^"]*\)".*/\1/p')
          echo "GUEST_IMAGE_FORMAT=$FORMAT"
          if [ "$FORMAT" != qcow2 ]; then
            fail "客机镜像格式为 ${FORMAT:-unknown}，需要 qcow2（母镜像只读 + 覆盖层写入）"
          fi

          # 覆盖层：母镜像全程不动，客机内的一切写入都落在覆盖层里。
          # 这样同一天多次运行不会污染或耗尽母镜像。
          qemu-img create -f qcow2 -b "$BASE" -F qcow2 "$RUNNER_TEMP/guest-overlay.qcow2" >/dev/null
          qemu-img info --output=json "$RUNNER_TEMP/guest-overlay.qcow2" | tr -d ' \n'
          echo

          if [ -z "${SSH_KEY:-}" ]; then
            fail '缺少 secret CX_QEMU_GUEST_SSH_KEY：客机内两阶段需要一个命令通道（这是配置缺失，不是镜像问题）'
          fi
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/guest-ssh-key"
          chmod 600 "$RUNNER_TEMP/guest-ssh-key"

          out image_ok yes
          out image_reason ''

      # ── 启动客机 ─────────────────────────────────────────────────────────
      - name: 启动 QEMU 客机并等待 SSH 回连
        id: boot
        if: steps.image.outputs.image_ok == 'yes'
        run: |
          set -u
          SSH_PORT="${CX_QEMU_HOSTFWD_SSH}"
          # -enable-kvm 是硬要求：没有它冷启动会远超 45 分钟上限，宁可失败也不静默退 TCG。
          # 绝对不能加 -no-reboot / -no-shutdown：这两个开关会让 QEMU 在客机重启时
          # 直接退出进程，客机永远不会再上电，「登记 → 重启 → 重放」就断在第二步。
          qemu-system-x86_64 \
            -enable-kvm -cpu host -smp 4 -m 6144 \
            -drive file="$RUNNER_TEMP/guest-overlay.qcow2",if=virtio,cache=writeback \
            -nic "user,model=virtio-net-pci,hostfwd=tcp:127.0.0.1:${SSH_PORT}-:22" \
            -display none -vga none \
            -pidfile "$RUNNER_TEMP/qemu.pid" \
            > "$RUNNER_TEMP/qemu-stdout.log" 2>&1 &
          QEMU_PID=$!
          echo "$QEMU_PID" > "$RUNNER_TEMP/qemu-bg.pid"
          echo "QEMU_PID=$QEMU_PID"

          START=$(date +%s)
          READY=no
          while [ $(( $(date +%s) - START )) -lt "$CX_QEMU_BOOT_TIMEOUT_SEC" ]; do
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo 'QEMU 进程已退出，日志尾部：'
              tail -40 "$RUNNER_TEMP/qemu-stdout.log" || true
              break
            fi
            if (exec 3<>"/dev/tcp/127.0.0.1/${SSH_PORT}") 2>/dev/null; then
              exec 3>&- 2>/dev/null || true
              READY=yes
              break
            fi
            sleep 10
          done
          echo "GUEST_SSH_READY=$READY"
          echo "BOOT_ELAPSED_SEC=$(( $(date +%s) - START ))"
          echo "GUEST_BOOT_TIMEOUT_SEC=$CX_QEMU_BOOT_TIMEOUT_SEC"
          echo '=== QEMU 启动日志（确认 kvm 加速生效）==='
          head -20 "$RUNNER_TEMP/qemu-stdout.log" || true
          # KVM 生效的直接证据：QEMU 会打印 KVM 版本或 accel=kvm。
          if grep -qiE 'kvm|accel' "$RUNNER_TEMP/qemu-stdout.log"; then
            echo 'QEMU_KVM_EVIDENCE=yes'
          else
            echo 'QEMU_KVM_EVIDENCE=no（日志无 kvm/accel 字样，需人工核对）'
          fi
          if [ "$READY" != yes ]; then
            echo '::error title=客机未在超时内回连::见上传的 qemu-stdout.log'
            exit 1
          fi

      # 把 guest 侧驱动脚本送进客机。scp 走同一条 SSH 通道，不需要额外共享。
      # 注意引号：这些命令包在 bash 单引号里，反斜杠会原样传给 PowerShell，
      # 所以路径必须写单反斜杠（写成 `C:\\cx` 会在 Windows 上创建一个名字带
      # 双反斜杠的目录）。PowerShell 的转义符是反引号，不是反斜杠。
      - name: 部署客机侧驱动脚本
        id: deploy
        if: steps.image.outputs.image_ok == 'yes'
        run: |
          set -eu
          KEY="$RUNNER_TEMP/guest-ssh-key"
          SSH="ssh -i $KEY -p ${CX_QEMU_HOSTFWD_SSH} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes"
          USER_HOST="${CX_QEMU_GUEST_SSH_USER}@127.0.0.1"
          $SSH "$USER_HOST" 'powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path C:\cx\scripts\vm, C:\cx\evidence, C:\cx\work | Out-Null; Test-Path C:\cx\scripts\vm"'
          scp -i "$KEY" -P "${CX_QEMU_HOSTFWD_SSH}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            scripts/vm/qemu-guest-destruct.ps1 scripts/vm/run-shutdown-destruct.ps1 scripts/vm/assert-clean.ps1 \
            "$USER_HOST:C:/cx/scripts/vm/"
          # 复核：客机里三个脚本都在，缺一个就说明 scp 没走通，后面必然假失败。
          $SSH "$USER_HOST" 'powershell -NoProfile -Command "Get-ChildItem C:\cx\scripts\vm -Name | Sort-Object"'
          echo '客机侧脚本已部署：C:\cx\scripts\vm\'

      # ── 客机内两阶段：登记 ────────────────────────────────────────────────
      # 注意：这里的 env: 是**宿主**进程的环境变量，不会自动进入客机。
      # 所以 purge 产物路径必须显式作为参数穿过 SSH 边界（-PurgeExe），
      # 客机侧脚本再把它写进 $env:CX_NATIVE_PURGE_EXE 交给 run-shutdown-destruct.ps1。
      - name: 阶段一：客机内登记续删（不触发关机）
        id: register
        if: steps.image.outputs.image_ok == 'yes'
        run: |
          set -eu
          KEY="$RUNNER_TEMP/guest-ssh-key"
          SSH="ssh -i $KEY -p ${CX_QEMU_HOSTFWD_SSH} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes"
          USER_HOST="${CX_QEMU_GUEST_SSH_USER}@127.0.0.1"
          # 客机镜像里必须已预置 purge-tests.exe（由 build-windows.ps1 -BuildTests 产出）。
          # 本作业不构建原生宿主：那需要整个 Windows 工具链，超出 45 分钟预算。
          $SSH "$USER_HOST" "powershell -NoProfile -ExecutionPolicy Bypass -File C:/cx/scripts/vm/qemu-guest-destruct.ps1 -Phase register -PurgeExe '${CX_QEMU_GUEST_PURGE_EXE}'"

      # ── 重启客机（由宿主触发，等价于真关机的后半程）──────────────────────
      - name: 阶段二前半：重启客机并等待回连
        id: reboot
        if: steps.image.outputs.image_ok == 'yes'
        run: |
          set -u
          KEY="$RUNNER_TEMP/guest-ssh-key"
          SSH_PORT="${CX_QEMU_HOSTFWD_SSH}"
          SSH="ssh -i $KEY -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes"
          USER_HOST="${CX_QEMU_GUEST_SSH_USER}@127.0.0.1"

          # 登记阶段的证据先取回宿主，否则重启后客机内的文件会随覆盖层滚走（这里其实是保留的，
          # 但先落盘更稳）。
          scp -i "$KEY" -P "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$USER_HOST:C:/cx/evidence/*" "$RUNNER_TEMP/" 2>/dev/null || echo '（登记阶段暂无证据文件）'

          echo '在客机内发起重启（等价于真关机流程的后半程）'
          $SSH "$USER_HOST" 'shutdown /r /f /t 5' || echo '（SSH 连接被重启切断，属预期）'

          echo '等待端口关闭…'
          for _ in $(seq 1 30); do
            if ! (exec 3<>"/dev/tcp/127.0.0.1/${SSH_PORT}") 2>/dev/null; then break; fi
            sleep 2
          done

          echo '等待客机回连…'
          START=$(date +%s)
          READY=no
          while [ $(( $(date +%s) - START )) -lt "$CX_QEMU_BOOT_TIMEOUT_SEC" ]; do
            if (exec 3<>"/dev/tcp/127.0.0.1/${SSH_PORT}") 2>/dev/null; then
              exec 3>&- 2>/dev/null || true
              READY=yes; break
            fi
            sleep 10
          done
          echo "GUEST_REBOOT_READY=$READY"
          echo "REBOOT_ELAPSED_SEC=$(( $(date +%s) - START ))"
          if [ "$READY" != yes ]; then
            echo '::error title=客机重启后未回连::见上传的 qemu-stdout.log'
            exit 1
          fi
          # 重启后留一点时间给 RunOnce 与登录后自启逻辑跑完。
          sleep 30

      # ── 客机内两阶段：重放断言 ────────────────────────────────────────────
      - name: 阶段二后半：客机内重放并断言痕迹已删
        id: replay
        if: steps.image.outputs.image_ok == 'yes'
        run: |
          set -eu
          KEY="$RUNNER_TEMP/guest-ssh-key"
          SSH="ssh -i $KEY -p ${CX_QEMU_HOSTFWD_SSH} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes"
          USER_HOST="${CX_QEMU_GUEST_SSH_USER}@127.0.0.1"

          # 先取回证据：重放断言可能失败，失败时更需要证据落盘，所以取证在断言之前。
          scp -i "$KEY" -P "${CX_QEMU_HOSTFWD_SSH}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$USER_HOST:C:/cx/evidence/*" "$RUNNER_TEMP/" 2>/dev/null || echo '（重放阶段开始前暂无证据文件）'

          REPLAY_RC=0
          $SSH "$USER_HOST" "powershell -NoProfile -ExecutionPolicy Bypass -File C:/cx/scripts/vm/qemu-guest-destruct.ps1 -Phase replay -PurgeExe '${CX_QEMU_GUEST_PURGE_EXE}'" || REPLAY_RC=$?
          echo "REPLAY_EXIT_CODE=$REPLAY_RC"

          # 收尾自毁断言：与 vm-shutdown-destruct 的 teardown 同口径 —— 只读检查，不替自毁擦屁股；
          # 而且**必须真的判红**（这里不能 `|| true`，否则「自毁没清干净」会被静默吞掉，
          # 那正是这条作业存在的意义）。
          CLEAN_RC=0
          $SSH "$USER_HOST" 'powershell -NoProfile -ExecutionPolicy Bypass -File C:/cx/scripts/vm/assert-clean.ps1 -Stage teardown' || CLEAN_RC=$?
          echo "TEARDOWN_ASSERT_EXIT_CODE=$CLEAN_RC"

          scp -i "$KEY" -P "${CX_QEMU_HOSTFWD_SSH}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$USER_HOST:C:/cx/evidence/*" "$RUNNER_TEMP/" 2>/dev/null || echo '（重放阶段暂无证据文件）'

          # 两个退出码都要保留：先报断言失败，再报重放失败（若都失败，重放更接近根因）。
          if [ "$CLEAN_RC" -ne 0 ]; then
            echo "::error title=自毁残留::teardown 断言发现残留（exit=$CLEAN_RC），见上传的证据文件"
          fi
          if [ "$REPLAY_RC" -ne 0 ]; then
            echo "::error title=重放失败::qemu-guest-destruct.ps1 -Phase replay 退出码 $REPLAY_RC"
          fi
          if [ "$CLEAN_RC" -ne 0 ] || [ "$REPLAY_RC" -ne 0 ]; then
            exit 1
          fi

      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cx-qemu-destruct-evidence
          compression-level: 0
          path: |
            ${{ runner.temp }}/qemu-stdout.log
            ${{ runner.temp }}/cx-*.log
            ${{ runner.temp }}/cx-*.txt
            ${{ runner.temp }}/cx-*.out
          if-no-files-found: warn
          retention-days: 14

      - name: 关停客机
        if: always()
        run: |
          set -u
          # 覆盖层是一次性的，直接杀进程即可；母镜像全程未被写入。
          if [ -f "$RUNNER_TEMP/qemu-bg.pid" ]; then
            PID=$(cat "$RUNNER_TEMP/qemu-bg.pid")
            kill -TERM "$PID" 2>/dev/null || true
            sleep 3
            kill -KILL "$PID" 2>/dev/null || true
            echo "已结束 QEMU 进程 $PID"
          fi
          rm -f "$RUNNER_TEMP/guest-ssh-key"
          echo '已删除临时私钥'

      # ── 结论 ─────────────────────────────────────────────────────────────
      # 必须写清：KVM 是否可用、客机镜像是否配置、跳过原因、实际执行到了哪一步。
      - name: 结论写入 Step Summary
        if: always()
        env:
          KVM_OK: ${{ steps.kvm.outputs.kvm_ok }}
          KVM_REASON: ${{ steps.kvm.outputs.kvm_reason }}
          KVM_DEVICE: ${{ steps.kvm.outputs.kvm_device }}
          KVM_ACCESSIBLE_BEFORE: ${{ steps.kvm.outputs.kvm_accessible_before }}
          KVM_SUDO: ${{ steps.kvm.outputs.kvm_sudo }}
          QEMU_OK: ${{ steps.qemu.outputs.qemu_ok }}
          QEMU_REASON: ${{ steps.qemu.outputs.qemu_reason }}
          QEMU_KVM_ACCEL: ${{ steps.qemu.outputs.qemu_kvm_accel }}
          IMAGE_OK: ${{ steps.image.outputs.image_ok }}
          IMAGE_REASON: ${{ steps.image.outputs.image_reason }}
          WIRING_OK: ${{ steps.wiring.outputs.wiring_ok }}
          PWSH_HKCU: ${{ steps.wiring.outputs.pwsh_hkcu }}
          KVM_STEP: ${{ steps.kvm.outcome }}
          QEMU_STEP: ${{ steps.qemu.outcome }}
          WIRING_STEP: ${{ steps.wiring.outcome }}
          IMAGE_STEP: ${{ steps.image.outcome }}
          BOOT_STEP: ${{ steps.boot.outcome }}
          DEPLOY_STEP: ${{ steps.deploy.outcome }}
          REGISTER_STEP: ${{ steps.register.outcome }}
          REBOOT_STEP: ${{ steps.reboot.outcome }}
          REPLAY_STEP: ${{ steps.replay.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          yes_no() { case "$1" in yes) echo '是' ;; no) echo '否' ;; '') echo '未执行' ;; *) echo "$1" ;; esac; }

          # t96：job 级 `if` 已保证 CX_QEMU_GUEST_IMAGE 非空，能跑到这里就一定是「已配置」。
          # 保留这个变量只为 summary 里那一行可读，不再用它做跳过判断。
          IMAGE_CONFIGURED=no
          if [ -n "${CX_QEMU_GUEST_IMAGE:-}" ]; then IMAGE_CONFIGURED=yes; fi

          # 跳过的判定优先级：KVM → QEMU → 客机镜像。
          #
          # t96 修正：区分「环境不可用」与「配置了但坏」。
          #   · KVM / QEMU 不可用 = 托管 runner 能力问题，非仓库配置问题 → **不判红**，
          #     但 summary 必须写明「不是通过」，且这一步仍以 exit 0 结束。
          #   · 客机镜像不可用 = 用户在 job 级已确认配置过镜像，走到这里说明
          #     「配置了但坏」→ **必须判红**（镜像步骤本身已经 exit 1，
          #     这里再兜一次，防止将来有人把 image 步骤改成不判红）。
          ENVIRONMENT_SKIPPED=no
          CONFIG_BROKEN=no
          if [ "${KVM_OK:-}" != yes ]; then
            ENVIRONMENT_SKIPPED=yes; SKIP_STAGE='KVM 不可用'
            SKIP_REASON="${KVM_REASON:-KVM 探测步骤未执行}"
          elif [ "${QEMU_OK:-}" != yes ]; then
            ENVIRONMENT_SKIPPED=yes; SKIP_STAGE='QEMU 不可用'
            SKIP_REASON="${QEMU_REASON:-QEMU 步骤未执行}"
          elif [ "${IMAGE_OK:-}" != yes ]; then
            CONFIG_BROKEN=yes; SKIP_STAGE='客机镜像不可用'
            SKIP_REASON="${IMAGE_REASON:-客机镜像步骤未执行}"
          else
            SKIPPED=no; SKIP_STAGE=''; SKIP_REASON=''
          fi
          if [ "$ENVIRONMENT_SKIPPED" = yes ] || [ "$CONFIG_BROKEN" = yes ]; then
            SKIPPED=yes
          fi

          {
            echo '## 关机自毁与开机续删（托管 Ubuntu + QEMU + KVM）'
            echo ''
            echo '| 项 | 值 |'
            echo '| --- | --- |'
            echo "| /dev/kvm 设备存在 | $(yes_no "${KVM_DEVICE:-}") |"
            echo "| 授权前可读写 | $(yes_no "${KVM_ACCESSIBLE_BEFORE:-}") |"
            echo "| 免密 sudo 可用 | $(yes_no "${KVM_SUDO:-}") |"
            echo "| **KVM 可用（提权后复核）** | **$(yes_no "${KVM_OK:-}")** |"
            echo "| QEMU 可用 | $(yes_no "${QEMU_OK:-}") |"
            echo "| QEMU 提供 kvm 加速器 | $(yes_no "${QEMU_KVM_ACCEL:-}") |"
            echo "| 脚本接线检查通过 | $(yes_no "${WIRING_OK:-}") |"
            echo "| Linux pwsh 有 HKCU 驱动器 | ${PWSH_HKCU:-未探测}（absent 即「两阶段必须进客机」的证据）|"
            echo "| **客机镜像已配置** | **$(yes_no "$IMAGE_CONFIGURED")** |"
            echo "| 客机镜像可用（已转为 qcow2 覆盖层） | $(yes_no "${IMAGE_OK:-}") |"
            echo ''
            echo '### 实际执行到了哪一步'
            echo ''
            echo '| 步骤 | 结果 |'
            echo '| --- | --- |'
            echo "| 1. KVM 授权与断言 | ${KVM_STEP:-未执行} |"
            echo "| 2. QEMU 安装与加速确认 | ${QEMU_STEP:-未执行} |"
            echo "| 3. 脚本接线检查 | ${WIRING_STEP:-未执行} |"
            echo "| 4. 客机镜像解析 | ${IMAGE_STEP:-未执行} |"
            echo "| 5. 启动客机 | ${BOOT_STEP:-未执行} |"
            echo "| 6. 部署客机侧脚本 | ${DEPLOY_STEP:-未执行} |"
            echo "| 7. 客机内登记（-Stage shutdown -NoShutdown） | ${REGISTER_STEP:-未执行} |"
            echo "| 8. 宿主触发客机重启并等待回连 | ${REBOOT_STEP:-未执行} |"
            echo "| 9. 客机内重放（-Stage resume）+ teardown 断言 | ${REPLAY_STEP:-未执行} |"
            echo ''
            echo "作业最终状态：\`${JOB_STATUS:-unknown}\`"
            echo ''
            if [ "$CONFIG_BROKEN" = yes ]; then
              # 客机镜像「配置了但坏」：这是仓库侧可修的问题，必须红。
              echo '### 失败：客机镜像已配置但不可用'
              echo ''
              echo "- 停在：\`$SKIP_STAGE\`"
              echo "- 原因：$SKIP_REASON"
              echo ''
              echo '> 与「未配置」不同：本作业因为 `CX_QEMU_GUEST_IMAGE` 非空才会启动，'
              echo '> 所以走到这一步代表**镜像或 secret 本身有问题**，按失败处理。'
              echo '> 修复方式见本节末尾「需要准备什么」。'
            elif [ "$ENVIRONMENT_SKIPPED" = yes ]; then
              echo '### 未执行（环境不可用，不是通过）'
              echo ''
              echo "- 停在：\`$SKIP_STAGE\`"
              echo "- 原因：$SKIP_REASON"
              echo ''
              echo '> **这不是通过**。客机内的两阶段一个字节都没跑，本轮不产出任何自毁行为结论。'
              echo '> 停因是托管 runner 的环境能力（KVM/QEMU），不是本仓库的配置错误，'
              echo '> 所以不判红；但它同样**不能**被读作「自毁验证已通过」。'
            elif [ "${REPLAY_STEP:-}" = success ] && [ "${REGISTER_STEP:-}" = success ]; then
              echo '### 结论'
              echo ''
              echo '- 客机内已跑完「登记 → 重启 → 重放断言」两阶段，断言项：待删目标已删、'
              echo '  HKCU RunOnce 登记已自行撤销、无 PendingFileRenameOperations 残留。'
              echo '- 覆盖层在作业结束后随 runner 一起销毁，母镜像未被写入。'
            else
              echo '### 未完成（不是通过）'
              echo ''
              echo '- 客机镜像已配置并启动了客机，但两阶段没有都成功结束。'
              echo '- 具体失败步骤见上表与上方日志；本轮**不产出通过结论**。'
            fi
            echo ''
            echo '---'
            echo '### 需要准备什么（让本作业真正跑起来）'
            echo ''
            echo '| 项 | 要求 |'
            echo '| --- | --- |'
            echo '| repo variable `CX_QEMU_GUEST_IMAGE` | 预装好的 **Windows qcow2** 的绝对路径或 https URL。**当前未配置** |'
            echo '| secret `CX_QEMU_GUEST_SSH_KEY` | 客机内运行两阶段所需的 SSH 私钥 |'
            echo '| 镜像内容 | 已安装 OpenSSH Server，并预置 `purge-tests.exe`（`build-windows.sh -BuildTests` 产物） |'
            echo '| 体积预算 | 5.6 GiB 量级，下载 + 冷启动约 10 分钟，故本作业只手动/定时触发 |'
            echo '| 为什么不支持 ISO | 体积、许可与冷启动时间都不合适；ISO 路径会在「解析客机镜像」里被显式拒绝 |'
            echo ''
            echo '> 未配置时本作业在 job 级就被判为 `skipped`（GitHub 显示「已跳过」），'
            echo '> **不会**再伪装成 success。这与「配置了但坏 → failure」是两条不同的路径。'
            echo ''
            echo '---'
            echo '本作业只由 workflow_dispatch 与每周 schedule 触发，**不挂 pull_request**，'
            echo '红叉不影响任何 PR 的必需检查。'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 关机自毁 / 开机续删：Linux cloud image 客机，走真实重启。
  #
  # 为什么要有这条（它补的是另一个作业补不上的那一格）：
  #   · wiring-probe 用 -ReplayRunOnce 在托管 windows-latest 上执行 RunOnce 命令串，
  #     这条真的在跑，但它**没有重启**，「开机才续删」这一半是重放模拟的。
  #   · qemu-shutdown-destruct 有真实重启，但需要 Windows qcow2（仓库变量
  #     CX_QEMU_GUEST_IMAGE），而 Windows 无官方 cloud image，从 ISO 装需 20-40
  #     分钟，不适合 CI ⇒ 未配置时**如实判红**（不伪装成成功、也不静默跳过）。
  #   · 本作业用自动下载的 Ubuntu cloud image 把「真实重启」这一格补上，
  #     零人工配置，是三条里唯一「既真重启又开箱即用」的。
  #
  # 本作业用 ~260 MB 的 Ubuntu cloud image 把「真实重启」这一格补上：
  #   KVM 提权 → 起 QEMU 客机 → guest 内登记待删目标 + 开机续删单元
  #   → guest 内真实重启 → 断言「boot_id 变了 + 目标已删 + 续删确实在本次启动执行 + 单元自撤销」
  #
  # 已验证的前提（2026-11-10 run 42811100800，job 129812540883，不是推测）：
  #   STAT_MODE=crw-rw---- STAT_OWNER=root STAT_GROUP=kvm
  #   RUNNER_GROUPS=runner,adm,users,docker,systemd-journal  → runner **不在** kvm 组
  #   sudo chmod 666 /dev/kvm → KVM_CHMOD_ELAPSED_MS=7，随后 KVM_ACCESSIBLE=yes
  #   QEMU_KVM_ACCEL=yes（apt 装的 qemu-system-x86 8.2.2 自带 kvm 加速器）
  # 所以「有设备、无权限」这个卡点已经在提权后消失了，剩下只缺客机镜像。
  #
  # 它能证明什么 / 不能证明什么（不许把 Linux 客机说成 Windows RunOnce 已覆盖）：
  #   能（2026-11-11 t98 补全后共 12 项）：
  #     · QEMU 在托管 runner 上真跑得起来、guest 真能重启；
  #     · 续删单元真的执行、目标真的被删、单元真的自撤销；
  #     · **强制断电后仍能续删**（kill -KILL QEMU 等价拔电源，再用同一覆盖层冷启动）
  #       —— 这条排除了「有序 shutdown 顺手把活干了」这个混淆项；
  #     · **多次重启只执行一次**（第二次开机后 resume-proof 逐字节未变）；
  #     · **多目标按列表处理**（3 个登记目标 + 1 个未登记对照必须存活）；
  #     · **登记值本身正确**（targets.txt 字节级、unit 的 ExecStart、脚本可执行位）；
  #     · **异常路径不中断列表**（列表中间插一个目录，rm -f 必失败，后续条目仍被删）。
  #   不能（Windows 专属，Linux 客机无从覆盖）：
  #     · HKCU\...\RunOnce 的登记与撤销 —— 由 wiring-probe 覆盖（重放命令串）；
  #     · WM_QUERYENDSESSION / WM_ENDSESSION 时序；
  #     · MOVEFILE_DELAY_UNTIL_REBOOT / PendingFileRenameOperations 重启后消失。
  #
  #   ⚠️ 缺口（如实记录，不许当成已覆盖）：
  #     PendingFileRenameOperations 在真实 Windows 重启后的清除行为，目前**无验证**。
  #
  #     为什么「在线下载镜像」也解决不了（已实测，不是推测）：
  #       · 镜像能拿到 —— 微软确实提供 Windows Server 2022 评估版真 VHD
  #         （LinkID=2195166，10208214528 B = 9.51 GiB，Range GET 返回 HTTP 206
  #          且前 8 字节 = conectix 魔数，已实测可读）。
  #         注意 LinkID=2195280 是 **ISO**（5044094976 B），不是 VHD，别混。
  #       · 但 PendingFileRenameOperations 与 RunOnce 都是 **Windows 运行时**写进注册表的。
  #         qemu-nbd 离线挂载只能看 NTFS 文件系统，看不到注册表项；
  #         要让 Windows 写它们，必须先在客机里执行代码 ⇒ 又回到注入通道问题。
  #       · Windows 评估版默认既不开 OpenSSH Server 也不开 WinRM。
  #         走 unattend 完整装机 20-40 min，叠加 9.51 GiB 下载（1-3 min）+ 转换（1-2 min）
  #         + 两轮重启 = 35-50 min，会撞 qemu-shutdown-destruct 的 45 min 上限。
  #     ⇒ 结论：要么人工准备「预装 SSH + purge-tests.exe」的 Windows qcow2 并配置
  #       repo variable CX_QEMU_GUEST_IMAGE，要么接受这条覆盖缺失。当前选后者。
  # ---------------------------------------------------------------------------

  qemu-destruct-linux-guest:
    name: 关机销毁与开机续删（托管 Ubuntu + QEMU + Linux 客机，真实重启）
    needs: gate
    # 2026-11-11: PR 上也要跑（用户要求「不要跳过任务」）。
    # 刻意不看 gate.outputs.skip：日判重只省巡检成本，不约束自毁验证。
    if: needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    # 硬上限：50 分钟。构成 = apt 装 qemu（~2 min）+ 下 260 MB 镜像（~30 s）
    # + 客机冷启动（≤7 min）× 3 轮（首次 / 断电后冷启动 / 第二次重启）
    # + 登记/断言（~5 min）+ 证据收集（~2 min），再留余量。
    #
    # 2026-11-11（t98）：30 → 50。原来只有一轮重启，现在是一轮断电 + 一轮重启，
    # 冷启动次数从 1 变 3（boot / powercut 后冷启动 / reboot2）。
    # 实测基线约 12-18 分钟，加两轮后估 18-26 分钟；刻意留到 50 而不卡 42，
    # 因为客机冷启动时间在共享 runner 上波动明显（实测 3-7 分钟）。
    # 若实测稳定超 35 分钟再回来调。
    timeout-minutes: 50
    # 独立 concurrency + 不取消：中途被新 push 取消会留下「已登记、未续删」的客机，
    # 与 vm-shutdown-destruct 的理由一致。宁可排队也不取消。
    concurrency:
      group: cx-qemu-linux-destruct-${{ github.ref }}
      cancel-in-progress: false
    env:
      CX_LINUX_GUEST_SSH_PORT: '2223'
      CX_LINUX_GUEST_BOOT_TIMEOUT_SEC: '420'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境基线
        run: |
          set -u
          uname -a
          . /etc/os-release && echo "PRETTY=$PRETTY_NAME"
          echo "NPROC=$(nproc)"
          free -h
          echo
          echo '=== CPU 虚拟化标志 ==='
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(vmx|svm|hypervisor)$' || echo '（未找到 vmx/svm/hypervisor）'
          echo
          echo '=== kvm 模块 ==='
          lsmod | grep -i '^kvm' || echo '（kvm 模块未加载）'
          echo
          echo '=== 磁盘余量 ==='
          df -h "$RUNNER_TEMP"

      # KVM 提权 + 断言。拿不到就**真的失败**（不是 skip）：
      # 这条作业存在的唯一目的就是「在 KVM 上跑客机」，没有 KVM 它证明不了任何事。
      # 与 qemu-shutdown-destruct 的 skip 策略不同是刻意的 —— 那条还有
      # 「宿主能力探测」的价值，这条没有。
      - name: KVM 提权并断言可读写
        id: kvm
        run: |
          set -eu
          accessible() { [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; }

          if [ ! -e /dev/kvm ]; then
            echo '::error title=无 /dev/kvm::托管 runner 未提供 KVM 设备，本作业无法验证'
            exit 1
          fi
          ls -l /dev/kvm
          stat -c 'STAT_MODE=%A STAT_OWNER=%U STAT_GROUP=%G' /dev/kvm
          echo "RUNNER_GROUPS=$(id -Gn | tr ' ' ',')"

          if accessible; then
            echo 'KVM_ALREADY_ACCESSIBLE=yes'
          else
            echo 'KVM_ALREADY_ACCESSIBLE=no'
            if sudo -n true 2>/dev/null; then
              echo 'SUDO_NOPASSWD=yes'
            else
              echo '::error title=sudo 不可用::无法提权 /dev/kvm'
              exit 1
            fi
            START_MS=$(date +%s%3N)
            sudo chmod 666 /dev/kvm
            END_MS=$(date +%s%3N)
            echo "KVM_CHMOD_ELAPSED_MS=$((END_MS - START_MS))"
            stat -c 'STAT_MODE_AFTER=%A' /dev/kvm
          fi

          if ! accessible; then
            echo '::error title=KVM 仍不可读写::提权后复核失败'
            exit 1
          fi
          echo 'KVM_ACCESSIBLE=yes'
          {
            echo '## 关机销毁与开机续删（QEMU + Linux 客机）'
            echo ''
            echo "- KVM 可读写：**是**（提权后复核）"
            echo "- 作业用户组：$(id -Gn | tr ' ' ',')"
          } >> "$GITHUB_STEP_SUMMARY"

      # QEMU 必须能装、且必须真的有 kvm 加速器。这条也是硬失败：
      # TCG 下冷启动会远超 30 分钟上限，静默降级等于交付一个假的通过。
      - name: 安装 QEMU 并确认 kvm 加速器
        run: |
          set -eu
          if ! command -v qemu-system-x86_64 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils
          fi
          qemu-system-x86_64 --version | head -2
          qemu-img --version | head -1
          echo '=== 加速器列表 ==='
          qemu-system-x86_64 -accel help || true
          if ! qemu-system-x86_64 -accel help 2>/dev/null | grep -qx 'kvm'; then
            echo '::error title=QEMU 无 kvm 加速器::只有 TCG 会让冷启动超出 30 分钟上限'
            exit 1
          fi
          echo 'QEMU_KVM_ACCEL=yes'
          {
            echo "- QEMU：$(qemu-system-x86_64 --version | head -1)"
            echo "- kvm 加速器：**有**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 客机脚本断言自测（不需要 QEMU，秒级）
        run: |
          # 先跑这一条：它用 ssh 垫片把 replay 阶段的四条断言逐条验证一遍
          # （全绿→0，每个断言各配一个应当判红的 fixture）。放在起客机之前，
          # 是为了让「脚本本身写错了」和「环境跑不起来」在日志里可区分 —— 否则
          # 客机启动失败时看不出到底是断言逻辑坏了还是 KVM/镜像的问题。
          bash scripts/ci/qemu-guest-destruct-linux.test.sh

      - name: 准备客机镜像与 cloud-init
        run: bash scripts/ci/qemu-guest-destruct-linux.sh --phase prepare

      - name: 启动客机并等待 SSH 回连
        run: bash scripts/ci/qemu-guest-destruct-linux.sh --phase boot

      - name: 阶段一：客机内登记待删目标与开机续删单元
        run: bash scripts/ci/qemu-guest-destruct-linux.sh --phase register

      - name: 阶段二之一：强制断电（等价拔电源）
        run: bash scripts/ci/qemu-guest-destruct-linux.sh --phase powercut

      - name: 阶段二之二：断言断电后仍续删（缺口 1）+ 多目标/登记值/异常路径（缺口 3/4/5）
        run: bash scripts/ci/qemu-guest-destruct-linux.sh --phase replay

      - name: 阶段三之一：第二次重启（幂等验证）
        run: bash scripts/ci/qemu-guest-destruct-linux.sh --phase reboot2

      - name: 阶段三之二：断言续删未重跑（缺口 2，proof 逐字节未变）
        run: bash scripts/ci/qemu-guest-destruct-linux.sh --phase replay2

      - name: 上传客机证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cx-qemu-linux-guest-evidence
          compression-level: 0
          path: |
            ${{ runner.temp }}/cx-linux-guest/user-data
            ${{ runner.temp }}/cx-linux-guest/meta-data
            ${{ runner.temp }}/cx-linux-guest/resume.sh
            ${{ runner.temp }}/cx-linux-guest/unit.service
            ${{ runner.temp }}/cx-linux-guest/boot-before-powercut.txt
            ${{ runner.temp }}/cx-linux-guest/proof-after-first.txt
            ${{ runner.temp }}/cx-linux-guest/boot-before-reboot2.txt
            # 2026-11-11：replay2 判红时 GitHub 会回收 job 日志（gh run view 只剩 82 字节），
            # 这份文件是唯一能看出「哪条断言红、各变量是什么」的证据。
            ${{ runner.temp }}/cx-linux-guest/replay2-diagnosis.txt
          if-no-files-found: warn
          retention-days: 14

      - name: 关停客机并清理临时密钥
        if: always()
        run: bash scripts/ci/qemu-guest-destruct-linux.sh --phase teardown

  # ═══════════════════════════════════════════════════════════════════════
  # 2026-11-12 合并：本作业原为独立的 build-guest-image.yml。
  # 合并理由：用户要求「优先读 cache，读不到就在线构建」，而这两件事
  #   必须与 qemu-shutdown-destruct 在同一 workflow 内才能共享 cache 键。
  #   原独立 workflow 无法被 ci.yml 的作业 wait 到。
  #
  # 产物：Actions Cache key = env.GUEST_IMAGE_CACHE_KEY（约 4.5 GB）
  #   下游 qemu-shutdown-destruct 用 actions/cache/restore 取用。
  # ═══════════════════════════════════════════════════════════════════════
  build-guest-image:
    name: 构建 Windows 客机镜像（cache 优先）
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # cache 未命中时才需要 30-40 分钟构建；命中时只需几分钟验证。
    concurrency:
      group: cx-guest-image-${{ github.ref }}
      cancel-in-progress: false
    needs: gate
    if: needs.gate.result == 'success'
    env:
      CACHE_KEY: cx-win2022-guest-qcow2-v3
      GUEST_USER: runner
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ══════════════════════════════════════════════════════════════════
      # 用户 2026-11-12 要求：**优先读 cache，读不到才在线构建**。
      #   Actions Cache 有 7 天未访问即清理的限制，所以不能假设它一定在。
      #   这里做「尽力恢复」：命中就跳过后续全部构建步骤（省 30-40 分钟），
      #   未命中就照常走完整构建流程，构建成功后回写 cache。
      # ══════════════════════════════════════════════════════════════════
      - name: 尝试从 cache 恢复客机镜像
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/guest-cache
          key: ${{ env.CACHE_KEY }}
          # 不用 restore-keys：镜像必须精确命中，拿错版本比没有更糟
          fail-on-cache-miss: false

      - name: 判定 cache 是否可用
        id: havecache
        run: |
          set -u
          CACHE_DIR="$GITHUB_WORKSPACE/guest-cache"
          IMG="$CACHE_DIR/guest.qcow2"
          OK=no
          if [ -f "$IMG" ]; then
            SIZE=$(stat -c %s "$IMG")
            echo "cache 里找到 guest.qcow2 = $SIZE 字节"
            # 体积断言：真实镜像 ~4.5 GB；过小说明是损坏/占位
            if [ "$SIZE" -gt 1000000000 ]; then
              # sha256 校验（cache 里同时存了 .sha256）
              if [ -f "$IMG.sha256" ]; then
                EXPECT=$(awk '{print $1}' "$IMG.sha256")
                ACTUAL=$(sha256sum "$IMG" | awk '{print $1}')
                echo "sha256 期望=$EXPECT"
                echo "sha256 实际=$ACTUAL"
                if [ "$EXPECT" = "$ACTUAL" ]; then OK=yes; else echo "sha256 不匹配，丢弃"; fi
              else
                echo "无 .sha256，跳过校验（仅体积通过）"
                OK=yes
              fi
            else
              echo "体积过小（<1GB），判定为损坏"
            fi
          else
            echo "cache 未命中（guest.qcow2 不存在）"
          fi
          echo "CACHE_HIT=$OK"
          echo "CACHE_HIT=$OK" >> "$GITHUB_OUTPUT"
          if [ "$OK" = yes ]; then
            echo "::notice title=cache 命中::跳过镜像构建，直接用 cache 里的镜像"
          else
            echo "::notice title=cache 未命中::将在线构建镜像（约 30-40 分钟）"
          fi

      # ── 以下全部步骤只在 cache 未命中时执行 ────────────────────────────

      - name: 环境基线
        if: steps.havecache.outputs.CACHE_HIT != 'yes'
        run: |
          set -u
          uname -a
          echo "NPROC=$(nproc)"
          free -h
          df -h /
          echo
          echo '=== KVM 设备 ==='
          ls -l /dev/kvm || echo '（无 /dev/kvm）'
          echo
          echo '=== /dev/net/tun（dockur 用于 macvlan，bridge 模式下非必需）==='
          ls -l /dev/net/tun || echo '（无 /dev/net/tun）'
          echo
          echo '=== docker ==='
          docker --version || echo '（无 docker）'
          docker info --format '{{.ServerVersion}} {{.Driver}}' 2>/dev/null || true
          echo "RUNNER_GROUPS=$(id -Gn | tr ' ' ',')"

      - name: KVM 提权并断言
        if: steps.havecache.outputs.CACHE_HIT != 'yes'
        id: kvm
        run: |
          set -eu
          accessible() { [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; }
          if [ ! -e /dev/kvm ]; then
            echo '::error title=无 /dev/kvm::托管 runner 未提供 KVM，Windows 安装会超时'
            exit 1
          fi
          if ! accessible; then
            sudo chmod 666 /dev/kvm
            sleep 1
          fi
          accessible || { echo '::error title=KVM 不可读写::提权失败'; exit 1; }
          echo 'KVM_ACCESSIBLE=yes'

      - name: 修复 DNS（runner 解析不了 ubuntu.com 系列）
        if: steps.havecache.outputs.CACHE_HIT != 'yes'
        # ⚠️ 2026-11-11 实测：托管 runner 的默认 DNS 解析不了
        #    azure.archive.ubuntu.com / archive.ubuntu.com / ports.ubuntu.com，
        #    而 github.com 返回 200 —— 是 DNS 局部故障，不是网络全断。
        #    直接改用公共 DNS（8.8.8.8 / 1.1.1.1），让 apt 恢复正常。
        #    sudo 已确认可用（KVM 提权那步就是 sudo）。
        timeout-minutes: 3
        run: |
          set -u
          echo "=== 当前 DNS 配置 ==="
          cat /etc/resolv.conf 2>/dev/null || true
          echo
          echo "=== 改前解析测试 ==="
          getent hosts archive.ubuntu.com || echo "  archive.ubuntu.com 解析失败"
          getent hosts github.com >/dev/null && echo "  github.com 可解析"
          echo
          # Ubuntu 24.04 用 systemd-resolved；直接改 /etc/resolv.conf 可能被覆盖，
          # 所以两条都做：先改 resolved 的配置，再直接覆盖 resolv.conf。
          echo "=== 设置公共 DNS ==="
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNS=8.8.8.8 1.1.1.1 8.8.4.4\nFallbackDNS=1.0.0.1\n' | \
            sudo tee /etc/systemd/resolved.conf.d/cx-dns.conf >/dev/null
          # 直接覆盖（resolved 不生效时的兜底；CI runner 可以这么做）
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\nnameserver 8.8.4.4\n' | \
            sudo tee /etc/resolv.conf >/dev/null
          sudo systemctl restart systemd-resolved 2>/dev/null || true
          sleep 2
          echo
          echo "=== 改后 DNS 配置 ==="
          cat /etc/resolv.conf 2>/dev/null || true
          echo
          echo "=== 改后解析测试 ==="
          OK=no
          for h in archive.ubuntu.com azure.archive.ubuntu.com security.ubuntu.com; do
            if getent hosts "$h" >/dev/null 2>&1; then
              echo "  $h 解析成功 -> $(getent hosts $h | head -1 | awk '{print $1}')"
              OK=yes
            else
              echo "  $h 仍解析失败"
            fi
          done
          echo "DNS_FIXED=$OK"
          echo "DNS_FIXED=$OK" >> "$GITHUB_ENV"
          # 不在这里 exit 1 —— 后面「安装依赖」有 docker 降级路径，
          # DNS 修不好也不会硬卡住。但要留下明确记录。
          if [ "$OK" != yes ]; then
            echo "::warning title=公共 DNS 也没修好::后续依赖 docker 降级路径"
          fi


          # ── apt 镜像源重写（用户 2026-11-12 要求）──────────────────────
          # runner 默认走 `azure.archive.ubuntu.com`，而该域名在本环境解析失败
          # （实测 `Temporary failure resolving`）。即便 DNS 已改成 8.8.8.8，
          # 也可能遇到该镜像站本身不可达。所以直接重写 sources 到公共镜像。
          # 保留原文件备份，便于出问题时对照。
          echo
          echo "=== 重写 apt 镜像源 ==="
          CODENAME=$(lsb_release -cs 2>/dev/null || echo noble)
          echo "  发行代号 = $CODENAME"
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ] && [ ! -f /etc/apt/sources.list.d/ubuntu.sources.orig ]; then
            sudo cp /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.orig || true
          fi
          if [ -f /etc/apt/sources.list ] && [ ! -f /etc/apt/sources.list.orig ]; then
            sudo cp /etc/apt/sources.list /etc/apt/sources.list.orig || true
          fi
          # Ubuntu 24.04 用 deb822 格式（ubuntu.sources），22.04 用 sources.list，两套都写
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<MIRROREOF
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: $CODENAME $CODENAME-updates $CODENAME-backports $CODENAME-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          MIRROREOF
          # 传统格式也写一份（某些工具会读）
          printf 'deb http://archive.ubuntu.com/ubuntu/ %s main restricted universe multiverse\n' "$CODENAME" | sudo tee /etc/apt/sources.list >/dev/null
          printf 'deb http://archive.ubuntu.com/ubuntu/ %s-updates main restricted universe multiverse\n' "$CODENAME" | sudo tee -a /etc/apt/sources.list >/dev/null
          printf 'deb http://archive.ubuntu.com/ubuntu/ %s-security main restricted universe multiverse\n' "$CODENAME" | sudo tee -a /etc/apt/sources.list >/dev/null
          echo "  已重写到 archive.ubuntu.com"
          # 移除可能失效的第三方源（它们会拖慢 update）
          sudo find /etc/apt/sources.list.d -name "*.list" -o -name "*.sources" 2>/dev/null | \
            grep -v "ubuntu.sources" | grep -v ".orig" | while read -r f; do
              echo "  禁用第三方源: $f"
              sudo mv "$f" "$f.disabled" 2>/dev/null || true
            done
          echo
          echo "=== 重写后的源 ==="
          grep -h "^deb\|^URIs" /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null | head -8 || true
          echo
          # 验证新源可达
          echo "=== 新源可达性 ==="
          if getent hosts archive.ubuntu.com >/dev/null 2>&1; then
            echo "  archive.ubuntu.com 可解析"
            curl -sS --max-time 15 -o /dev/null -w "  HTTP %{http_code}\n" \
              "http://archive.ubuntu.com/ubuntu/dists/$CODENAME/Release" || echo "  HTTP 请求失败"
          else
            echo "  archive.ubuntu.com 解析失败"
          fi
      - name: 安装依赖
        if: steps.havecache.outputs.CACHE_HIT != 'yes'
        # ⚠️ 2026-11-12 修三个真 bug（上一轮全踩了）：
        #   ① `--error-on-any-failure` **不能与其他选项组合** ——
        #      实测报 `E: Command line option --error-on-any-failure is not
        #      understood in combination with the other options`，
        #      加了它整条 apt 命令直接失效（连 update 都没跑）。
        #   ② 管道吞退出码 —— `sudo apt-get update ... | tail -10` 的 `$?`
        #      是 **tail 的**（恒 0），所以 `APT_OK=yes` 是假的。
        #   ③ docker 提取的 qemu 跑不了 —— 缺 `liburing.so.2` / `libcapstone.so.5`，
        #      `docker cp` 只拿二进制不拿依赖库。
        # ⇒ 现在：apt 是唯一主路径；判据用「索引文件是否真的刷新」+
        #    「二进制真的能跑」，不看 apt 的退出码。
        timeout-minutes: 12
        run: |
          set -u
          echo "=== DNS 状态 ==="
          cat /etc/resolv.conf 2>/dev/null | head -5 || true
          getent hosts archive.ubuntu.com >/dev/null 2>&1 \
            && echo "  archive.ubuntu.com 可解析" \
            || echo "  archive.ubuntu.com 解析失败"
          echo
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          apt_ok=no
          for attempt in 1 2 3; do
            echo "=== 第 $attempt 轮 ==="
            # ① 先记下当前索引文件数，update 后要求**变多或变新**，
            #    这是「真的拿到了索引」的唯一可靠判据。
            LISTS_BEFORE=$(find /var/lib/apt/lists -name "*_Packages*" 2>/dev/null | wc -l)
            echo "  update 前索引文件数 = $LISTS_BEFORE"

            # ② 不用管道！输出落盘，退出码才准。
            sudo apt-get update -qq $APT_OPTS > /tmp/aptup.log 2>&1
            UP_RC=$?
            tail -8 /tmp/aptup.log || true
            echo "  apt-get update rc=$UP_RC"

            LISTS_AFTER=$(find /var/lib/apt/lists -name "*_Packages*" 2>/dev/null | wc -l)
            echo "  update 后索引文件数 = $LISTS_AFTER"

            # ③ 判据：索引文件数必须 >0 且不比之前少（少说明整体失败）
            if [ "$LISTS_AFTER" -gt 0 ] && [ "$LISTS_AFTER" -ge "$LISTS_BEFORE" ]; then
              echo "  索引可用，尝试 install"
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $APT_OPTS \
                qemu-utils qemu-system-x86 > /tmp/aptinst.log 2>&1
              INST_RC=$?
              tail -8 /tmp/aptinst.log || true
              echo "  apt-get install rc=$INST_RC"
              if [ "$INST_RC" -eq 0 ]; then
                apt_ok=yes; break
              fi
            else
              echo "  索引没拿到（update 实际失败）"
            fi
            echo "  第 $attempt 轮未成功，10 秒后重试"
            sleep 10
          done
          echo "APT_OK=$apt_ok"
          echo
          # ── 唯一判据：二进制真的能跑 ─────────────────────────────────────
          QEMU_IMG_OK=no
          QEMU_SYS_OK=no
          if command -v qemu-img >/dev/null 2>&1 && qemu-img --version >/dev/null 2>&1; then
            QEMU_IMG_OK=yes
            echo "qemu-img = $(command -v qemu-img)"
            qemu-img --version | head -1
          fi
          if command -v qemu-system-x86_64 >/dev/null 2>&1 && qemu-system-x86_64 --version >/dev/null 2>&1; then
            QEMU_SYS_OK=yes
            echo "qemu-system-x86_64 = $(command -v qemu-system-x86_64)"
            qemu-system-x86_64 --version | head -1
          fi
          echo "QEMU_IMG_OK=$QEMU_IMG_OK QEMU_SYS_OK=$QEMU_SYS_OK"
          echo
          # apt 装成功但二进制跑不了 → 必须红（不能带着坏工具往下走）
          if [ "$QEMU_IMG_OK" != yes ]; then
            echo "::error title=qemu-img 不可用::apt 未装成功或二进制跑不起来"
            echo "--- 诊断 ---"
            command -v qemu-img || echo "(不在 PATH)"
            ls -la /usr/bin/qemu-img 2>/dev/null || true
            qemu-img --version 2>&1 | head -3 || true
            cat /etc/resolv.conf 2>/dev/null || true
            getent hosts archive.ubuntu.com || echo "(archive.ubuntu.com 解析失败)"
            exit 1
          fi
          if [ "$QEMU_SYS_OK" != yes ]; then
            echo "::error title=qemu-system-x86_64 不可用::「验证 SSH」那步需要它"
            ls -la /usr/bin/qemu-system-x86_64 2>/dev/null || true
            exit 1
          fi
          echo
          df -h /
      - name: 生成 SSH 密钥（每次随机，不落盘、不入库）
        # ⚠️ 2026-11-12（run 43187143353 实测）：此处**不能**加 `if: CACHE_HIT != 'yes'`。
        #   cache 命中时若跳过本步骤，$WORK/id 就不存在，而「验证 SSH 可连」硬编码用
        #   `ssh -i $WORK/id` ⇒ ssh 找不到该 key ⇒ 回落到 ~/.ssh/id_rsa 等默认路径
        #   ⇒ 日志里全是 "Trying private key: /home/runner/.ssh/id_rsa" +
        #   "Permission denied (publickey)"，看起来像客机 sshd 问题，实际是本地缺 key。
        #   密钥生成与镜像构建无关，任何路径都必须执行。
        id: keys
        # 用户 2026-11-12 要求：**每次都随机生成**，不再用 workflow_dispatch 输入、
        # 也不依赖 repo secret。理由：
        #   ① 镜像里的公钥必须与验证用的私钥配对，随机生成天然配对；
        #   ② 私钥只存在于本次 job 的 RUNNER_TEMP，job 结束即消失；
        #   ③ 不需要人工维护 CX_QEMU_GUEST_SSH_KEY 这个 secret。
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          mkdir -p "$WORK/oem" "$WORK/storage" "$WORK/data"
          # ed25519：比 RSA 短、生成快、OpenSSH 全版本支持
          ssh-keygen -t ed25519 -N "" -C "cx-ci-$(date +%s)" -f "$WORK/id" >/dev/null
          chmod 600 "$WORK/id"
          echo "私钥: $(stat -c %s "$WORK/id") 字节"
          echo "公钥: $(cat "$WORK/id.pub")" | head -c 120; echo
          # 断言密钥可用（防止 ssh-keygen 静默失败）
          if ! ssh-keygen -l -f "$WORK/id.pub" >/dev/null 2>&1; then
            echo "::error title=SSH 密钥生成失败::ssh-keygen 产物不可用"
            exit 1
          fi
          echo "KEY_FINGERPRINT=$(ssh-keygen -l -f "$WORK/id.pub" | awk '{print $2}')"

          # ⚠️ 2026-11-12（run 43190313294 实测）：cache 命中时**必须换成缓存里的密钥对**。
          #
          #   矛盾：镜像在构建时就把当时的公钥写进了
          #   C:\ProgramData\ssh\administrators_authorized_keys（OEM setup.ps1）。
          #   cache 命中不重建镜像 ⇒ 客机里永远是**构建那次**的公钥。
          #   而上面刚 ssh-keygen 出的是**新**密钥对 ⇒ 公私钥不配对
          #   ⇒ sshd 回 packet type 51（拒绝）⇒ Permission denied (publickey)。
          #
          #   实测证据（ssh-vvv-1.txt）：
          #     Offering public key: /home/runner/work/_temp/guest/id ED25519 SHA256:XjsCPahr…
          #     we sent a publickey packet, wait for reply
          #     receive packet: type 51          ← 服务端明确拒绝这个 key
          #
          #   修法：cache 里存了构建时的密钥对（见「存入 Actions Cache」），
          #   这里用它们覆盖刚生成的那对。cache 未命中时保留新生成的。
          if [ -f "$GITHUB_WORKSPACE/guest-cache/guest-key" ]; then
            cp "$GITHUB_WORKSPACE/guest-cache/guest-key"     "$WORK/id"
            cp "$GITHUB_WORKSPACE/guest-cache/guest-key.pub" "$WORK/id.pub"
            chmod 600 "$WORK/id"
            echo "SSH_KEY_SOURCE=cache"
            echo "  已换成 cache 里的密钥对"
            echo "  指纹: $(ssh-keygen -l -f "$WORK/id.pub" | awk '{print $2}')"
            if ! ssh-keygen -l -f "$WORK/id.pub" >/dev/null 2>&1; then
              echo "::error title=cache 里的密钥不可用::guest-key.pub 无法解析"
              exit 1
            fi
          else
            echo "SSH_KEY_SOURCE=fresh"
          fi
      - name: 下载 purge-tests.exe（来自 windows-build artifact）
        if: steps.havecache.outputs.CACHE_HIT != 'yes'
        id: getexe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          mkdir -p "$WORK/oem"

          # 优先用本仓库最近一次成功 ci.yml run 的 artifact（同一次 push 不一定跑了 windows-build，
          # 因为这个 workflow 是独立的 workflow_dispatch）。
          SHA="$GITHUB_SHA"
          ART="windows-ci-build-$SHA"

          echo "尝试下载 artifact: $ART"
          set +e
          # ⚠️ 不能把 gh 的输出用管道接 sed：那样 RC=$? 取到的是 **sed 的退出码**（恒 0），
          #    gh 失败会被静默吞掉，后面 find 找不到文件才报错 —— 诊断信息会错位。
          #    改为先落盘再打印，保住 gh 的退出码。
          gh run download --repo "$GITHUB_REPOSITORY" -n "$ART" -D "$WORK/art" > "$WORK/art.log" 2>&1
          RC=$?
          echo "--- gh run download 输出（前 20 行）---"
          head -20 "$WORK/art.log" 2>/dev/null || true
          set -e

          if [ $RC -ne 0 ]; then
            echo "同 sha 没有 artifact，回退到最近一次成功的 ci.yml run"
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
                       --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "${RUN_ID:-}" ]; then
              echo '::error title=找不到 windows-build 产物::需要先有一次成功的 ci.yml run（它会产生 purge-tests.exe）'
              exit 1
            fi
            echo "使用 run $RUN_ID"
            ART=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
                    --jq '.artifacts[] | select(.name | startswith("windows-ci-build-")) | .name' | head -n1)
            if [ -z "${ART:-}" ]; then
              echo '::error title=该 run 没有 windows-ci-build artifact'
              exit 1
            fi
            echo "下载 artifact: $ART"
            gh run download --repo "$GITHUB_REPOSITORY" -n "$ART" -D "$WORK/art"
          fi

          # artifact 解包后路径为 <art>/windows/native-build/bin/purge-tests.exe
          EXE=$(find "$WORK/art" -type f -name 'purge-tests.exe' | head -n1)
          if [ -z "${EXE:-}" ]; then
            echo '::error title=artifact 里没有 purge-tests.exe::列出内容'
            find "$WORK/art" -type f | head -50
            exit 1
          fi
          SIZE=$(stat -c %s "$EXE")
          echo "purge-tests.exe = $SIZE 字节（来自 $EXE）"
          if [ "$SIZE" -lt 1000 ]; then
            echo '::error title=purge-tests.exe 体积异常::小于 1000 字节，可能是占位文件'
            exit 1
          fi
          cp "$EXE" "$WORK/oem/purge-tests.exe"
          echo "已拷贝到 $WORK/oem/purge-tests.exe"
          echo "exe_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "exe_source=$ART" >> "$GITHUB_OUTPUT"

      # ── OEM：dockur 会把 /oem 下所有文件放进 ISO 的 $OEM$，并把 install.bat
      #    在**安装最后一步**自动执行；同目录其余文件被拷到 C:\OEM。
      #    这是本方案「配置镜像」的唯一注入点，不需要自己找时机。
      - name: 生成 OEM install.bat
        if: steps.havecache.outputs.CACHE_HIT != 'yes'
        env:
          GUEST_PASSWORD: ${{ github.event.inputs.guest_password || 'Cx-Guest-2026!' }}
          GUEST_USER: ${{ env.GUEST_USER }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          PUBKEY=$(cat "$WORK/id.pub")

          # ── OpenSSH 离线包（关键，2026-11-11）────────────────────────────
          # 为什么不靠 Windows Update：系统自带的「按需功能安装」对 OpenSSH.Server
          # 是从 WU 拉包，dockur 容器内 Windows 走 NAT，能否出网无保证。
          # 装不上的后果是 sshd 根本不存在，而宿主侧只看到「banner exchange 超时」
          # —— QEMU slirp 会先 accept 再转发，没有 sshd 时同样表现为超时。
          # 这里把微软官方 Win32-OpenSSH zip（约 4.9 MB）下到 OEM，随 $OEM$ 进镜像。
          OSSH_URL="https://github.com/PowerShell/Win32-OpenSSH/releases/download/v9.8.3.0p2-Preview/OpenSSH-Win64.zip"
          if ! curl -fL --retry 3 --retry-delay 2 --max-time 180 \
               -o "$WORK/oem/OpenSSH-Win64.zip" "$OSSH_URL"; then
            echo "::error title=下载 OpenSSH 离线包失败::$OSSH_URL"
            exit 1
          fi
          OSSH_SIZE=$(stat -c %s "$WORK/oem/OpenSSH-Win64.zip")
          echo "OpenSSH-Win64.zip = $OSSH_SIZE 字节"
          if [ "$OSSH_SIZE" -lt 1000000 ]; then
            echo "::error title=OpenSSH 包体积异常::只有 $OSSH_SIZE 字节（预期约 4.9 MB）"
            exit 1
          fi
          # zip 魔数必须是 PK\x03\x04，防止拿到 HTML 错误页
          OSSH_MAGIC=$(head -c 4 "$WORK/oem/OpenSSH-Win64.zip" | od -An -tx1 | tr -d ' \n')
          echo "zip magic = $OSSH_MAGIC"
          case "$OSSH_MAGIC" in
            504b0304*) echo 'zip 魔数正确' ;;
            *) echo "::error title=OpenSSH 包不是 zip::magic=$OSSH_MAGIC"; exit 1 ;;
          esac

          # 密码里若有 % 会让 bat 的 %VAR% 展开出问题；这里限制字符集并校验。
          case "$GUEST_PASSWORD" in
            *%*|*\'*|*\"*) echo '::error title=密码含特殊字符::bat 里会导致展开异常，请改用字母数字与 -_.!'; exit 1 ;;
          esac

          # 注意：bat 里 % 是变量前缀，PowerShell 的 $ 在 bat 中无特殊含义，可直接用。
          # 所有 PowerShell 都用 -EncodedCommand 会更好，但可读性差、排障困难；
          # 这里用 -Command 并把脚本写成单独 .ps1 文件由 bat 调用，兼顾可读与安全。
          cat > "$WORK/oem/setup.ps1" <<PSSETUP
          \$ErrorActionPreference = 'Continue'
          \$log = 'C:\OEM\setup.log'
          function Say(\$m) { "\$([datetime]::UtcNow.ToString('o')) \$m" | Tee-Object -FilePath \$log -Append }

          # ── 2026-11-11（t111）：把每一步的结果**实时**回传到宿主侧 ──
          #
          # 为什么必须有：上一轮 SSH 连不上，而宿主机唯一能看到的证据（setup.log）
          # 要等 install.bat 跑完才回传；一旦中途出问题或回传失败，宿主机就完全瞎了。
          # 这个函数在**每一步执行完立刻**追加一行到 \\host.lan\Data\setup-steps.txt，
          # 于是即使 SSH 完全不通、即使 install.bat 后面崩了，
          # 宿主侧 /data 里也已经留下了「做到了哪一步、每步结果是什么」。
          #
          # 用 AppendAllText 而不是 Set-Content：每次只追加一行，不重写整个文件，
          # 这样即使中途断电也不会把已写的内容丢光。
          \$stepsFile = '\\\\host.lan\\Data\\setup-steps.txt'
          \$stepsLocal = 'C:\OEM\setup-steps.txt'
          function StepReport(\$name, \$value) {
            \$line = "{0} {1} = {2}" -f [datetime]::UtcNow.ToString('HH:mm:ss'), \$name, \$value
            # 本地一份（客机内可查）
            try { Add-Content -LiteralPath \$stepsLocal -Value \$line -Encoding ascii -ErrorAction SilentlyContinue } catch { }
            # 共享一份（宿主 /data 可查）—— 这是关键通道
            try { Add-Content -LiteralPath \$stepsFile -Value \$line -Encoding ascii -ErrorAction SilentlyContinue } catch { }
            Say "STEP \$line"
          }
          # 立刻写一行「活着」，这样哪怕后面立刻崩了，宿主侧也能知道 setup.ps1 起过
          StepReport 'SetupStart' 'begin'

          try {
            Say 'setup start'

            # 1) 装 OpenSSH Server。Server 2022 评估版默认没有它。
            #
            # ⚠️ 2026-11-11（t111）：这一段原先用「系统按需功能安装 ... | Out-Null」，
            #    把**成败静默掉了**。而它在无人值守环境里最常见的失败原因是拿不到
            #    Windows Update 源（dockur 的 NAT 能否出网未验证）。
            #    失败后 Set-Service/Start-Service 会连环报错，但 \$ErrorActionPreference='Continue'
            #    让它继续往下走，最后只留一行模糊的 status。
            #    ⇒ 改成：抓返回码、显式记录 State、失败立刻回传 StepReport。
            # ⭐ 2026-11-11 关键：**优先用离线 zip**，完全不依赖 Windows Update。
            #    系统自带的功能安装对 OpenSSH.Server 这种「按需功能」是从 WU 拉包，
            #    dockur 容器内 Windows 走 NAT，能否走到 WU 不保证。装不上的后果是
            #    sshd 根本不存在，而宿主侧只看到「banner exchange 超时」——
            #    因为 QEMU slirp 会先 accept 再转发，没有 sshd 时同样表现为超时而非 refused。
            #    zip 是微软官方 PowerShell/Win32-OpenSSH 发行包，随 OEM 进镜像，
            #    解压 + install-sshd.ps1 即可，确定性最高。
            \$osshZip = 'C:\OEM\OpenSSH-Win64.zip'
            \$osshDir = 'C:\Program Files\OpenSSH-Win64'
            \$osshMode = 'capability'
            if (Test-Path \$osshZip) {
              Say 'OpenSSH install mode=offline-zip'
              try {
                if (-not (Test-Path \$osshDir)) {
                  Expand-Archive -LiteralPath \$osshZip -DestinationPath 'C:\Program Files' -Force -ErrorAction Stop
                }
                \$sshdExe = Join-Path \$osshDir 'sshd.exe'
                Say "offline: sshd.exe exists=\$(Test-Path \$sshdExe)"
                # host key 首次必须生成，否则 sshd 起不来
                & (Join-Path \$osshDir 'ssh-keygen.exe') -A 2>&1 | ForEach-Object { Say "keygen: \$_" }
                # 注册服务 + 自启 + 防火墙规则
                & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path \$osshDir 'install-sshd.ps1') 2>&1 | ForEach-Object { Say "install-sshd: \$_" }
                # sshd 需要能找到自身 dll
                \$env:Path = "\$osshDir;\$env:Path"
                [Environment]::SetEnvironmentVariable('Path', "\$osshDir;" + [Environment]::GetEnvironmentVariable('Path','Machine'), 'Machine')
                \$osshMode = 'offline-zip-ok'
              } catch {
                Say "ERROR offline zip install failed: \$_"
                \$osshMode = 'offline-zip-failed'
              }
              StepReport 'OpenSSHInstallMode' \$osshMode
            } else {
              Say 'WARN OpenSSH zip 不在 OEM，回退到 Windows Update（可能失败）'
              StepReport 'OpenSSHInstallMode' 'fallback-capability-no-zip'
            }

            # 下面这段是 WU 路径：只有在没有 zip 时才真正执行。
            # 有 zip 成功时 \$osshMode=offline-zip-ok，跳过 WU 避免无谓联网等待。
            if (\$osshMode -notlike 'offline-zip-ok') {
            # 1) 装 OpenSSH Server（回退路径）
            \$capErr = ''
            \$capAdded = 'not-attempted'
            try {
              \$cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1
              if (-not \$cap) {
                \$capErr = 'capability-not-offered'
                Say "ERROR OpenSSH.Server capability 不存在（此 SKU 未提供？）"
              } elseif (\$cap.State -eq 'Installed') {
                \$capAdded = 'already-installed'
                Say 'OpenSSH.Server already installed'
              } else {
                Say "installing OpenSSH.Server (was \$(\$cap.State))"
                # 不加 Out-Null：要能拿到异常与返回码
                \$r = Add-WindowsCapability -Online -Name \$cap.Name -ErrorAction Stop
                \$capAdded = "ok(rc=\$(\$r.RestartNeeded))"
                Say "Add-WindowsCapability 完成 RestartNeeded=\$(\$r.RestartNeeded)"
              }
            } catch {
              \$capAdded = 'failed'
              \$capErr = \$_.Exception.Message
              Say "ERROR Add-WindowsCapability 失败: \$capErr"
              Say '  → 常见原因：dockur NAT 出不了网，拉不到 Windows Update 源'
            }
            StepReport 'AddWindowsCapability' \$capAdded
            if (\$capErr) { StepReport 'AddWindowsCapabilityError' \$capErr }

            # 装完必须复核一次 State —— 返回码 ok 不等于真的变成 Installed
            try {
              \$capAfter = (Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1).State
            } catch { \$capAfter = 'query-failed' }
            Say "OpenSSH.Server state-after=\$capAfter"
            StepReport 'OpenSSHServerStateAfter' "\$capAfter"

            }  # end of WU fallback branch (offline-zip 成功时跳过)
            # sshd 服务是否存在（装不上时这里就是 False，一目了然）
            \$svcExists = \$null -ne (Get-Service -Name sshd -ErrorAction SilentlyContinue)
            Say "sshd service exists=\$svcExists"
            StepReport 'SshdServiceExists' "\$svcExists"

            if (\$svcExists) {
              try {
                Set-Service -Name sshd -StartupType Automatic
                StepReport 'SetServiceStartup' 'ok'
              } catch {
                StepReport 'SetServiceStartup' "failed: \$(\$_.Exception.Message)"
              }
              try {
                Start-Service sshd
                StepReport 'StartService' 'ok'
              } catch {
                StepReport 'StartService' "failed: \$(\$_.Exception.Message)"
              }
              \$sshdStatus = (Get-Service sshd).Status
              \$sshdStartType = (Get-Service sshd).StartType
              Say "sshd status=\$sshdStatus startup=\$sshdStartType"
              StepReport 'SshdStatus' "\$sshdStatus"
              StepReport 'SshdStartType' "\$sshdStartType"
            } else {
              Say 'ERROR sshd 服务不存在 —— OpenSSH Server 没装上，SSH 必然连不通'
              StepReport 'SshdStatus' 'service-missing'
            }

            # sshd 进程在不在（比服务状态更硬：服务 Running 也可能进程早退了）
            \$sshProc = @(Get-Process -Name sshd -ErrorAction SilentlyContinue).Count
            Say "sshd processes=\$sshProc"
            StepReport 'SshdProcessCount' "\$sshProc"

            # 22 端口监听状态。这是「宿主侧连不通」时最直接的证据：
            # 没有 LISTENING 就说明 sshd 没在听，而不是防火墙或密钥问题。
            try {
              \$listen = @(Get-NetTCPConnection -LocalPort 22 -State Listen -ErrorAction SilentlyContinue).Count
            } catch { \$listen = 'query-failed' }
            Say "port22 listening-entries=\$listen"
            StepReport 'Port22Listen' "\$listen"

            # 2) 防火墙放行 22。漏这条的现象是「端口拒绝」，极易误判成 sshd 没起。
            if (-not (Get-NetFirewallRule -Name 'CX-SSHD-22' -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule -Name 'CX-SSHD-22' -DisplayName 'CX SSHD 22' \`
                -Protocol TCP -LocalPort 22 -Action Allow -Direction Inbound | Out-Null
              Say 'firewall rule added'
            } else { Say 'firewall rule exists' }

            # 3) 公钥 + **ACL**。
            #    Windows sshd 对 administrators_authorized_keys 的权限极挑剔：
            #    Users / Authenticated Users 只要有读权限，sshd 就直接拒绝认证，
            #    日志里只写 Permission denied，完全看不出是 ACL 问题。
            #    正确做法：关继承，只留 Administrators + SYSTEM。
            \$sshDir = 'C:\ProgramData\ssh'
            New-Item -ItemType Directory -Force -Path \$sshDir | Out-Null
            \$ak = Join-Path \$sshDir 'administrators_authorized_keys'
            Set-Content -LiteralPath \$ak -Value (Get-Content 'C:\OEM\id.pub' -Raw).Trim() -Encoding ascii
            icacls \$ak /inheritance:r | Out-Null
            icacls \$ak /grant 'Administrators:F' | Out-Null
            icacls \$ak /grant 'SYSTEM:F' | Out-Null
            Say "acl=\$((icacls \$ak) -join ' | ')"

            # 4) 钉住 PubkeyAuthentication，然后重启 sshd 让配置生效。
            \$cfg = Join-Path \$sshDir 'sshd_config'
            if (Test-Path \$cfg) {
              \$c = Get-Content \$cfg -Raw
              if (\$c -notmatch '(?m)^\s*PubkeyAuthentication\s+yes') {
                Add-Content \$cfg "\`nPubkeyAuthentication yes"
                Say 'sshd_config: appended PubkeyAuthentication yes'
              }
              Restart-Service sshd
              Say "sshd restarted, status=\$((Get-Service sshd).Status)"
            }

            # 5) purge-tests.exe 到约定路径
            New-Item -ItemType Directory -Force -Path 'C:\cx\native' | Out-Null
            if (Test-Path 'C:\OEM\purge-tests.exe') {
              Copy-Item 'C:\OEM\purge-tests.exe' 'C:\cx\native\purge-tests.exe' -Force
              Say 'purge-tests.exe deployed'
            } else { Say 'ERROR purge-tests.exe missing from OEM' }

            # 6) 自检：把关键结论写进日志，之后可以从镜像外核对
            Say "verify whoami=\$(whoami)"
            Say "verify exe=\$(Test-Path 'C:\cx\native\purge-tests.exe')"
            Say "verify keys=\$(Test-Path 'C:\ProgramData\ssh\administrators_authorized_keys')"
            # ⚠️ 2026-11-12：宿主侧 SSH 连不上（banner exchange 超时），
            #   而客机内 sshd 显示 Running。必须记录**客机的网络实况**：
            #   IP 地址、网关、sshd 实际监听在哪些地址（0.0.0.0 还是具体 IP）。
            #   只记「监听条数」无法判断 slirp 能不能转发到。
            try {
              \$ips = Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
                Where-Object { \$_.IPAddress -notlike '127.*' } |
                ForEach-Object { "\$(\$_.InterfaceAlias)=\$(\$_.IPAddress)/\$(\$_.PrefixLength)" }
              Say "guest-ip: \$(\$ips -join ', ')"
              StepReport 'GuestIP' (\$ips -join ';')
              \$gw = (Get-NetRoute -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue |
                Select-Object -First 1).NextHop
              Say "guest-gateway: \$gw"
              StepReport 'GuestGateway' "\$gw"
              # sshd 实际监听地址（netstat 的 LocalAddress 列）
              \$ls = netstat -ano | Select-String ':22\s' | ForEach-Object { (\$_ -split '\s+')[1] }
              Say "sshd-listen-addrs: \$(\$ls -join ', ')"
              StepReport 'SshdListenAddrs' (\$ls -join ';')
              # 关键：sshd 是否监听在 0.0.0.0（否则 slirp 转发不进来）
              \$any = \$ls | Where-Object { \$_ -like '0.0.0.0:22' -or \$_ -like '[::]:22' }
              if (\$any) { StepReport 'SshdBoundAny' 'yes' } else { StepReport 'SshdBoundAny' 'NO' }
            } catch { Say "network-diag failed: \$_" }
            StepReport 'VerifyExe' "\$(Test-Path 'C:\cx\native\purge-tests.exe')"
            StepReport 'VerifyKeys' "\$(Test-Path 'C:\ProgramData\ssh\administrators_authorized_keys')"
            # 最终结论行：宿主侧只读这一行就能判断「镜像是好是坏」
            \$sshOk = \$false
            try {
              \$svc = Get-Service sshd -ErrorAction SilentlyContinue
              \$listen = @(Get-NetTCPConnection -LocalPort 22 -State Listen -ErrorAction SilentlyContinue).Count
              if (\$svc -and \$svc.Status -eq 'Running' -and \$listen -gt 0) { \$sshOk = \$true }
            } catch { }
            StepReport 'SSH_VERDICT' \$(if (\$sshOk) { 'READY' } else { 'NOT-READY' })
            Say 'setup done'
          } catch {
            Say "FATAL \$(\$_.Exception.Message)"
            StepReport 'FATAL' \$_.Exception.Message
            StepReport 'SSH_VERDICT' 'SETUP-CRASHED'
          }
          PSSETUP

          printf '%s\n' "$PUBKEY" > "$WORK/oem/id.pub"

          # install.bat：dockur 在安装最后一步执行它。
          #
          # ⚠️ 关键（2026-11-11 修正）：宿主机的 /oem 是**只读输入**，客机往 C:\OEM 写东西
          # 不会回到宿主机。/oem 里那个 install.done 永远等不到 —— 上一版就死在这里。
          # 唯一能把信号送回宿主机的通道是 Samba 共享 \\host.lan\Data（宿主 /data）。
          # 所以下面**两条都要做**：客机内留一份（本地可查），再 copy 一份到共享。
          cat > "$WORK/oem/install.bat" <<'BATEOF'
          @echo off
          setlocal
          echo === CX OEM install begin ===
          del /Q C:\OEM\install.done 2>nul

          REM 执行 setup.ps1（放单独文件而不是内联，避免 bat 的转义地狱）
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\OEM\setup.ps1
          set SETUP_RC=%ERRORLEVEL%
          echo setup.ps1 exit=%SETUP_RC%

          REM 把 setup.log 一并留在 OEM 目录（客机内可查）
          if exist C:\OEM\setup.log type C:\OEM\setup.log

          echo === CX OEM install end ===
          REM 本地标记
          type nul > C:\OEM\install.done

          REM ── 回传到宿主机 /data（唯一有效通道）──
          REM \\host.lan\Data 是 dockur 的 Samba "Data" 共享，对应 docker 的 -v ...:/data。
          REM 先写 .tmp 再 move，避免宿主机读到半截文件（与 dockur 自己 sync-log.bat 同手法）。
          REM ⚠️ bat 的 `if (...) else (...)` 块里用 `&&` 会因解析规则出错，
          REM    所以每个命令单独一行、各自判 errorlevel。
          if exist C:\OEM\setup.log (
            copy /Y C:\OEM\setup.log \\host.lan\Data\setup.tmp >nul 2>&1
            move /Y \\host.lan\Data\setup.tmp \\host.lan\Data\setup.log >nul 2>&1
          )

          copy /Y C:\OEM\install.done \\host.lan\Data\install.tmp >nul 2>&1
          if errorlevel 1 (
            echo WARN could-not-copy-done-to-samba
          ) else (
            move /Y \\host.lan\Data\install.tmp \\host.lan\Data\install.done >nul 2>&1
            echo done-marker-synced
          )

          REM install.log 由 dockur 的 LOG=Y 写入；存在才回传，不硬失败。
          if exist C:\OEM\install.log (
            copy /Y C:\OEM\install.log \\host.lan\Data\install.tmp >nul 2>&1
            move /Y \\host.lan\Data\install.tmp \\host.lan\Data\install.log >nul 2>&1
          )
          BATEOF

          # 去掉 heredoc 的公共前导空格（bat 对行首空格敏感）
          sed -i 's/^          //' "$WORK/oem/install.bat"
          sed -i 's/^          //' "$WORK/oem/setup.ps1"

          echo '=== install.bat 前 12 行 ==='
          head -12 "$WORK/oem/install.bat"
          echo "INSTALL_BAT_BYTES=$(stat -c %s "$WORK/oem/install.bat")"
          echo "SETUP_PS1_BYTES=$(stat -c %s "$WORK/oem/setup.ps1")"
          ls -l "$WORK/oem"

      - name: 启动 dockurr/windows 安装
        if: steps.havecache.outputs.CACHE_HIT != 'yes'
        id: install
        env:
          GUEST_PASSWORD: ${{ github.event.inputs.guest_password || 'Cx-Guest-2026!' }}
          GUEST_USER: ${{ env.GUEST_USER }}
          VERSION: ${{ github.event.inputs.version || '2022' }}
          DISK_SIZE: ${{ github.event.inputs.disk_size || '32G' }}
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          START=$(date +%s)
          echo "INSTALL_START_EPOCH=$START" >> "$GITHUB_OUTPUT"

          # 三个挂载点，各有明确用途（少一个就有一类信息永远看不到）：
          #   /storage  —— 磁盘与 ISO（dockur 的主工作区）
          #   /oem      —— **只读输入**：install.bat + 同目录附件，被 dockur 打进 ISO 的 $OEM$
          #                客机写的东西**不会**回到这里，别拿它当回传通道
          #   /data     —— **双向共享**：对应客机里的 \\host.lan\Data（Samba 的 Data 共享）。
          #                这是唯一能把客机内进度传回宿主机的通道。见下方「等待安装完成」。
          mkdir -p "$WORK/data"
          # 8006 只绑 loopback：仅给本 job 抓安装界面截图用，不对外暴露。
          # ⚠️ 2026-11-12：必须给 NET_ADMIN，否则 dockur 无法创建 bridge/NAT，
          #   会回退到 user-mode networking (passt)。实测日志：
          #     RTNETLINK answers: Operation not permitted
          #     Warning: failed to create bridge. Please add --cap-add NET_ADMIN
          #     Warning: failed to setup NAT networking, falling back to user-mode
          #     Guest: 172.17.0.2 (Windows) | Mode: User (passt)
          #   user-mode 下 `-p 2222:22` 的 docker 端口映射**不生效**，
          #   必须改用 USER_PORTS；更简单的做法是给 NET_ADMIN 让 NAT 正常工作。
          docker run -d --name cxwin \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            --cap-add=NET_RAW \
            -e VERSION="$VERSION" \
            -e DISK_FMT=qcow2 \
            -e DISK_SIZE="$DISK_SIZE" \
            -e USERNAME="$GUEST_USER" \
            -e PASSWORD="$GUEST_PASSWORD" \
            -e LANGUAGE=English \
            -e REGION=en-US \
            -e KEYBOARD=en-US \
            -e LOG=Y \
            -p 127.0.0.1:8006:8006 \
            -v "$WORK/storage:/storage" \
            -v "$WORK/oem:/oem" \
            -v "$WORK/data:/data" \
            docker.io/dockurr/windows:latest
          echo "CONTAINER_ID=$(docker ps -q --filter name=cxwin)"
          echo '=== 镜像版本 ==='
          docker inspect --format '{{.Config.Image}} {{.Image}}' cxwin || true
          echo '=== 挂载确认（/data 必须在，否则进度与完成信号都看不到）==='
          docker inspect --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' cxwin || true

      - name: 等待安装完成
        if: steps.havecache.outputs.CACHE_HIT != 'yes'
        id: wait
        env:
          INSTALL_TIMEOUT: ${{ github.event.inputs.install_timeout_sec || '3600' }}
        run: |
          set -u
          WORK="$RUNNER_TEMP/guest"
          DATA="$WORK/data"
          START=$(date +%s)
          DEADLINE=$(( START + INSTALL_TIMEOUT ))
          RESULT=timeout

          # ── 完成判据（2026-11-11 修正：上一版查错了地方，必然死等）──
          # 旧代码查 `$WORK/oem/install.done` —— 那是宿主机上的 /oem **只读输入**挂载源。
          # 客机写 C:\OEM\install.done 只发生在客机内，永远不会出现在宿主机 /oem 里。
          # 正确的回传通道是 Samba 共享 \\host.lan\Data → 宿主机 /data（见 docker run 的 -v）。
          # 所以这里查 $DATA 下的标记；install.bat 会显式 copy 一份过去。
          DONE_MARKER="$DATA/install.done"
          # 兜底判据：即使 install.done 因故没回传，只要回传的 install.log 里
          # 出现我们的收尾标记，也算完成 —— 一个信号失败不代表流程失败。
          LOG_MARKER_TEXT='CX OEM install end'

          # ── 进度信号：不再用「磁盘总量」──
          # 旧版打 `du -sh storage`，它从 14G 涨到 15G 后就再也不动，完全无法区分
          # 「装完了在等判据」与「卡在某个 Setup 界面」。改为盯**变化**：
          #   · data/install.log 的大小与 mtime（dockur 的 LOG=Y 会持续写）
          #   · docker logs 的行数（dockur 会打安装阶段）
          #   · storage 下 qcow2 的 mtime + 大小
          # 任一项在变 = 在推进；全都不变 = 卡住。
          last_fp=''
          last_change_ts=$START
          stall_reported=no
          stall_threshold=900      # 连续 15 分钟无任何信号变化 ⇒ 判疑似卡死
          tick=0

          fingerprint() {
            # 把三个信号压成一个字符串，用于比较「这次和上次是否一样」。
            local log_size=0 log_mtime=0 qcow_size=0 qcow_mtime=0 dlog_lines=0
            [ -f "$DATA/install.log" ] && {
              log_size=$(stat -c %s "$DATA/install.log" 2>/dev/null || echo 0)
              log_mtime=$(stat -c %Y "$DATA/install.log" 2>/dev/null || echo 0)
            }
            local q
            for q in "$WORK/storage/data.qcow2" "$WORK/storage/windows.qcow2"; do
              if [ -f "$q" ]; then
                qcow_size=$(stat -c %s "$q" 2>/dev/null || echo 0)
                qcow_mtime=$(stat -c %Y "$q" 2>/dev/null || echo 0)
                break
              fi
            done
            dlog_lines=$(docker logs cxwin 2>&1 | wc -l || echo 0)
            echo "log:${log_size}@${log_mtime} qcow:${qcow_size}@${qcow_mtime} dlog:${dlog_lines}"
          }

          report_progress() {
            local fp="$1" now idle
            now=$(date +%s)
            idle=$(( now - last_change_ts ))
            echo "[$(date -u +%T)] tick=${tick} idle=${idle}s  ${fp}"
            # 判据三态：有变化 = 推进；无变化但短于阈值 = 观望；超过阈值 = 疑似卡死
            if [ "$idle" -ge "$stall_threshold" ] && [ "$stall_reported" = no ]; then
              echo "::warning title=疑似卡死::已连续 ${idle}s 无任何进度信号变化"
              echo '--- docker ps ---'
              docker ps -a --filter name=cxwin || true
              echo '--- docker logs 尾部 80 行 ---'
              docker logs cxwin 2>&1 | tail -80 || true
              echo '--- /data 内容 ---'
              ls -la "$DATA" 2>/dev/null || echo '(空或不存在)'
              echo '--- /storage 内容 ---'
              ls -la "$WORK/storage" 2>/dev/null || echo '(空或不存在)'
              stall_reported=yes
            fi
          }

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            tick=$(( tick + 1 ))

            # 完成判据 ①：install.done 已回传到 /data
            if [ -f "$DONE_MARKER" ]; then RESULT=done; break; fi
            # 完成判据 ②：回传的 install.log 里有收尾标记
            if [ -f "$DATA/install.log" ] && grep -q "$LOG_MARKER_TEXT" "$DATA/install.log" 2>/dev/null; then
              RESULT=done-by-log; break
            fi
            # 容器退出 = 安装失败（除非上面已判 done）
            if ! docker ps -q --filter name=cxwin | grep -q .; then
              RESULT=container-exited; break
            fi

            CUR=$(fingerprint)
            if [ "$CUR" != "$last_fp" ]; then
              last_fp="$CUR"
              last_change_ts=$(date +%s)
              stall_reported=no
            fi
            # 每 2 分钟一行（tick % 6，因为 sleep 20）
            if [ $(( tick % 6 )) -eq 1 ]; then
              report_progress "$CUR"
            fi
            sleep 20
          done
          ELAPSED=$(( $(date +%s) - START ))
          echo "INSTALL_RESULT=$RESULT"
          echo "INSTALL_ELAPSED_SEC=$ELAPSED"
          echo "INSTALL_RESULT=$RESULT" >> "$GITHUB_OUTPUT"
          echo "INSTALL_ELAPSED_SEC=$ELAPSED" >> "$GITHUB_OUTPUT"

          echo '=== 完成判据现场 ==='
          echo "DONE_MARKER_EXISTS=$([ -f "$DONE_MARKER" ] && echo yes || echo no)"
          echo "DATA_DIR_LISTING:"
          ls -la "$DATA" 2>/dev/null || echo '(no /data)'
          echo '=== 回传的 install.log 尾部 80 行 ==='
          tail -80 "$DATA/install.log" 2>/dev/null || echo '(no /data/install.log)'
          echo '=== docker logs 尾部 120 行 ==='
          docker logs cxwin 2>&1 | tail -120 || true

          if [ "$RESULT" = timeout ]; then
            echo "::error title=安装超时::${ELAPSED}s 内既没拿到 install.done 也没看到收尾标记"
          elif [ "$RESULT" = container-exited ] && [ ! -f "$DONE_MARKER" ]; then
            echo "::error title=安装容器退出::未见完成标记，见上方 docker logs"
          fi
          case "$RESULT" in
            done|done-by-log) : ;;
            *) exit 1 ;;
          esac

      # ── 失败/超时的完整现场快照 ────────────────────────────────────────────
      # 上一版最大的问题之一：卡住时什么证据都没留下，只能靠猜。
      # 这个步骤在任何非成功结局下都会跑（if: always() 由下一步的 artifact 承担
      # 「一定上传」，这里只负责把证据尽可能抓全）。
      - name: 抓取安装现场快照
        if: steps.havecache.outputs.CACHE_HIT != 'yes' && always()
        id: snapshot
        run: |
          set -u
          WORK="$RUNNER_TEMP/guest"
          SNAP="$RUNNER_TEMP/guest-snapshot"
          mkdir -p "$SNAP"

          echo '=== 收集诊断到'"$SNAP"' ==='
          # 1) 容器状态与日志（最关键：能看出 Setup 走到哪一步、有没有重启循环）
          docker ps -a > "$SNAP/docker-ps-a.txt" 2>&1 || true
          docker inspect cxwin > "$SNAP/docker-inspect.json" 2>&1 || true
          docker logs cxwin > "$SNAP/docker-logs-full.txt" 2>&1 || true
          docker logs cxwin 2>&1 | tail -300 > "$SNAP/docker-logs-tail300.txt" || true

          # 2) 两个挂载点的完整清单（/data 是回传通道，/oem 是输入，对照着看就知道
          #    客机到底有没有写出任何东西）
          ls -laR "$WORK/data" > "$SNAP/data-listing.txt" 2>&1 || true
          ls -laR "$WORK/oem" > "$SNAP/oem-listing.txt" 2>&1 || true
          ls -la "$WORK/storage" > "$SNAP/storage-listing.txt" 2>&1 || true
          du -sh "$WORK/storage" > "$SNAP/storage-size.txt" 2>&1 || true

          # 3) 客机回传的日志（有就全文留档）
          for f in install.log setup.log; do
            if [ -f "$WORK/data/$f" ]; then
              cp "$WORK/data/$f" "$SNAP/data-$f" || true
            fi
          done

          # 4) VNC 截图：dockur 在 8006 暴露 Web Viewer，/snapshot 返回当前画面。
          #    这是唯一能「看见」Windows Setup 卡在哪个界面的手段。
          curl -s --max-time 20 -o "$SNAP/vnc-snapshot.png" \
            "http://127.0.0.1:8006/snapshot" 2>/dev/null || echo 'vnc snapshot failed'
          if [ -f "$SNAP/vnc-snapshot.png" ]; then
            echo "VNC_SNAPSHOT_BYTES=$(stat -c %s "$SNAP/vnc-snapshot.png")"
          else
            echo 'VNC_SNAPSHOT=missing'
          fi

          echo '=== 快照内容 ==='
          ls -la "$SNAP" || true
          echo "SNAP_DIR=$SNAP" >> "$GITHUB_ENV"

      - name: 取出 qcow2 并核对 setup 结果
        if: steps.havecache.outputs.CACHE_HIT != 'yes'
        id: extract
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          SETUP_RC_LINE=$(grep -oE 'setup\.ps1 exit=[0-9]+' "$WORK/data/install.log" 2>/dev/null | tail -1 || true)
          echo "setup.ps1 退出码行：${SETUP_RC_LINE:-（未找到）}"
          echo '=== storage 目录 ==='
          ls -lh "$WORK/storage" || true
          echo '=== /oem（只读输入：install.bat + 附件）==='
          ls -lh "$WORK/oem" || true
          echo '=== /data（客机回传：install.done / install.log / setup.log）==='
          ls -lh "$WORK/data" 2>/dev/null || true
          echo '=== setup.log 全文（从 /data 回传的那份）==='
          cat "$WORK/data/setup.log" 2>/dev/null || echo '(没有回传 setup.log —— install.bat 可能没执行，或 Samba 不可写)'

          # dockur 在 DISK_FMT=qcow2 时落盘 storage/data.qcow2（旧版本是 windows.qcow2）
          SRC=""
          for c in "$WORK/storage/data.qcow2" "$WORK/storage/windows.qcow2"; do
            if [ -f "$c" ]; then SRC="$c"; break; fi
          done
          if [ -z "$SRC" ]; then
            echo '::error title=找不到 qcow2::DISK_FMT=qcow2 可能未生效；storage 里只有：'
            ls -la "$WORK/storage" || true
            exit 1
          fi
          echo "QCOW2_SRC=$SRC"
          echo "QCOW2_RAW_BYTES=$(stat -c %s "$SRC")"
          qemu-img info "$SRC" | head -12
          echo "QCOW2_SRC=$SRC" >> "$GITHUB_OUTPUT"

          # 停容器：它还在占用这个 qcow2
          docker stop cxwin --time 30 2>/dev/null || true
          docker rm -f cxwin 2>/dev/null || true

      - name: 压缩
        if: steps.havecache.outputs.CACHE_HIT != 'yes'
        id: compress
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          SRC="${{ steps.extract.outputs.QCOW2_SRC }}"
          START=$(date +%s)
          qemu-img convert -p -O qcow2 -c "$SRC" "$WORK/guest.qcow2"
          ELAPSED=$(( $(date +%s) - START ))
          SIZE=$(stat -c %s "$WORK/guest.qcow2")
          echo "FINAL_BYTES=$SIZE"
          echo "FINAL_GIB=$(awk -v b="$SIZE" 'BEGIN{printf "%.2f", b/1073741824}')"
          echo "COMPRESS_ELAPSED_SEC=$ELAPSED"
          echo "FINAL_GIB=$(awk -v b="$SIZE" 'BEGIN{printf "%.2f", b/1073741824}')" >> "$GITHUB_OUTPUT"
          echo "FINAL_BYTES=$SIZE" >> "$GITHUB_OUTPUT"
          sha256sum "$WORK/guest.qcow2" | tee "$WORK/guest.qcow2.sha256"
          df -h /

      # ── 离线检查：不启动 Windows 就能判断镜像配好没 ────────────────────────
      #
      # 为什么值得加：SSH 验证要冷启动 Windows（3-7 分钟一轮），
      # 而失败时我们既不知道是「文件没写对」还是「sshd 没起来」。
      # 用 libguestfs 直接读 qcow2 里的 NTFS，能秒级回答：
      #   administrators_authorized_keys 在不在？内容是不是我们的公钥？
      #   purge-tests.exe 在不在？
      #   sshd_config 有没有被改坏？
      # 这样即使 SSH 那一步失败，也能立刻区分「镜像内容错」与「服务没起」。
      #
      # ⚠️ 这不是 SSH 验证的替代品，只是**更快的分类器**：
      #    文件在 ≠ sshd 能连。所以下面失败只警告，不阻断（SSH 才是硬门禁）。
      - name: 离线检查镜像内容（libguestfs）
        if: always()
        id: offline
        run: |
          set -u
          WORK="$RUNNER_TEMP/guest"
          SNAP="$RUNNER_TEMP/guest-snapshot"
          mkdir -p "$SNAP"
          OUT="$SNAP/offline-check.txt"
          : > "$OUT"
          # 镜像可能在两处：本次构建产物，或 cache 恢复出来的
          if [ -f "$WORK/guest.qcow2" ]; then
            IMG="$WORK/guest.qcow2"
          elif [ -f "$GITHUB_WORKSPACE/guest-cache/guest.qcow2" ]; then
            IMG="$GITHUB_WORKSPACE/guest-cache/guest.qcow2"
          else
            IMG=""
          fi
          if [ -z "$IMG" ]; then
            echo "SKIP: 没有 $IMG" | tee -a "$OUT"; exit 0
          fi

          # libguestfs 依赖一个可引导的 appliance；失败就如实记录，不硬做。
          if ! command -v virt-filesystems >/dev/null 2>&1; then
            echo '安装 libguestfs-tools...' | tee -a "$OUT"
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              libguestfs-tools linux-image-generic >/dev/null 2>&1 || true
          fi
          if ! command -v virt-filesystems >/dev/null 2>&1; then
            echo 'SKIP: libguestfs-tools 装不上' | tee -a "$OUT"; exit 0
          fi
          export LIBGUESTFS_BACKEND=direct
          export LIBGUESTFS_MEMSIZE=2048

          echo '=== 分区布局 ===' | tee -a "$OUT"
          # Server 2022 是 GPT：通常 /dev/sda1 = EFI(MSR), /dev/sda2 = MSR,
          # /dev/sda3 = Windows C:。所以不能硬编码 sda2，必须列出来探测。
          virt-filesystems -a "$IMG" --all --long 2>&1 | tee -a "$OUT" || {
            echo 'ERROR virt-filesystems 失败（appliance 起不来？）' | tee -a "$OUT"; exit 0; }

          # 在列出的文件系统里找 Windows 分区：认 /Windows/System32 存在即为 C:
          WINPART=""
          for fs in $(virt-filesystems -a "$IMG" --filesystems 2>/dev/null); do
            if virt-ls -a "$IMG" -m "$fs" /Windows/System32 >/dev/null 2>&1; then
              WINPART="$fs"; break
            fi
          done
          if [ -z "$WINPART" ]; then
            echo 'ERROR 找不到 Windows 分区（NTFS 可能挂不上）' | tee -a "$OUT"; exit 0
          fi
          echo "WINDOWS_PARTITION=$WINPART" | tee -a "$OUT"

          # 逐项核对镜像里该有的东西
          echo '=== /ProgramData/ssh ===' | tee -a "$OUT"
          virt-ls -a "$IMG" -m "$WINPART" /ProgramData/ssh 2>&1 | tee -a "$OUT" || true

          AK_EXISTS=no
          if virt-ls -a "$IMG" -m "$WINPART" /ProgramData/ssh 2>/dev/null | grep -qx 'administrators_authorized_keys'; then
            AK_EXISTS=yes
            echo '=== administrators_authorized_keys 内容 ===' | tee -a "$OUT"
            virt-cat -a "$IMG" -m "$WINPART" /ProgramData/ssh/administrators_authorized_keys 2>&1 | tee -a "$OUT" || true
            # 与本次使用的公钥比对（去掉注释差异后比较 base64 主体）
            V_PUB=$(virt-cat -a "$IMG" -m "$WINPART" /ProgramData/ssh/administrators_authorized_keys 2>/dev/null \
                    | awk '{print $2}' | head -1)
            L_PUB=$(awk '{print $2}' "$WORK/id.pub" 2>/dev/null | head -1)
            if [ -n "$V_PUB" ] && [ "$V_PUB" = "$L_PUB" ]; then
              echo 'PUBKEY_MATCH=yes' | tee -a "$OUT"
            else
              echo "PUBKEY_MATCH=no (image=${V_PUB:-none} local=${L_PUB:-none})" | tee -a "$OUT"
            fi
          fi
          echo "AUTHORIZED_KEYS_EXISTS=$AK_EXISTS" | tee -a "$OUT"

          EXE=no
          if virt-ls -a "$IMG" -m "$WINPART" /cx/native 2>/dev/null | grep -qx 'purge-tests.exe'; then
            EXE=yes
          fi
          echo "PURGE_TESTS_EXISTS=$EXE" | tee -a "$OUT"

          # OpenSSH 是否真的装进了 System32\OpenSSH（这是 Add-WindowsCapability 的落地证据）
          SSH_BIN=no
          if virt-ls -a "$IMG" -m "$WINPART" /Windows/System32/OpenSSH >/dev/null 2>&1; then
            SSH_BIN=yes
            echo '=== /Windows/System32/OpenSSH ===' | tee -a "$OUT"
            virt-ls -a "$IMG" -m "$WINPART" /Windows/System32/OpenSSH 2>&1 | tee -a "$OUT" || true
          fi
          echo "OPENSSH_BINARIES_EXISTS=$SSH_BIN" | tee -a "$OUT"

          echo '=== 汇总 ===' | tee -a "$OUT"
          {
            echo "OFFLINE_AUTHORIZED_KEYS=$AK_EXISTS"
            echo "OFFLINE_PURGE_TESTS=$EXE"
            echo "OFFLINE_OPENSSH_BINARIES=$SSH_BIN"
          } >> "$GITHUB_OUTPUT"

          # 明确区分「装好了」与「装了一半」—— 这是本步骤的核心价值
          if [ "$AK_EXISTS" = yes ] && [ "$EXE" = yes ] && [ "$SSH_BIN" = yes ]; then
            echo 'OFFLINE_VERDICT=image-configured-correctly' | tee -a "$OUT"
          else
            echo "OFFLINE_VERDICT=image-incomplete (keys=$AK_EXISTS exe=$EXE sshbin=$SSH_BIN)" | tee -a "$OUT"
            echo "::warning title=镜像离线检查不完整::keys=$AK_EXISTS exe=$EXE openssh=$SSH_BIN —— 若 SSH 也失败，优先查 Add-WindowsCapability 是否拉不到 Windows Update"
          fi
          # 只看文件不阻断：文件在也不代表 sshd 能连，SSH 那步才是硬门禁。

      # ── 关键：在“验证 SSH”**之前**先传一次证据 ────────────────────────────
      #
      # 2026-11-11（t111）用 API 查出来：上一轮 run 43018341765 里
      #   step 14「验证 SSH 可连」 status=in_progress conclusion=NULL
      #   step 15..18（含 if: always() 的上传）status=pending conclusion=NULL
      # 也就是说 **job 在 SSH 步骤运行期间被强制终止**，后面的 always() 步骤
      # 根本没轮到执行 —— 所以 artifact total_count=0，不是路径写错，也不是
      # if-no-files-found 把它吞了，是**那些步骤从未被调度**。
      #
      # 所以必须在上传步骤**位置上也往前挪**：SSH 之前先传一次“装完后的现场”。
      # 这样即使 SSH 步骤把 job 挂死/被 timeout 杀掉，前面这段证据也已经落地。
      # 名字带 -early 后缀，避免与最后那次全量快照互相覆盖。
      - name: 先传一次证据（SSH 验证之前）
        id: snap-early
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-image-diagnostics-early
          compression-level: 0
          path: |
            ${{ runner.temp }}/guest-snapshot/
            ${{ runner.temp }}/guest/data/
            ${{ runner.temp }}/guest/oem/install.bat
            ${{ runner.temp }}/guest/oem/setup.ps1
            ${{ runner.temp }}/guest/guest.qcow2.sha256
          if-no-files-found: warn
          retention-days: 7

      # ── 硬验收：SSH 真的能连上 ─────────────────────────────────────────────
      # 不验证就交付 = 给下游一个黑盒。ci.yml 那边会因为「连不上」浪费 45 分钟。
      # ── 把镜像就位（cache 命中 与 构建完成 两条路都要走到同一个路径）──
      - name: 把镜像放到验证用目录
        id: placeimg
        run: |
          set -u
          WORK="$RUNNER_TEMP/guest"
          mkdir -p "$WORK/run-storage"
          # 构建路径：qcow2 已由「压缩」步骤产出到 $WORK/guest.qcow2
          # cache 路径：镜像在 $GITHUB_WORKSPACE/guest-cache/guest.qcow2
          SRC=""
          if [ -f "$WORK/guest.qcow2" ]; then
            SRC="$WORK/guest.qcow2"; echo "镜像来源: 本次构建"
          elif [ -f "$GITHUB_WORKSPACE/guest-cache/guest.qcow2" ]; then
            SRC="$GITHUB_WORKSPACE/guest-cache/guest.qcow2"; echo "镜像来源: cache"
          fi
          if [ -z "$SRC" ]; then
            echo "::error title=没有可用镜像::既没构建出 guest.qcow2，cache 也没命中"
            exit 1
          fi
          cp "$SRC" "$WORK/run-storage/data.qcow2"
          # ⚠️ 2026-11-12：cache 路径下，windows.* 状态文件也在 guest-cache 里。
          #   dockur 靠它们判断「已安装」，缺了就会静默重装系统。
          #   构建路径的状态文件在 $WORK/storage（由验证步骤自己复制）。
          if [ -d "$GITHUB_WORKSPACE/guest-cache" ]; then
            for f in "$GITHUB_WORKSPACE/guest-cache"/windows.*; do
              [ -e "$f" ] || continue
              cp -a "$f" "$WORK/run-storage/"
              echo "  从 cache 恢复状态文件 $(basename "$f")"
            done
          fi
          SIZE=$(stat -c %s "$WORK/run-storage/data.qcow2")
          echo "run-storage/data.qcow2 = $SIZE 字节"
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "::error title=镜像体积异常::只有 $SIZE 字节"
            exit 1
          fi
          echo "IMG_SRC=$SRC" >> "$GITHUB_ENV"

      - name: 验证 SSH 可连（docker bridge，与安装时同网络）
        id: verify
        # ⚠️ 2026-11-12 决定性发现（run 43147209781 诊断）：
        #   客机内 GuestIP = 172.17.0.2/24，GuestGateway = 172.17.0.1
        #   —— 这是 Docker 默认网桥地址，被**持久化进镜像**。
        #   dockur 装 Windows 时用 docker bridge，Windows 就记住了这个配置。
        #   而我之前用 QEMU slirp（10.0.2.x 网段）启动同一镜像，
        #   网卡地址与网关不匹配 ⇒ 包发不出去 ⇒ 宿主侧 banner 超时。
        #   ⇒ 验证必须复用 docker bridge，与安装时一致。
        timeout-minutes: 15
        run: |
          set -u
          WORK="$RUNNER_TEMP/guest"
          SNAP="$RUNNER_TEMP/guest-snapshot"
          mkdir -p "$SNAP"
          VERIFY_LOG="$SNAP/ssh-verify.txt"
          : > "$VERIFY_LOG"

          echo "=== 用 docker bridge 启动镜像 ===" | tee -a "$VERIFY_LOG"
          # ⚠️ 2026-11-12 关键修正：dockur 靠**一整套状态文件**判断「已安装」，
          #   不是只看 qcow2。install.sh 的 getSystemImage 读 `readState "system"`，
          #   hasCompletedInstall 还要 hasSystemImage || (hasData && hasBootMarker)。
          #   状态文件是 storage 下的 windows.* 系列：
          #     windows.base / windows.ver / windows.mac / windows.rom /
          #     windows.vars / windows.system（记录 img 文件名）
          #   上一轮我只复制了 data.qcow2 ⇒ dockur 认为「没有现成系统」⇒
          #   日志里出现 `Requesting Windows Server 2022 ... Downloading ...`（重新下载 ISO 重装）。
          #   ⇒ 必须把**整套 storage** 复制过去（除了 ISO / setup.img 这些大文件）。
          mkdir -p "$WORK/run-storage"
          # ⚠️ 2026-11-12：只有**本次构建**才有 $WORK/storage 目录。
          #   cache 路径下镜像已由「把镜像放到验证用目录」就位，这里跳过。
          if [ -d "$WORK/storage" ]; then
            echo "=== 复制整套 storage 状态（排除 ISO 与 setup.img）===" | tee -a "$VERIFY_LOG"
            for f in "$WORK/storage"/*; do
              [ -e "$f" ] || continue
              bn=$(basename "$f")
              case "$bn" in
                *.iso|setup.img) echo "  跳过 $bn（安装介质，验证时不需要）" | tee -a "$VERIFY_LOG" ;;
                data.qcow2)      echo "  跳过 $bn（已由 placeimg 就位）" | tee -a "$VERIFY_LOG" ;;
                *)
                  cp -a "$f" "$WORK/run-storage/" 2>/dev/null \
                    && echo "  复制 $bn ($(stat -c %s "$f" 2>/dev/null || echo ?) 字节)" | tee -a "$VERIFY_LOG" \
                    || echo "  复制失败 $bn" | tee -a "$VERIFY_LOG"
                  ;;
              esac
            done
          else
            echo "无 $WORK/storage（cache 路径），跳过状态文件复制" | tee -a "$VERIFY_LOG"
          fi
          echo "=== run-storage 内容 ===" | tee -a "$VERIFY_LOG"
          ls -la "$WORK/run-storage" | tee -a "$VERIFY_LOG"
          # 关键断言：windows.system 或 data.qcow2 必须存在，否则 dockur 会重装
          if [ ! -f "$WORK/run-storage/data.qcow2" ]; then
            echo "::error title=run-storage 缺少 data.qcow2::后续 dockur 会重新安装" | tee -a "$VERIFY_LOG"
            exit 1
          fi

          # ⚠️ 2026-11-12：这一段必须完整 —— 上一轮我的替换把 `docker run` 头部删掉了，
          #   只剩 `-e DISK_SIZE=32G \` 这些孤立残片，导致 shell 报 `-e: command not found`。
          #   与之前「注释插进续行」是同一类错误（续行结构被破坏）。
          docker rm -f cxverify >/dev/null 2>&1 || true
          # ⚠️ 2026-11-12：必须给 NET_ADMIN，否则 dockur 无法创建 bridge/NAT，
          #   会回退到 user-mode networking (passt)。实测日志：
          #     RTNETLINK answers: Operation not permitted
          #     Warning: failed to create bridge. Please add --cap-add NET_ADMIN
          #     Warning: failed to setup NAT networking, falling back to user-mode
          #     Guest: 172.17.0.2 (Windows) | Mode: User (passt)
          #   user-mode 下 `-p 2222:22` 的 docker 端口映射**不生效**，
          #   必须改用 USER_PORTS；更简单的做法是给 NET_ADMIN 让 NAT 正常工作。
          docker run -d --name cxverify \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            --cap-add=NET_RAW \
            -e VERSION=2022 \
            -e DISK_FMT=qcow2 \
            -e DISK_SIZE=32G \
            -e USERNAME="${GUEST_USER}" \
            -e PASSWORD="Cx-Guest-2026!" \
            -p 127.0.0.1:2222:22 \
            -v "$WORK/run-storage:/storage" \
            docker.io/dockurr/windows:latest >> "$VERIFY_LOG" 2>&1
          echo "docker run rc=$?" | tee -a "$VERIFY_LOG"

          sleep 10
          echo "=== 容器状态 ===" | tee -a "$VERIFY_LOG"
          docker ps -a --filter name=cxverify | tee -a "$VERIFY_LOG" || true
          echo "=== 容器日志前 40 行 ===" | tee -a "$VERIFY_LOG"
          docker logs cxverify 2>&1 | head -40 | tee -a "$VERIFY_LOG" || true

          SSH="ssh -i $WORK/id -p 2222 -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
               -o ConnectionAttempts=1 -o BatchMode=yes -o LogLevel=ERROR"
          READY=no
          ATTEMPT=0
          DEADLINE=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            ATTEMPT=$(( ATTEMPT + 1 ))
            if (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then
              exec 3>&- 2>/dev/null || true
              if $SSH -vvv "${GUEST_USER}@127.0.0.1" "whoami" > /tmp/whoami.txt 2>"$SNAP/ssh-vvv-$ATTEMPT.txt"; then
                READY=yes; break
              fi
              echo "attempt=$ATTEMPT ssh-failed" >> "$VERIFY_LOG"
            else
              echo "attempt=$ATTEMPT tcp-connect-failed" >> "$VERIFY_LOG"
            fi
            sleep 15
          done
          echo "SSH_READY=$READY attempts=$ATTEMPT" | tee -a "$VERIFY_LOG"

          if [ "$READY" = yes ]; then
            echo "=== SSH 实测成功 ===" | tee -a "$VERIFY_LOG"
            cat /tmp/whoami.txt | tee -a "$VERIFY_LOG"
            $SSH "${GUEST_USER}@127.0.0.1" \
              "powershell -NoProfile -Command \"(Get-Service sshd).Status; Test-Path C:/cx/native/purge-tests.exe\"" \
              2>&1 | tee -a "$VERIFY_LOG" || true
          else
            echo "::error title=SSH 连不上::镜像不可用" | tee -a "$VERIFY_LOG"
            echo "--- 最后一次 ssh -vvv ---" | tee -a "$VERIFY_LOG"
            tail -40 "$SNAP/ssh-vvv-$ATTEMPT.txt" 2>/dev/null | tee -a "$VERIFY_LOG" || true
            echo "--- 容器日志尾 80 行 ---" | tee -a "$VERIFY_LOG"
            docker logs cxverify 2>&1 | tail -80 | tee -a "$VERIFY_LOG" || true
          fi

          echo "SSH_READY=$READY" >> "$GITHUB_OUTPUT"
          docker stop cxverify >/dev/null 2>&1 || true
          docker rm -f cxverify >/dev/null 2>&1 || true
          [ "$READY" = yes ] || exit 1
      - name: 存入 Actions Cache
        if: steps.verify.outputs.SSH_READY == 'yes' && steps.havecache.outputs.CACHE_HIT != 'yes'
        run: |
          set -eu
          WORK="$RUNNER_TEMP/guest"
          CACHE_OUT="$GITHUB_WORKSPACE/guest-cache"
          mkdir -p "$CACHE_OUT"
          # ⚠️ 2026-11-12 关键：不能只存 qcow2。
          #   dockur 靠**一整套 windows.* 状态文件**判断「已安装」
          #   （getSystemImage 读 readState "system"；hasCompletedInstall 要
          #   hasSystemImage || (hasData && hasBootMarker)）。
          #   只存 qcow2 会让恢复后的验证静默重新下载 ISO 重装（实测过）。
          cp "$WORK/guest.qcow2" "$CACHE_OUT/"
          cp "$WORK/guest.qcow2.sha256" "$CACHE_OUT/"
          # 状态文件：体积小（windows.rom 3.6MB 最大），必须一起存
          for f in "$WORK/storage"/windows.*; do
            [ -e "$f" ] || continue
            bn=$(basename "$f")
            cp -a "$f" "$CACHE_OUT/"
            echo "  缓存状态文件 $bn ($(stat -c %s "$f") 字节)"
          done
          # ⚠️ 2026-11-12（run 43190313294 实测）：**必须把密钥对一起存**。
          #   镜像里的 C:\ProgramData\ssh\administrators_authorized_keys 是
          #   **构建那一刻**写进去的公钥（见 OEM setup.ps1 的 Set-Content）。
          #   cache 命中时不重建镜像 ⇒ 客机里仍是旧公钥。
          #   而「生成 SSH 密钥」每次运行都生成**新的**密钥对
          #   ⇒ 新私钥对旧公钥 ⇒ sshd 回 type 51（拒绝）⇒ Permission denied。
          #   正确做法：把这次构建用的密钥对一起缓存，restore 时用它替换掉
          #   「生成 SSH 密钥」刚生成的那对（见「从 cache 恢复客机镜像」后的处理）。
          #   私钥落在 Actions Cache 里是可接受的：cache 仅本仓库可读，且镜像本身
          #   已含对应公钥，泄露私钥等价于泄露这个一次性测试客机的访问权。
          cp "$WORK/id"     "$CACHE_OUT/guest-key"
          cp "$WORK/id.pub" "$CACHE_OUT/guest-key.pub"
          chmod 600 "$CACHE_OUT/guest-key"
          echo "  缓存密钥对 guest-key / guest-key.pub"
          echo "  公钥指纹: $(ssh-keygen -l -f "$CACHE_OUT/guest-key.pub" | awk '{print $2}')"
          echo "=== cache 内容 ==="
          ls -lh "$CACHE_OUT"
          # 断言：至少要有 qcow2 + 一个状态文件
          NSTATE=$(ls "$CACHE_OUT"/windows.* 2>/dev/null | wc -l)
          echo "状态文件数 = $NSTATE"
          if [ "$NSTATE" -lt 3 ]; then
            echo "::warning title=状态文件偏少::只有 $NSTATE 个，恢复后可能触发重装"
          fi
          echo "CACHE_DIR=$CACHE_OUT" >> "$GITHUB_ENV"


      - name: 保存到 cache
        if: steps.verify.outputs.SSH_READY == 'yes' && steps.havecache.outputs.CACHE_HIT != 'yes'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: ${{ env.CACHE_KEY }}

      - name: 结论写入 Step Summary
        if: always()
        env:
          INSTALL_ELAPSED: ${{ steps.wait.outputs.INSTALL_ELAPSED_SEC }}
          INSTALL_RESULT: ${{ steps.wait.outputs.INSTALL_RESULT }}
          FINAL_GIB: ${{ steps.compress.outputs.FINAL_GIB }}
          SSH_READY: ${{ steps.verify.outputs.SSH_READY }}
        run: |
          set -u
          {
            echo '## Windows 客机镜像打包结果'
            echo ''
            echo '| 项 | 值 |'
            echo '| --- | --- |'
            echo "| 安装结果 | ${INSTALL_RESULT:-未执行} |"
            echo "| 安装耗时 | ${INSTALL_ELAPSED:-?} s |"
            echo "| 压缩后体积 | ${FINAL_GIB:-?} GiB |"
            echo "| SSH 验证 | ${SSH_READY:-未执行} |"
            echo "| cache key | \`$CACHE_KEY\` |"
            echo ''
            if [ "${SSH_READY:-}" = yes ]; then
              echo '### ✅ 镜像可用，已存入 cache'
              echo ''
              echo '接下来在仓库设置：'
              echo ''
              echo '- secret `CX_QEMU_GUEST_SSH_KEY` = 匹配本次公钥的私钥'
              echo '- ci.yml 侧用 `actions/cache/restore@v4` 取回，'
              echo "  key = \`$CACHE_KEY\`"
              echo ''
              echo '> cache 7 天未访问会被清理；ci.yml 每次 push 都 restore 就会续期。'
            else
              echo '### ❌ 未产出可用镜像'
              echo ''
              echo '不要把它配给 ci.yml —— 那边会因 SSH 连不上而红。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 无论成败都上传现场快照 —— 上一版卡了 45 分钟却什么都没留下，只能靠猜。
      # 判据：只要有快照目录就传（`if: always()` 保证失败时也跑）。
      - name: 上传安装现场快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-image-diagnostics
          compression-level: 0
          path: |
            ${{ runner.temp }}/guest-snapshot/
            ${{ runner.temp }}/guest/oem/install.bat
            ${{ runner.temp }}/guest/oem/setup.ps1
            ${{ runner.temp }}/guest/oem/install.done
          if-no-files-found: warn
          retention-days: 7



  summary:
    name: 持续集成汇总
    runs-on: ubuntu-24.04
    needs: [build-guest-image, source, windows-build, windows-unit, windows-pause, windows-window, windows-browser, windows-release, windows-real-client-discovery, windows-real-client, gate, kvm-probe, wiring-probe, qemu-shutdown-destruct, qemu-destruct-linux-guest]
    if: always()
    steps:
      - name: 输出各环境结果与发布产物
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          WINDOWS_BUILD_RESULT: ${{ needs.windows-build.result }}
          WINDOWS_UNIT_RESULT: ${{ needs.windows-unit.result }}
          WINDOWS_PAUSE_RESULT: ${{ needs.windows-pause.result }}
          WINDOWS_WINDOW_RESULT: ${{ needs.windows-window.result }}
          WINDOWS_BROWSER_RESULT: ${{ needs.windows-browser.result }}
          WINDOWS_RELEASE_RESULT: ${{ needs.windows-release.result }}
          WINDOWS_REAL_CLIENT_DISCOVERY_RESULT: ${{ needs.windows-real-client-discovery.result }}
          WINDOWS_REAL_CLIENT_RESULT: ${{ needs.windows-real-client.result }}
          KVM_PROBE_RESULT: ${{ needs.kvm-probe.result }}
          WIRING_PROBE_RESULT: ${{ needs.wiring-probe.result }}
          WIRING_PROBE_OUTCOME: ${{ needs.wiring-probe.result }}
          QEMU_DESTRUCT_RESULT: ${{ needs.qemu-shutdown-destruct.result }}
          QEMU_LINUX_DESTRUCT_RESULT: ${{ needs.qemu-destruct-linux-guest.result }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          KVM_PROBE_SKIPPED: ${{ needs.kvm-probe.outputs.skipped }}
          KVM_PROBE_REASON: ${{ needs.kvm-probe.outputs.reason }}
          RELEASE_ARTIFACT_URL: ${{ needs.windows-release.outputs.release-artifact-url }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result_label() {
            case "$1" in
              success) echo '通过' ;;
              failure) echo '失败' ;;
              cancelled) echo '已取消' ;;
              skipped) echo '已跳过' ;;
              *) echo '未执行' ;;
            esac
          }
          {
            echo '## 持续集成结果'
            echo
            echo '| 验证环境 | 结果 |'
            echo '| --- | --- |'
            printf '| Ubuntu 类型检查与扩展构建 | %s |\n' "$(result_label "$SOURCE_RESULT")"
            printf '| Windows 构建共享产物 | %s |\n' "$(result_label "$WINDOWS_BUILD_RESULT")"
            printf '| Windows 单元与原生测试 | %s |\n' "$(result_label "$WINDOWS_UNIT_RESULT")"
            printf '| Windows 标签页暂停隔离回归 | %s |\n' "$(result_label "$WINDOWS_PAUSE_RESULT")"
            printf '| Windows 可见窗口与浏览器会话 | %s |\n' "$(result_label "$WINDOWS_WINDOW_RESULT")"
            printf '| Windows 浏览器回归 | %s |\n' "$(result_label "$WINDOWS_BROWSER_RESULT")"
            printf '| Windows 发布包验证 | %s |\n' "$(result_label "$WINDOWS_RELEASE_RESULT")"
            printf '| 真实客户端矩阵发现 | %s |\n' "$(result_label "$WINDOWS_REAL_CLIENT_DISCOVERY_RESULT")"
            printf '| 真实客户端自动发现注入矩阵 | %s |\n' "$(result_label "$WINDOWS_REAL_CLIENT_RESULT")"
            if [[ "$KVM_PROBE_SKIPPED" == "yes" ]]; then
              printf '| KVM 能力巡检（只读，非关机自毁） | 跳过（%s） |\n' "$KVM_PROBE_REASON"
            else
              printf '| KVM 能力巡检（只读，非关机自毁） | %s |\n' "$(result_label "$KVM_PROBE_RESULT")"
            fi
            printf '| 自毁续删语义验证（托管 runner，两阶段） | %s |\n' "$(result_label "$WIRING_PROBE_RESULT")"
            printf '| 关机自毁（托管 Ubuntu + QEMU + KVM） | %s |\n' "$(result_label "$QEMU_DESTRUCT_RESULT")"
            printf '| 关机销毁/开机续删（QEMU + Linux 客机，真实重启） | %s |\n' "$(result_label "$QEMU_LINUX_DESTRUCT_RESULT")"
            if [[ -n "$GATE_REASON" ]]; then
              printf '| 判重闸说明 | %s |\n' "$GATE_REASON"
            fi
            echo
            if [[ -n "$RELEASE_ARTIFACT_URL" ]]; then
              printf '[下载 Windows 发布包](%s)\n' "$RELEASE_ARTIFACT_URL"
            else
              echo 'Windows 发布包未生成或上传失败。'
            fi
            echo
            printf '代码提交：`%s`\n' "$COMMIT_SHA"
            printf '\n[查看完整运行日志](%s)\n' "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
