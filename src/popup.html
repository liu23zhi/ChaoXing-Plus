<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>超星学习助手</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        /* 与悬浮面板同一套语义色：正文 9.65:1、说明 7.6:1、弱化 5.1:1（均 ≥ WCAG AA 4.5:1）。 */
        --ink: #7a1039;
        --ink-muted: #8a1a4d;
        --ink-subtle: #7d2f52;
        --line: rgba(244, 114, 182, 0.24);
        --line-strong: rgba(219, 39, 119, 0.34);
        --surface: #fffafd;
        --surface-strong: #ffffff;
        --accent: #db2777;
        --accent-deep: #be185d;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 0;
        min-height: 100%;
      }

      body {
        margin: 0;
        width: 440px;
        max-width: 100%;
        min-width: 320px;
        padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        display: grid;
        align-content: center;
        background: linear-gradient(180deg, #fff0f7 0%, #fffafd 52%, #ffecf4 100%);
        color: var(--ink);
      }

      .card {
        display: grid;
        gap: 12px;
        padding: 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid var(--line);
        /* 紧凑阴影：与悬浮面板同一策略，不用大半径光晕。 */
        box-shadow: 0 10px 28px rgba(190, 24, 93, 0.14), 0 2px 8px rgba(190, 24, 93, 0.10);
        width: 100%;
        max-width: 440px;
        margin-inline: auto;
      }

      /* 标题靠字号 + 字重 + 下方间距三项与正文区分，不只靠颜色。 */
      .title {
        font-size: 18px;
        font-weight: 800;
        line-height: 1.35;
        letter-spacing: 0.01em;
      }

      .desc {
        font-size: 13px;
        line-height: 1.65;
        color: var(--ink-muted);
      }

      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 32px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        cursor: pointer;
      }

      .switch-copy {
        display: grid;
        gap: 2px;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .switch-label {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.4;
      }

      .switch-state {
        font-size: 12px;
        line-height: 1.4;
        color: var(--ink-subtle);
      }

      .switch {
        position: relative;
        flex: 0 0 auto;
        width: 46px;
        height: 26px;
      }

      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .switch-track {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: #cbd5e1;
        transition: background 0.2s ease;
      }

      .switch-thumb {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
        transition: transform 0.2s ease;
      }

      .switch input:checked ~ .switch-track {
        background: linear-gradient(135deg, #db2777 0%, #be185d 100%);
      }

      .switch input:checked ~ .switch-thumb {
        transform: translateX(20px);
      }

      .switch input:focus-visible ~ .switch-track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .note {
        font-size: 12px;
        line-height: 1.6;
        color: var(--ink-subtle);
      }

      .button {
        appearance: none;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        padding: 10px 14px;
        min-height: 44px;
        font-size: 14px;
        font-weight: 800;
        color: #ffffff;
        background: linear-gradient(135deg, #db2777 0%, #be185d 100%);
        box-shadow: 0 10px 24px rgba(190, 24, 93, 0.24);
        cursor: pointer;
      }

      .button:hover {
        filter: brightness(1.03);
      }

      @media (max-width: 480px) {
        body {
          width: 100%;
          min-height: 0;
          max-height: 85dvh;
          overflow-y: auto;
          padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
          display: block;
        }

        .card {
          gap: 14px;
          padding: 16px;
          border-radius: 14px;
          max-width: 100%;
        }

        .title {
          font-size: 17px;
        }

        .desc,
        .note {
          font-size: 12px;
        }

        .switch-row {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <section class="card">
      <div class="title">超星学习助手</div>
      <div class="desc">为 chaoxing.com 打造的自动学习与自动搜题扩展：视频自动播放、章节测验、作业与考试自动答题。</div>
      <label class="switch-row" for="extension-enabled">
        <span class="switch-copy">
          <span class="switch-label">启用扩展</span>
          <span class="switch-state" id="extension-enabled-state">已启用</span>
        </span>
        <span class="switch">
          <input id="extension-enabled" type="checkbox" role="switch" checked />
          <span class="switch-track"></span>
          <span class="switch-thumb"></span>
        </span>
      </label>
      <div class="note">关闭后超星页面不再运行自动学习与答题；切换后已打开的页面会自动刷新。</div>
      <button id="open-chaoxing" class="button" type="button">打开超星官网</button>
    </section>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
